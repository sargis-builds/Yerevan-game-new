<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1020">
<link rel="manifest" href='data:application/manifest+json,{"name":"Yerevan 3D","short_name":"Yerevan","display":"fullscreen","orientation":"landscape","start_url":".","background_color":"#0a1020","theme_color":"#0a1020"}'>
<title>Երևան · 3D</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   GLOBAL RESET + FULLSCREEN + SAFE AREA
   ═══════════════════════════════════════════════════════════════ */
*{
  margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif
}
html,body{
  width:100vw;height:100vh;height:100dvh;
  overflow:hidden;background:#0a1020;color:#fff;
  touch-action:none;overscroll-behavior:none;
  position:fixed;inset:0
}
#app{position:fixed;inset:0;overflow:hidden}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

/* ═══════════════════════════════════════════════════════════════
   HUD PANELS
   ═══════════════════════════════════════════════════════════════ */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.panel{
  background:linear-gradient(165deg,rgba(255,255,255,.94),rgba(230,238,250,.88));
  border:1px solid rgba(30,60,110,.2);
  border-radius:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,20,60,.2);
  color:#0a1a30
}
#topLeft{
  position:absolute;
  top:calc(12px + env(safe-area-inset-top));
  left:calc(12px + env(safe-area-inset-left));
  padding:9px 16px;z-index:12
}
#lvlName{font-size:10px;letter-spacing:2.5px;color:#3a6ea5;font-weight:800}
#locName{font-size:19px;font-weight:800;margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#topRight{
  position:absolute;
  top:calc(12px + env(safe-area-inset-top));
  right:calc(12px + env(safe-area-inset-right));
  padding:9px 16px;text-align:right;min-width:120px;z-index:12
}
#spdVal{font-size:32px;font-weight:900;line-height:1;color:#0a1a30}
#spdUnit{font-size:10px;color:#3a6ea5;letter-spacing:3px;font-weight:700;margin-top:1px}

#minimapWrap{
  position:absolute;
  top:calc(80px + env(safe-area-inset-top));
  left:calc(12px + env(safe-area-inset-left));
  width:132px;height:132px;
  border-radius:14px;overflow:hidden;
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 4px 16px rgba(0,20,60,.35);
  background:#1a2a3a;z-index:12
}
#minimap{width:100%;height:100%;display:block}

#compass{
  position:absolute;
  top:calc(226px + env(safe-area-inset-top));
  left:calc(12px + env(safe-area-inset-left));
  padding:6px 12px;text-align:center;z-index:12
}
#compassArrow{font-size:20px;color:#0a1a30;display:block;transition:transform .1s}
#compassN{font-size:9px;font-weight:900;color:#e11d48;letter-spacing:2px}

/* ═══════════════════════════════════════════════════════════════
   CONTROL BUTTONS
   ═══════════════════════════════════════════════════════════════ */
#controls{position:absolute;inset:0;z-index:20;pointer-events:none}
.btn{
  position:absolute;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(210,225,245,.92));
  border:2.5px solid rgba(50,90,150,.45);
  box-shadow:0 8px 22px rgba(0,20,60,.3),inset 0 2px 0 rgba(255,255,255,.8);
  color:#1a3050;font-weight:900;
  transition:transform .08s,background .12s;
  touch-action:none;font-family:system-ui,sans-serif
}
.btn:active,.btn.on{
  transform:scale(.94);
  background:linear-gradient(160deg,rgba(120,180,255,.96),rgba(70,130,220,.96));
  border-color:rgba(30,80,160,.9);color:#fff
}
#btnL{
  left:calc(20px + env(safe-area-inset-left));
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:96px;height:96px;font-size:36px
}
#btnR{
  left:calc(128px + env(safe-area-inset-left));
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:96px;height:96px;font-size:36px
}
#btnGas{
  right:calc(20px + env(safe-area-inset-right));
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:112px;height:112px;font-size:15px;letter-spacing:2px;
  border-color:rgba(40,160,80,.55);color:#0a6030
}
#btnGas:active,#btnGas.on{background:linear-gradient(160deg,rgba(70,220,120,.96),rgba(30,150,70,.96));color:#fff}
#btnRev{
  right:calc(148px + env(safe-area-inset-right));
  bottom:calc(28px + env(safe-area-inset-bottom));
  width:88px;height:88px;font-size:13px;letter-spacing:1.5px;
  border-color:rgba(200,60,60,.55);color:#a02020
}
#btnRev:active,#btnRev.on{background:linear-gradient(160deg,rgba(255,80,80,.96),rgba(180,30,30,.96));color:#fff}

/* Camera drag zone — upper-right quadrant, avoids buttons */
#camZone{
  position:absolute;top:0;right:0;
  width:62%;height:56%;
  z-index:11;pointer-events:auto;touch-action:none
}

/* ═══════════════════════════════════════════════════════════════
   LOADER SCREEN
   ═══════════════════════════════════════════════════════════════ */
#loader{
  position:absolute;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;
  background:radial-gradient(ellipse at 50% 40%,#16264a,#040810 75%);
  transition:opacity .6s ease-out
}
#loader.done{opacity:0;pointer-events:none}
#loaderTitle{
  font-size:clamp(34px,7vw,58px);font-weight:900;letter-spacing:14px;
  background:linear-gradient(90deg,#7dd3fc,#fbbf24,#f472b6,#7dd3fc);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 3s linear infinite;
  text-shadow:0 0 60px rgba(120,180,255,.5)
}
@keyframes shine{to{background-position:300% 0}}
#loaderSub{font-size:11px;letter-spacing:7px;color:#8ea8c8;font-weight:700}
#barWrap{
  width:280px;height:6px;border-radius:3px;
  background:rgba(255,255,255,.13);overflow:hidden;
  box-shadow:0 0 24px rgba(120,180,255,.35);margin-top:8px
}
#barFill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#7dd3fc,#fbbf24,#f472b6);
  border-radius:3px;transition:width .15s linear;
  box-shadow:0 0 14px rgba(120,180,255,.9)
}
#barText{font-size:11px;letter-spacing:3px;color:#a8c0dc;font-weight:600;min-height:14px;margin-top:4px}

#playBtn{
  position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  padding:18px 54px;border-radius:60px;
  background:linear-gradient(160deg,#7dd3fc,#3b82f6);color:#fff;
  font-size:18px;font-weight:900;letter-spacing:6px;
  border:none;cursor:pointer;
  box-shadow:0 10px 40px rgba(59,130,246,.55),inset 0 2px 0 rgba(255,255,255,.3);
  display:none;font-family:system-ui,sans-serif;z-index:110;pointer-events:auto
}
#playBtn:active{transform:translateX(-50%) scale(.95)}
#playBtn.show{display:block;animation:pop .4s ease-out}
@keyframes pop{
  0%{opacity:0;transform:translateX(-50%) scale(.8)}
  100%{opacity:1;transform:translateX(-50%) scale(1)}
}
#playHint{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  color:#8ea8c8;font-size:11px;letter-spacing:4px;font-weight:700;
  display:none
}
#playHint.show{display:block}

/* ═══════════════════════════════════════════════════════════════
   ERROR + PERF OVERLAY
   ═══════════════════════════════════════════════════════════════ */
#errorBox{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(200,30,30,.9);color:#fff;
  padding:10px 20px;border-radius:10px;
  font-size:12px;font-family:monospace;
  max-width:90vw;display:none;z-index:200;word-break:break-all
}
#perfInfo{
  position:absolute;
  top:calc(80px + env(safe-area-inset-top));
  right:calc(12px + env(safe-area-inset-right));
  padding:6px 10px;
  border-radius:8px;
  background:rgba(10,20,40,.7);
  color:#7dd3fc;
  font-size:9px;
  font-family:monospace;
  letter-spacing:1px;
  display:none;
  z-index:15;
  pointer-events:none
}

/* ═══════════════════════════════════════════════════════════════
   EDGE SWIPE INDICATOR — appears briefly when user touches edge
   ═══════════════════════════════════════════════════════════════ */
#edgeHint{
  position:fixed;
  top:50%;transform:translateY(-50%);
  padding:10px 14px;
  background:rgba(255,255,255,.9);
  color:#0a1a30;
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
  border-radius:10px;
  opacity:0;
  transition:opacity .25s;
  pointer-events:none;
  z-index:99
}
#edgeHintL{left:12px}
#edgeHintR{right:12px}
#edgeHint.show{opacity:1}
</style>
</head>

<div id="app">
  <canvas id="c"></canvas>

  <!-- ═══════ HUD ═══════ -->
  <div id="hud">
    <div class="panel" id="topLeft">

  </div>

  <div id="camZone"></div>

  <!-- ═══════ EDGE SWIPE HINTS ═══════ -->
  <div id="edgeHintL" class="edge-hint">‹ ՔԱՇԵՔ</div>
  <div id="edgeHintR" class="edge-hint">ՔԱՇԵՔ ›</div>
  <style>
    .edge-hint{
      position:fixed;top:50%;transform:translateY(-50%);
      padding:10px 14px;background:rgba(255,255,255,.9);
      color:#0a1a30;font-size:10px;font-weight:800;

    <div id="barWrap"><div id="barFill"></div></div>
    <div id="barText">ՄԻԱՑՈՒՄ...</div>
    <button id="playBtn">ՍԿՍԵԼ</button>

  <div id="errorBox"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     LOADER + FULLSCREEN SCRIPT
     ═══════════════════════════════════════════════════════════════ -->
<script>
window.__gameStartFn = null;
window.__gameReady = false;

window.addEventListener('error', function(e){
  var eb = document.getElementById('errorBox');
  if(eb){
    eb.style.display = 'block';
    eb.textContent = 'ՍԽԱԼ՝ ' + (e.message || '') + ' @' + (e.lineno || '?');
  }
});

(function(){
  var fill = document.getElementById('barFill');
  var text = document.getElementById('barText');
  var loader = document.getElementById('loader');
  var playBtn = document.getElementById('playBtn');
  var playHint = document.getElementById('playHint');
  var p = 0;

  var iv = setInterval(function(){
    p += 8 + Math.random() * 8;
    if(p > 100) p = 100;
    if(fill) fill.style.width = p + '%';
    if(text){
      if(p < 35) text.textContent = 'ՄԻԱՑՈՒՄ...';
      else if(p < 70) text.textContent = 'ԿԱՌՈՒՑՈՒՄ...';
      else if(p < 100) text.textContent = 'ՊԱՏՐԱՍՏՎՈՒՄ...';
      else text.textContent = 'ՊԱՏՐԱՍՏ Է';
    }
    if(p >= 100){
      clearInterval(iv);
      if(window.__gameReady){
        playBtn.classList.add('show');
        playHint.classList.add('show');
      }
    }
  }, 40);

  setInterval(function(){
    if(window.__gameReady && p >= 100){
      playBtn.classList.add('show');
      playHint.classList.add('show');
    }
  }, 100);

  function enterFullscreenAndStart(){
    var el = document.documentElement;
    var req = el.requestFullscreen
      || el.webkitRequestFullscreen
      || el.mozRequestFullScreen
      || el.msRequestFullscreen;
    if(req){
      try {
        var res = req.call(el, { navigationUI: 'hide' });
        if(res && res.catch) res.catch(function(){});
      } catch(e){}
    }
    try {
      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock('landscape').catch(function(){});
      }
    } catch(e){}

    setTimeout(function(){ window.scrollTo(0, 1); }, 100);
    setTimeout(function(){ window.scrollTo(0, 1); }, 500);
    setTimeout(function(){ window.scrollTo(0, 1); }, 1500);

    setTimeout(function(){
      if(window.__gameStartFn){
        try { window.__gameStartFn(); }
        catch(err){ console.error(err); }
      }
      loader.classList.add('done');
    }, 250);
  }

  playBtn.addEventListener('click', enterFullscreenAndStart);
  playBtn.addEventListener('touchend', function(e){
    e.preventDefault();
    enterFullscreenAndStart();
  }, {passive: false});
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- ═══════════════════════════════════════════════════════════════
     MAIN GAME
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   SECTION 1 — CONSTANTS
   ═══════════════════════════════════════════════════════════════════ */
var MAX_KMH          = 110;
var MAX_REV_KMH      = 25;
var HASH_SIZE        = 50;
var TERRAIN_SIZE     = 1400;
var TERRAIN_RES      = 80;
var WORLD_LIMIT      = 600;
var CASCADE_BASE_Z   = 320;
var CASCADE_PEAK_Z   = 560;

/* ═══════════════════════════════════════════════════════════════════
   SECTION 2 — TERRAIN HEIGHT
   ────────────────────────────────────────────────────────────────
   The Cascade hill rises from z=280 and peaks at z=560 with
   a smooth bell-shaped profile. Its peak reaches ~130 world units
   — the HIGHEST point in the map. The city plain is at y≈0.
   ═══════════════════════════════════════════════════════════════════ */
function terrainHeight(x, z){
  var y = 0;

  /* ── Base gentle wave across the whole plain ── */
  y += 0.4 * Math.sin(x * 0.008) * Math.cos(z * 0.006);

  /* ── CASCADE HILL ──
     t goes from 0 at z=280 to 1 at z=560.
     pow(t, 1.6) gives a smooth rise.
     xF is a bell curve in x — hill is centered around x=0. */
  var t = (z - 280) / 280;
  if(t > 0){
    if(t > 1) t = 1;
    var xF = Math.exp(-(x * x) / 50000);
    y += Math.pow(t, 1.6) * 130 * xF;
  }

  /* ── Beyond Cascade, gently descend ── */
  if(z > 560){
    var pz = z - 560;
    y -= Math.min(pz * 0.04, 20);
  }

  /* ── Matenadaran hill (northwest) ── */
  var dx1 = x + 330, dz1 = z - 240;
  y += 42 * Math.exp(-(dx1 * dx1 + dz1 * dz1) / 22000);

  /* ── Opera gentle mound ── */
  var dx2 = x + 200, dz2 = z - 100;
  y += 6 * Math.exp(-(dx2 * dx2 + dz2 * dz2) / 14000);

  return y;
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 3 — RENDERER + SCENE
   ═══════════════════════════════════════════════════════════════════ */
var app = document.getElementById('app');
var cvs = document.getElementById('c');

var renderer = new THREE.WebGLRenderer({
  canvas:           cvs,
  antialias:        false,               // ⚡ Perf — no MSAA
  powerPreference:  'high-performance',
  stencil:          false,
  depth:            true,
  alpha:            false
});
renderer.setPixelRatio(1);                // ⚡ Always 1, never devicePixelRatio
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;        // ⚡ No shadows — biggest perf win
renderer.setClearColor(0xa8c8e8, 1);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8c8e8);
scene.fog = new THREE.Fog(0xc0d8e8, 300, 900);

var camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.5, 2500);

/* ═══════════════════════════════════════════════════════════════════
   SECTION 4 — SKY + ARARAT (north, behind Cascade)
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  /* ── Sky dome with 3-stop gradient shader ── */
  var skyGeo = new THREE.SphereGeometry(1800, 32, 16);
  var skyMat = new THREE.ShaderMaterial({
    uniforms: {
      cTop: { value: new THREE.Color(0x2a72c8) },
      cMid: { value: new THREE.Color(0x9cc0e0) },
      cHor: { value: new THREE.Color(0xf4dcb0) }
    },
    vertexShader: [
      'varying vec3 vP;',
      'void main(){',
      '  vP = position;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 cTop; uniform vec3 cMid; uniform vec3 cHor;',
      'varying vec3 vP;',
      'void main(){',
      '  float h = normalize(vP).y;',
      '  vec3 col = h > 0.0 ? mix(cMid, cTop, pow(h, 0.65)) : cMid;',
      '  float hor = exp(-abs(h) * 5.5);',
      '  col = mix(col, cHor, hor * 0.7);',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n'),
    side: THREE.BackSide,
    depthWrite: false,
    fog: false
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  /* ── Ararat silhouettes ── */
  var mtnMat = new THREE.MeshBasicMaterial({ color: 0xb8c4d8, fog: false });
  var snowMat = new THREE.MeshBasicMaterial({ color: 0xf0f4f8, fog: false });

  /* Big Ararat (Masis) */
  var a1 = new THREE.Mesh(new THREE.ConeGeometry(280, 220, 6), mtnMat);
  a1.position.set(280, 40, 1350);
  a1.rotation.y = 0.4;
  scene.add(a1);
  var c1 = new THREE.Mesh(new THREE.ConeGeometry(95, 75, 6), snowMat);
  c1.position.set(280, 145, 1350);
  c1.rotation.y = 0.4;
  scene.add(c1);

  /* Small Ararat (Sis) */
  var a2 = new THREE.Mesh(new THREE.ConeGeometry(180, 150, 6), mtnMat);
  a2.position.set(120, 30, 1300);
  a2.rotation.y = -0.2;
  scene.add(a2);
  var c2 = new THREE.Mesh(new THREE.ConeGeometry(62, 50, 6), snowMat);
  c2.position.set(120, 100, 1300);
  c2.rotation.y = -0.2;
  scene.add(c2);

  /* Secondary distant ridge */
  var a3 = new THREE.Mesh(
    new THREE.ConeGeometry(150, 90, 6),
    new THREE.MeshBasicMaterial({ color: 0xc0cad8, fog: false })
  );
  a3.position.set(-250, 20, 1380);
  scene.add(a3);
})();

/* ═══════════════════════════════════════════════════════════════════
   SECTION 5 — LIGHTS (no shadows)
   ═══════════════════════════════════════════════════════════════════ */
scene.add(new THREE.HemisphereLight(0xd0e4f8, 0x8a7a5a, 0.95));

var sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
sun.position.set(-100, 200, 120);
scene.add(sun);

var fillLight = new THREE.DirectionalLight(0xc8d8ff, 0.25);
fillLight.position.set(150, 60, -120);
scene.add(fillLight);

/* ═══════════════════════════════════════════════════════════════════
   SECTION 6 — TERRAIN MESH
   ═══════════════════════════════════════════════════════════════════ */
function makeGrassTexture(){
  var cv = document.createElement('canvas');
  cv.width = 256; cv.height = 256;
  var x = cv.getContext('2d');
  x.fillStyle = '#7a9a55';
  x.fillRect(0, 0, 256, 256);
  for(var i = 0; i < 6000; i++){
    var r = Math.random();
    x.fillStyle = r > 0.66 ? '#8aaa60' : (r > 0.33 ? '#6a8a48' : '#5a7a3a');
    x.fillRect(Math.random() * 256, Math.random() * 256, 2, 3);
  }
  for(var j = 0; j < 40; j++){
    x.fillStyle = 'rgba(90,120,60,0.15)';
    x.beginPath();
    x.arc(Math.random() * 256, Math.random() * 256, 10 + Math.random() * 30, 0, Math.PI * 2);
    x.fill();
  }
  var t = new THREE.CanvasTexture(cv);

}

/* ── Road textures — 3 variants ── */
function makeRoadTexture(type){
  var cv = document.createElement('canvas');
  cv.width = 128;
  cv.height = 256;
  var x = cv.getContext('2d');

  var base, lineCol, speckleCol;
  if(type === 'highway'){
    base = '#2e3238';
    lineCol = '#f0c040';
    speckleCol = 'rgba(255,255,255,0.04)';
  } else if(type === 'avenue'){
    base = '#3a3d42';
    lineCol = '#e0b030';
    speckleCol = 'rgba(255,255,255,0.03)';
  } else {
    base = '#4a4d52';
    lineCol = '#e8e8e8';
    speckleCol = 'rgba(255,255,255,0.02)';
  }
  x.fillStyle = base;
  x.fillRect(0, 0, 128, 256);
  for(var i = 0; i < 1500; i++){
    x.fillStyle = Math.random() > 0.5 ? speckleCol : 'rgba(0,0,0,0.07)';
    x.fillRect(Math.random() * 128, Math.random() * 256, 1.5, 1.5);
  }
  /* Dashed center line */
  x.fillStyle = lineCol;
  for(var yy = 0; yy < 256; yy += 40){
    x.fillRect(62, yy + 4, 2, 16);
    x.fillRect(65, yy + 4, 2, 16);
  }
  /* Highway gets solid side lines */
  if(type === 'highway'){
    x.fillStyle = '#e8e8e8';
    x.fillRect(6, 0, 1.5, 256);
    x.fillRect(120, 0, 1.5, 256);
  }
  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

/* ── Add a road path — Catmull-Rom through waypoints ── */
function addRoad(path, width, type){
  var D = ROAD_DATA[type];
  var pts = [];
  for(var i = 0; i < path.length; i++){
    pts.push(new THREE.Vector3(path[i].x, 0, path[i].z));
  }
  var curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
  var len = curve.getLength();
  var N = Math.max(8, Math.ceil(len / 6));
  var sampled = curve.getSpacedPoints(N);
  var startIdx = D.verts.length / 3;

  for(var i = 0; i <= N; i++){
    var p = sampled[i];
    var iPrev = Math.max(0, i - 1);
    var iNext = Math.min(N, i + 1);
    var pPrev = sampled[iPrev];
    var pNext = sampled[iNext];
    var tdx = pNext.x - pPrev.x;
    var tdz = pNext.z - pPrev.z;
    var tl = Math.sqrt(tdx * tdx + tdz * tdz) || 1;
    var px = -tdz / tl;
    var pz = tdx / tl;

    var lx = p.x + px * width / 2;
    var lz = p.z + pz * width / 2;
    var rx = p.x - px * width / 2;
    var rz = p.z - pz * width / 2;

    D.verts.push(lx, terrainHeight(lx, lz) + 0.25, lz);
    D.verts.push(rx, terrainHeight(rx, rz) + 0.25, rz);
    var v = i * (len / N) * 0.08;
    D.uvs.push(0, v, 1, v);
  }
  for(var j = 0; j < N; j++){
    var a = startIdx + j * 2;
    D.idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
}

function isNearRoad(x, z, margin){
  /* Ring road */
  var d = Math.sqrt(x * x + z * z);
  if(Math.abs(d - 78) < 12 + (margin || 0)) return true;

  /* Grid */
  for(var i = 0; i < ROAD_GRID.length; i++){
    var e = ROAD_GRID[i];
    var dd = Math.sqrt((x - e.x) * (x - e.x) + (z - e.z) * (z - e.z));
    if(dd < e.w / 2 + (margin || 0)) return true;
  }

  /* Serpentine path */
  for(var s = 0; s < SERPENTINE_PATH.length - 1; s++){
    var A = SERPENTINE_PATH[s];
    var B = SERPENTINE_PATH[s + 1];
    var dx = B.x - A.x;
    var dz = B.z - A.z;
    var l2 = dx * dx + dz * dz;
    var t = ((x - A.x) * dx + (z - A.z) * dz) / l2;
    t = Math.max(0, Math.min(1, t));
    var cx = A.x + dx * t;
    var cz = A.z + dz * t;
    var dd2 = Math.sqrt((x - cx) * (x - cx) + (z - cz) * (z - cz));
    if(dd2 < 8 + (margin || 0)) return true;
  }
  return false;
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 10 — COLLISION SYSTEM (rotation-aware + spatial hash)
   ═══════════════════════════════════════════════════════════════════ */
var COL_HASH = {};

function addCollision(x, z, w, d, h, rot){
  rot = rot || 0;
  var c = Math.abs(Math.cos(rot));
  var s = Math.abs(Math.sin(rot));
  var effW = c * w + s * d;
  var effD = s * w + c * d;

  var b = { x: x, z: z, w: effW, d: effD, h: h };
  var x1 = Math.floor((x - effW / 2) / HASH_SIZE);
  var x2 = Math.floor((x + effW / 2) / HASH_SIZE);
  var z1 = Math.floor((z - effD / 2) / HASH_SIZE);
  var z2 = Math.floor((z + effD / 2) / HASH_SIZE);

  for(var i = x1; i <= x2; i++){
    for(var j = z1; j <= z2; j++){
      var k = i + ',' + j;
      if(!COL_HASH[k]) COL_HASH[k] = [];
      COL_HASH[k].push(b);
    }
  }
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 12 — SHARED GEOMETRY + BUILDING MATERIALS
   ═══════════════════════════════════════════════════════════════════ */
var BOX_GEO  = new THREE.BoxGeometry(1, 1, 1);
var CONE4    = new THREE.ConeGeometry(1, 1, 4);
var CONE6    = new THREE.ConeGeometry(1, 1, 6);

function makeTuffTexture(baseHex, style){
  var cv = document.createElement('canvas');
  cv.width = 128; cv.height = 256;
  var x = cv.getContext('2d');
  x.fillStyle = baseHex;
  x.fillRect(0, 0, 128, 256);
  for(var i = 0; i < 800; i++){
    x.fillStyle = 'rgba(120,100,80,' + (Math.random() * 0.09) + ')';
    x.fillRect(Math.random() * 128, Math.random() * 256, 3, 2);
  }
  var cols, rows;
  if(style === 'modern'){ cols = 5; rows = 12; }
  else if(style === 'dense'){ cols = 4; rows = 14; }
  else { cols = 3; rows = 8; }
  var cw = 128 / cols;
  var ch = 256 / rows;
  for(var r = 1; r < rows - 0.5; r++){
    for(var c = 0; c < cols; c++){
      var wx = c * cw + cw * 0.15;
      var wy = r * ch + ch * 0.12;
      var ww = cw * 0.7;
      var wh = ch * 0.66;
      x.fillStyle = '#2a3a4a';
      x.fillRect(wx, wy, ww, wh);
      var hue = Math.random();
      var wc = hue > 0.7 ? '#8ac8e8' : (hue > 0.4 ? '#6a8aa8' : '#4a6a88');
      x.fillStyle = wc;
      x.fillRect(wx + 1, wy + 1, ww - 2, wh - 2);
      x.fillStyle = 'rgba(255,255,255,0.35)';
      x.fillRect(wx + 2, wy + 2, ww * 0.35, wh * 0.4);
    }
  }
  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

var BLD_MATS = [
  new THREE.MeshLambertMaterial({ map: makeTuffTexture('#e8d8c0', 'normal') }),  // 0
  new THREE.MeshLambertMaterial({ map: makeTuffTexture('#d8b090', 'normal') }),  // 1
  new THREE.MeshLambertMaterial({ map: makeTuffTexture('#e0c8a8', 'dense')  }),  // 2
  new THREE.MeshLambertMaterial({ map: makeTuffTexture('#c8b8a8', 'normal') }),  // 3
  new THREE.MeshLambertMaterial({ map: makeTuffTexture('#b8a088', 'normal') }),  // 4
  new THREE.MeshLambertMaterial({ color: 0x88a8c8, transparent: true, opacity: 0.85 }), // 5
  new THREE.MeshLambertMaterial({ map: makeTuffTexture('#d8c8b0', 'modern') }),  // 6
  new THREE.MeshLambertMaterial({ color: 0xd8c0a8 })                             // 7
];

/* ── Instanced building accumulator ── */
var BUILDING_DATA = { boxes: {}, roofs: {}, cones: [] };

function ensureArray(map, key){
  if(!map[key]) map[key] = [];
  return map[key];
}
function collectBox(x, z, w, h, d, rot, matIdx){
  var y = terrainHeight(x, z);
  ensureArray(BUILDING_DATA.boxes, matIdx).push({ x: x, y: y, z: z, w: w, h: h, d: d, rot: rot });
  addCollision(x, z, w, d, h, rot);
  return y;
}
function collectRoof(x, y, z, w, h, d, rot){
  ensureArray(BUILDING_DATA.roofs, 'r').push({ x: x, y: y, z: z, w: w, h: h, d: d, rot: rot });
}
function collectCone(x, y, z, r, h, rotY){
  BUILDING_DATA.cones.push({ x: x, y: y, z: z, r: r, h: h, rotY: rotY || 0 });
}
function rotateOffset(lx, lz, rot){
  var c = Math.cos(rot);
  var s = Math.sin(rot);
  return { x: c * lx + s * lz, z: -s * lx + c * lz };
}

/* ── Building shapes ── */
function addBuildingBox(cx, cz, w, h, d, rot, matIdx, detail){
  var y = collectBox(cx, cz, w, h, d, rot, matIdx);
  if(detail !== false && h > 10){
    collectRoof(cx, y + h + 0.4, cz, w * 0.94, 0.9, d * 0.94, rot);
    if(h < 20 && Math.random() < 0.35){
      collectCone(cx, y + h + 3, cz, Math.max(w, d) * 0.55, 3 + Math.random() * 3, rot + Math.PI / 4);
    }
  }
}
function addBuildingL(cx, cz, bw, bh, bd, rot, matIdx){
  addBuildingBox(cx, cz, bw, bh, bd, rot, matIdx, false);
  var ww = bw * 0.55;
  var wd = bd * 0.55;
  var wh = bh * 0.85;
  var off = rotateOffset(bw * 0.5 + ww * 0.5 - bw * 0.1, -bd * 0.5 + wd * 0.5, rot);
  addBuildingBox(cx + off.x, cz + off.z, ww, wh, wd, rot, matIdx, false);
}
function addBuildingT(cx, cz, bw, bh, bd, rot, matIdx){
  addBuildingBox(cx, cz, bw, bh, bd, rot, matIdx, false);
  var cw = bw * 0.9;
  var cd = bd * 0.5;
  var ch = bh * 0.92;
  addBuildingBox(cx, cz, cw, ch, cd, rot + Math.PI / 2, matIdx, false);
}
function addBuildingU(cx, cz, bw, bh, bd, rot, matIdx){
  addBuildingBox(cx, cz, bw, bh, bd, rot, matIdx, false);
  var ww = bw * 0.4;
  var wd = bd * 0.55;
  var wh = bh * 0.9;
  var offL = rotateOffset(-bw * 0.5 - ww * 0.5 + bw * 0.1, 0, rot);
  addBuildingBox(cx + offL.x, cz + offL.z, ww, wh, wd, rot, matIdx, false);
  var offR = rotateOffset(bw * 0.5 + ww * 0.5 - bw * 0.1, 0, rot);
  addBuildingBox(cx + offR.x, cz + offR.z, ww, wh, wd, rot, matIdx, false);
}

/* ── Flush instanced groups into scene ── */
function flushInstanced(){
  var dummy = new THREE.Object3D();
  for(var matIdx in BUILDING_DATA.boxes){
    var arr = BUILDING_DATA.boxes[matIdx];
    if(!arr || arr.length === 0) continue;
    var mat = BLD_MATS[parseInt(matIdx, 10)];
    var im = new THREE.InstancedMesh(BOX_GEO, mat, arr.length);
    im.frustumCulled = false;
    for(var i = 0; i < arr.length; i++){
      var b = arr[i];
      dummy.position.set(b.x, b.y + b.h / 2, b.z);
      dummy.rotation.set(0, b.rot, 0);
      dummy.scale.set(b.w, b.h, b.d);
      dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix);
    }
    im.instanceMatrix.needsUpdate = true;
    scene.add(im);
  }
  for(var rk in BUILDING_DATA.roofs){
    var rArr = BUILDING_DATA.roofs[rk];
    if(!rArr || rArr.length === 0) continue;
    var rMat = new THREE.MeshLambertMaterial({ color: 0x8a5030 });
    var rIm = new THREE.InstancedMesh(BOX_GEO, rMat, rArr.length);
    rIm.frustumCulled = false;
    for(var j = 0; j < rArr.length; j++){
      var rb = rArr[j];
      dummy.position.set(rb.x, rb.y, rb.z);
      dummy.rotation.set(0, rb.rot, 0);
      dummy.scale.set(rb.w, rb.h, rb.d);
      dummy.updateMatrix();
      rIm.setMatrixAt(j, dummy.matrix);
    }
    rIm.instanceMatrix.needsUpdate = true;
    scene.add(rIm);
  }
  if(BUILDING_DATA.cones.length > 0){
    var cArr = BUILDING_DATA.cones;
    var cMat = new THREE.MeshLambertMaterial({ color: 0xa85030 });
    var cIm = new THREE.InstancedMesh(CONE4, cMat, cArr.length);
    cIm.frustumCulled = false;
    for(var k = 0; k < cArr.length; k++){
      var cr = cArr[k];
      dummy.position.set(cr.x, cr.y, cr.z);
      dummy.rotation.set(0, cr.rotY, 0);
      dummy.scale.set(cr.r, cr.h, cr.r);
      dummy.updateMatrix();
      cIm.setMatrixAt(k, dummy.matrix);
    }
    cIm.instanceMatrix.needsUpdate = true;
    scene.add(cIm);
  }
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 13 — LANDMARK MATERIALS + HELPERS
   ═══════════════════════════════════════════════════════════════════ */
var MAT_TUFF        = new THREE.MeshLambertMaterial({ color: 0xe8d6b0 });
var MAT_TUFF_DARK   = new THREE.MeshLambertMaterial({ color: 0xc8a878 });
var MAT_STONE       = new THREE.MeshLambertMaterial({ color: 0x9a8870 });
var MAT_STONE_LIGHT = new THREE.MeshLambertMaterial({ color: 0xd8ceb8 });
var MAT_GOLD        = new THREE.MeshLambertMaterial({ color: 0xd8b050 });
var MAT_WATER       = new THREE.MeshLambertMaterial({ color: 0x3a7ac8 });
var MAT_GLASS       = new THREE.MeshLambertMaterial({ color: 0x7ac0e0, transparent: true, opacity: 0.75 });
var MAT_TREE        = new THREE.MeshLambertMaterial({ color: 0x2a5a20 });
var MAT_TREE_DARK   = new THREE.MeshLambertMaterial({ color: 0x1a4a15 });
var MAT_TRUNK       = new THREE.MeshLambertMaterial({ color: 0x4a2a14 });
var MAT_LAWN        = new THREE.MeshLambertMaterial({ color: 0x5a8a3a });
var MAT_PLAZA       = new THREE.MeshLambertMaterial({ color: 0xc8b090 });
var MAT_FOUNTAIN    = new THREE.MeshLambertMaterial({ color: 0xb8a888 });
var MAT_CASCADE     = new THREE.MeshLambertMaterial({ color: 0xd8c8a8 });
var MAT_RED_TUFF    = new THREE.MeshLambertMaterial({ color: 0xa86050 });

function addBox(parent, x, y, z, w, h, d, mat, rot){
  var m = new THREE.Mesh(BOX_GEO, mat);
  m.scale.set(w, h, d);
  m.position.set(x, y, z);
  if(rot) m.rotation.y = rot;
  parent.add(m);
  return m;
}
function addCyl(parent, x, y, z, r1, r2, h, mat, seg){
  var g = new THREE.CylinderGeometry(r1, r2, h, seg || 12);
  var m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
function addCone(parent, x, y, z, r, h, mat, seg, rotY){
  var g = new THREE.ConeGeometry(r, h, seg || 4);
  var m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  if(rotY) m.rotation.y = rotY;
  parent.add(m);
  return m;
}
function addSphere(parent, x, y, z, r, mat){
  var m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
function addTree(parent, x, y, z, scale){
  scale = scale || 1;
  addCyl(parent, x, y + 1.4 * scale, z, 0.3 * scale, 0.4 * scale, 2.8 * scale, MAT_TRUNK, 6);
  addCone(parent, x, y + 4.8 * scale, z, 1.9 * scale, 4.4 * scale, MAT_TREE, 7);
}
function addSmallTree(parent, x, y, z, scale){
  scale = scale || 0.7;
  addCyl(parent, x, y + 1.0 * scale, z, 0.2 * scale, 0.3 * scale, 2.0 * scale, MAT_TRUNK, 6);
  addCone(parent, x, y + 3.6 * scale, z, 1.4 * scale, 3.2 * scale, MAT_TREE_DARK, 6);
}

  }
  addBox(g, 0, y0 + 17, -50, 48, 2, 3, MAT_TUFF_DARK);
  /* Clock tower */
  addBox(g, 0, y0 + 26, -72, 14, 46, 14, MAT_TUFF);
  addBox(g, 0, y0 + 51, -72, 16, 3, 16, MAT_TUFF_DARK);
  var clock = new THREE.Mesh(
    new THREE.CylinderGeometry(3.2, 3.2, 0.4, 20),

  );
  clock.rotation.x = Math.PI / 2;

      w.position.set(c * 2.8, y0 + 6 + r * 5.5, 72);

  }
  for(var ii = -8; ii <= 8; ii++){

  addBox(g, 0, y0 + 11, 52, 56, 2, 3, MAT_TUFF_DARK);

  /* ═══ WEST — Government building ═══ */

  for(var jj = -6; jj <= 6; jj++){

  /* ═══ EAST — Ministry building ═══ */
  addBox(g, 62, y0 + 15, 0, 20, 30, 52, MAT_TUFF);
  addBox(g, 62, y0 + 31, 0, 22, 2.5, 54, MAT_TUFF_DARK);

  /* ── Lamp posts ── */
  for(var L = 0; L < 12; L++){
    var la = (L / 12) * Math.PI * 2 + 0.26;
    var lx = Math.sin(la) * 44;
    var lz = Math.cos(la) * 44;
    addCyl(g, lx, y0 + 3, lz, 0.2, 0.2, 6, new THREE.MeshLambertMaterial({ color: 0x303030 }), 6);

      new THREE.SphereGeometry(0.6, 8, 6),
      new THREE.MeshBasicMaterial({ color: 0xfff4c0 })

  g.position.set(cx, 0, cz);

}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 16 — CASCADE
   ────────────────────────────────────────────────────────────────
   The staircase is SMALLER (human-scale). Base plaza at z=340 (top
   of North Ave). 6 tuff terraces going up the slope, each 12 units
   north, with side pools, small statues, front stair treads.
   At the top: the Victory column and golden star.  The SERPENTINE
   ROAD (built in Section 8) reaches the peak from the side.
   ═══════════════════════════════════════════════════════════════════ */
function buildCascade(){
  var g = new THREE.Group();
  var baseZ = 340;
  var baseY = terrainHeight(0, baseZ);

  /* ── Base plaza at foot of stairs ── */
  var plaza = new THREE.Mesh(new THREE.CircleGeometry(42, 32), MAT_PLAZA);
  plaza.rotation.x = -Math.PI / 2;
  plaza.position.set(0, baseY + 0.4, baseZ - 15);
  g.add(plaza);

  /* ── Plaza fountain ── */
  addCyl(g, 0, baseY + 0.7, baseZ - 15, 3.5, 4.2, 1.0, MAT_FOUNTAIN, 16);
  addCyl(g, 0, baseY + 1.4, baseZ - 15, 3, 3, 0.4, MAT_WATER, 16);

  /* ── Trees at plaza edge ── */
  for(var tp = 0; tp < 12; tp++){
    var ta = (tp / 12) * Math.PI * 2;
    addTree(g, Math.cos(ta) * 38, baseY, baseZ - 15 + Math.sin(ta) * 38, 0.9);
  }

  /* ── The staircase — 6 terraces ── */
  var terraces = 6;
  var stepDepth = 12;
  var baseWidth = 44;

  for(var s = 0; s < terraces; s++){
    var tw = baseWidth - s * 3.5;
    var tz = baseZ + 6 + s * stepDepth;
    var ty = terrainHeight(0, tz);

    /* Terrace platform */
    addBox(g, 0, ty + 2, tz, tw, 4, stepDepth - 2, MAT_CASCADE);

    /* Front stair treads (3 small steps) */
    for(var st = 0; st < 3; st++){
      addBox(g, 0, ty + 0.4 + st * 0.9, tz - stepDepth / 2 + st * 1.1, tw - 3, 0.5, 1.3, MAT_STONE_LIGHT);
    }

    /* Side water channels */
    for(var side = -1; side <= 1; side += 2){
      var poolX = side * (tw / 2 - 3);
      var pool = new THREE.Mesh(BOX_GEO, MAT_WATER);
      pool.scale.set(2, 0.5, stepDepth - 5);
      pool.position.set(poolX, ty + 4.2, tz);
      g.add(pool);
    }

    /* Small statues on terrace edges */
    for(var sd = -1; sd <= 1; sd += 2){
      addCyl(g, sd * (tw / 2 + 1.5), ty + 5.5, tz, 0.8, 0.8, 2.5, MAT_STONE, 6);
      addSphere(g, sd * (tw / 2 + 1.5), ty + 7.3, tz, 0.7, MAT_STONE_LIGHT);
    }
  }

  /* ── Monument at the peak ── */
  var topZ = baseZ + 6 + terraces * stepDepth + 8;
  var topY = terrainHeight(0, topZ);

  addBox(g, 0, topY + 1.5, topZ, 26, 3, 18, MAT_CASCADE);
  addBox(g, 0, topY + 6, topZ, 9, 7, 9, MAT_STONE);
  addCyl(g, 0, topY + 18, topZ, 1.5, 2.2, 22, MAT_STONE, 10);
  addSphere(g, 0, topY + 31, topZ, 1.9, MAT_GOLD);
  addCone(g, 0, topY + 33.5, topZ, 1.4, 2.4, MAT_GOLD, 4, 0);

  /* ── Green hillside (both sides of Cascade) ── */
  for(var side2 = -1; side2 <= 1; side2 += 2){
    for(var i = 0; i < 30; i++){
      var tx = side2 * (38 + Math.random() * 50);
      var tz2 = baseZ - 20 + Math.random() * 140;
      var ty2 = terrainHeight(tx, tz2);
      if(ty2 > 0){
        addTree(g, tx, ty2, tz2, 0.8 + Math.random() * 0.9);
      }
    }
  }

  g.position.set(0, 0, 0);
  scene.add(g);

  /* ── Collisions on each terrace ── */
  for(var s2 = 0; s2 < terraces; s2++){
    var tz2 = baseZ + 6 + s2 * stepDepth;
    var tw2 = baseWidth - s2 * 3.5;
    addCollision(0, tz2, tw2, stepDepth - 2, 4, 0);
  }
}

(function(){
  var NUM = 400;
  var trunkGeo = new THREE.CylinderGeometry(0.24, 0.34, 2.4, 5);
  trunkGeo.translate(0, 1.2, 0);
  var leafGeo = new THREE.ConeGeometry(1.7, 3.8, 6);
  leafGeo.translate(0, 4, 0);

  var trunks = new THREE.InstancedMesh(trunkGeo, MAT_TRUNK, NUM);
  var leaves = new THREE.InstancedMesh(leafGeo, MAT_TREE, NUM);
  trunks.frustumCulled = false;
  leaves.frustumCulled = false;

  var dummy = new THREE.Object3D();
  var placed = 0, tries = 0;
  while(placed < NUM && tries < 8000){
    tries++;
    var x = (Math.random() - 0.5) * 900;
    var z = (Math.random() - 0.5) * 900;

    /* Density near landmarks, sparse elsewhere */
    var nearLM = isNearLandmark(x, z, 45);
    var onCascadeSlope = (z > 280 && Math.abs(x) > 60 && Math.abs(x) < 200);
    var onMatenadaranHill = (z > 200 && z < 320 && x < -260 && x > -420);

    if(!nearLM && !onCascadeSlope && !onMatenadaranHill){
      if(Math.random() < 0.85) continue;
    }
    if(isNearRoad(x, z, 6)) continue;
    if(isNearLandmark(x, z, 0) && Math.random() < 0.4) continue;

    var y = terrainHeight(x, z);
    var s = 0.8 + Math.random() * 1.1;
    var rot = Math.random() * Math.PI * 2;

    dummy.position.set(x, y, z);
    dummy.rotation.set(0, rot, 0);
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    trunks.setMatrixAt(placed, dummy.matrix);
    leaves.setMatrixAt(placed, dummy.matrix);
    placed++;
  }
  trunks.count = placed;
  leaves.count = placed;
  trunks.instanceMatrix.needsUpdate = true;
  leaves.instanceMatrix.needsUpdate = true;
  scene.add(trunks);
  scene.add(leaves);
})();

  [-0.87, 0.87].forEach(function(px){

  var rB = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.32, 0.42), darkMat);

  var grille = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.36, 0.06), chromeMat);
  grille.position.set(0, 0.74, 3.2);
  g.add(grille);

  var trunk = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.15, 1.25), bodyMat);
  trunk.position.set(0, 1.18, -1.95);
  g.add(trunk);

  var spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.72, 0.09, 0.55), darkMat);
  spoiler.position.set(0, 1.36, -2.2);
  g.add(spoiler);

  [-1.02, 1.02].forEach(function(x){
    var arm = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.05, 0.09), darkMat);
    arm.position.set(x * 0.95, 1.48, 0.78);
    g.add(arm);
    var mir = new THREE.Mesh(new THREE.BoxGeometry(0.21, 0.1, 0.15), bodyMat);
    mir.position.set(x * 1.15, 1.45, 0.78);
    g.add(mir);

  [-0.62, 0.62].forEach(function(x){

  });

  function makeWheel(){
    var steer = new THREE.Group();
    var roll = new THREE.Group();
    steer.add(roll);

    var tireGeo = new THREE.TorusGeometry(0.44, 0.17, 8, 16);
    tireGeo.rotateY(Math.PI / 2);

   SECTION 25 — GAME STATE + INPUT
   ═══════════════════════════════════════════════════════════════════ */
var S = {
  phase: 'loading',
  x: 0, z: -320,
  heading: 0,
  speed: 0,
  steer: 0,
  camX: 0, camY: 0, camZ: 0,
  camLX: 0, camLY: 0, camLZ: 0,
  camYaw: 0,
  camPitch: 0.42,
  camDist: 10.5,
  loc: 'Երևան',
  suspensionY: 0, suspensionV: 0,
  bodyRoll: 0, bodyRollV: 0,
  bodyPitch: 0, bodyPitchV: 0,
  lastCamDrag: 0,
  wheelSpin: 0
};

var IN = { gas: false, rev: false, left: false, right: false };

/* ═══════════════════════════════════════════════════════════════════
   SECTION 26 — PHYSICS
   ═══════════════════════════════════════════════════════════════════ */
function updatePhysics(dt){
  /* Steering input */
  var target = 0;
  if(IN.left) target = -1;
  if(IN.right) target = 1;

  S.steer += (target - S.steer) * Math.min(1, 6 * dt);
  if(!IN.left && !IN.right){
    S.steer += (0 - S.steer) * Math.min(1, 5 * dt);
    if(Math.abs(S.steer) < 0.003) S.steer = 0;
  }

  /* Throttle */
  if(IN.gas) S.speed += (S.speed < 40 ? 38 : 22) * dt;
  if(IN.rev){
    if(S.speed > 0.5) S.speed -= 65 * dt;
    else S.speed -= 28 * dt;
  }
  if(!IN.gas && !IN.rev){
    if(S.speed > 0.05) S.speed -= 10 * dt;
    else if(S.speed < -0.05) S.speed += 10 * dt;
    else S.speed = 0;
  }

  /* Slope resistance */
  var fx = Math.sin(S.heading), fz = Math.cos(S.heading);
  var aheadH = terrainHeight(S.x + fx * 5, S.z + fz * 5);
  var behindH = terrainHeight(S.x - fx * 5, S.z - fz * 5);
  var slope = (aheadH - behindH) / 10;
  S.speed -= slope * 22 * dt;
  S.speed = Math.max(-MAX_REV_KMH, Math.min(MAX_KMH, S.speed));

  /* Steering — reverses when backward */
  var v = S.speed / 3.6;
  var spdFac = Math.max(-1, Math.min(1, v / 8));
  S.heading -= S.steer * 1.9 * spdFac * dt;

  /* Position */
  var nfx = Math.sin(S.heading), nfz = Math.cos(S.heading);
  S.x += nfx * v * dt;
  S.z += nfz * v * dt;

  /* World clamp */
  S.x = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, S.x));
  S.z = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, S.z));

  /* Collision (spatial hash) */
  var hk = Math.floor(S.x / HASH_SIZE) + ',' + Math.floor(S.z / HASH_SIZE);
  var nearby = COL_HASH[hk];
  if(nearby){
    for(var ci = 0; ci < nearby.length; ci++){
      var b = nearby[ci];
      var hw = b.w / 2 + 1.4;
      var hd = b.d / 2 + 1.4;
      var ddx = S.x - b.x;
      var ddz = S.z - b.z;
      if(Math.abs(ddx) < hw && Math.abs(ddz) < hd){
        var ox = hw - Math.abs(ddx);
        var oz = hd - Math.abs(ddz);
        if(ox < oz) S.x = b.x + Math.sign(ddx || 1) * hw;
        else S.z = b.z + Math.sign(ddz || 1) * hd;
        S.speed *= 0.35;
      }
    }
  }

  /* Ground height */
  var groundY = terrainHeight(S.x, S.z);

  /* Suspension */
  var targetSusp = -slope * 0.04;
  S.suspensionV += (targetSusp - S.suspensionY) * 55 * dt - S.suspensionV * 9 * dt;
  S.suspensionY += S.suspensionV * dt;

  /* Terrain-following pitch/roll */
  var rx = Math.cos(S.heading), rz = -Math.sin(S.heading);
  var hF = terrainHeight(S.x + fx * 1.6, S.z + fz * 1.6);
  var hB = terrainHeight(S.x - fx * 1.6, S.z - fz * 1.6);
  var hL = terrainHeight(S.x - rx * 1.1, S.z - rz * 1.1);
  var hR = terrainHeight(S.x + rx * 1.1, S.z + rz * 1.1);
  var tPitch = Math.atan2(hF - hB, 3.2);
  var tRoll  = Math.atan2(hR - hL, 2.2);

  S.bodyPitchV += (tPitch - S.bodyPitch) * 14 * dt - S.bodyPitchV * 8 * dt;
  S.bodyPitch  += S.bodyPitchV * dt;

  var steerRoll = -S.steer * 0.06;
  S.bodyRollV += (tRoll + steerRoll - S.bodyRoll) * 14 * dt - S.bodyRollV * 8 * dt;
  S.bodyRoll  += S.bodyRollV * dt;

  player.group.position.set(S.x, groundY + S.suspensionY, S.z);
  player.group.rotation.y = S.heading;
  player.group.rotation.x = -S.bodyPitch;
  player.group.rotation.z = S.bodyRoll;

  /* Wheels */
  var spin = v * dt * 2.2;
  S.wheelSpin += spin;
  for(var wk = 0; wk < player.wheels.length; wk++){
    var w = player.wheels[wk];
    w.roll.rotation.x = S.wheelSpin;
    if(w.tag === 'fl' || w.tag === 'fr'){
      w.steer.rotation.y = -S.steer * 0.5;
    }
  }

  /* Brake light */
  var braking = IN.rev || (!IN.gas && Math.abs(S.speed) > 4);
  player.tailMat.color.setHex(braking ? 0xff1010 : 0xff2222);

  updateLocationName();
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 27 — LOCATION NAME
   ═══════════════════════════════════════════════════════════════════ */
var lastLocName = '';
function updateLocationName(){
  var closest = 'Երևան', minD = Infinity;
  for(var k in LM){
    var L = LM[k];
    var d = Math.hypot(S.x - L.x, S.z - L.z);
    if(d < minD){ minD = d; closest = L.name; }
  }
  var newLoc = minD < 100 ? closest : 'Երևան';
  if(newLoc !== lastLocName){
    lastLocName = newLoc;
    S.loc = newLoc;
    var el = document.getElementById('locName');
    if(el) el.textContent = newLoc;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 28 — CAMERA (follow + drag + auto-align)
   ═══════════════════════════════════════════════════════════════════ */
function updateCamera(dt){
  /* Auto-align to car heading when driving */
  var timeSinceDrag = performance.now() - S.lastCamDrag;
  if(Math.abs(S.speed) > 6 && timeSinceDrag > 1800){
    var diff = S.heading - S.camYaw;
    while(diff >  Math.PI) diff -= Math.PI * 2;
    while(diff < -Math.PI) diff += Math.PI * 2;
    S.camYaw += diff * Math.min(1, 1.8 * dt);
  }

  var dist = S.camDist * Math.cos(S.camPitch * 0.65);
  var high = 1.8 + S.camDist * Math.sin(S.camPitch);

  var tx = S.x - Math.sin(S.camYaw) * dist;
  var tz = S.z - Math.cos(S.camYaw) * dist;
  var ty = terrainHeight(tx, tz) + high;
  var minY = terrainHeight(tx, tz) + 1.7;
  if(ty < minY) ty = minY;

  var k = 1 - Math.exp(-9 * dt);
  S.camX += (tx - S.camX) * k;
  S.camY += (ty - S.camY) * k;
  S.camZ += (tz - S.camZ) * k;

  var lx = S.x + Math.sin(S.heading) * 6;
  var lz = S.z + Math.cos(S.heading) * 6;
  var ly = terrainHeight(S.x, S.z) + 1.3;
  var lk = 1 - Math.exp(-11 * dt);
  S.camLX += (lx - S.camLX) * lk;
  S.camLY += (ly - S.camLY) * lk;
  S.camLZ += (lz - S.camLZ) * lk;

  camera.position.set(S.camX, S.camY, S.camZ);
  camera.lookAt(S.camLX, S.camLY, S.camLZ);

  var tFov = 62 + Math.abs(S.speed / MAX_KMH) * 6;
  if(Math.abs(camera.fov - tFov) > 0.2){
    camera.fov += (tFov - camera.fov) * Math.min(1, 3 * dt);
    camera.updateProjectionMatrix();
  }

  /* Sun follows camera */
  sun.position.set(S.x - 100, 200, S.z + 120);
  sun.target.position.set(S.x, 0, S.z);
  sun.target.updateMatrixWorld();
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 29 — HUD + MINIMAP
   ═══════════════════════════════════════════════════════════════════ */
var spdEl = document.getElementById('spdVal');
var compassEl = document.getElementById('compassArrow');
var perfEl = document.getElementById('perfInfo');
var lastSpd = -1;

var minimapCanvas = document.getElementById('minimap');
var mmCtx = minimapCanvas.getContext('2d');
var MM_SIZE = 264;
var MM_RANGE = 350;

var fps = 0, frameCount = 0, fpsTimer = 0;

function updateHUD(dt){
  var spd = Math.round(Math.abs(S.speed));
  if(spd !== lastSpd){
    spdEl.textContent = spd;
    lastSpd = spd;
  }
  var deg = S.heading * 180 / Math.PI;
  compassEl.style.transform = 'rotate(' + (-deg) + 'deg)';

  /* Perf overlay */
  frameCount++;
  fpsTimer += dt;
  if(fpsTimer >= 0.5){
    fps = Math.round(frameCount / fpsTimer);
    frameCount = 0;
    fpsTimer = 0;
    if(perfEl){
      perfEl.textContent =
        fps + ' FPS · ' +
        renderer.info.render.calls + ' calls · ' +
        renderer.info.render.triangles + ' tris';
    }
  }

  drawMinimap();
}

function drawMinimap(){
  var ctx = mmCtx;
  var S2 = MM_SIZE / 2;
  var scale = (MM_SIZE / 2) / MM_RANGE;
  ctx.clearRect(0, 0, MM_SIZE, MM_SIZE);

  /* Background */
  ctx.fillStyle = '#1a2a3a';
  ctx.fillRect(0, 0, MM_SIZE, MM_SIZE);
  ctx.fillStyle = '#2a4a2a';
  ctx.beginPath();
  ctx.arc(S2, S2, S2 - 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(S2, S2);
  ctx.rotate(-S.heading);

  /* Ring road */
  ctx.strokeStyle = '#ffcc44';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc((0 - S.x) * scale, (0 - S.z) * scale, 78 * scale, 0, Math.PI * 2);
  ctx.stroke();

  /* Main roads */
  ctx.lineWidth = 2.5;
  for(var i = 0; i < ROAD_GRID.length - 1; i++){
    var A = ROAD_GRID[i];
    var B = ROAD_GRID[i + 1];
    ctx.beginPath();
    ctx.moveTo((A.x - S.x) * scale, (A.z - S.z) * scale);
    ctx.lineTo((B.x - S.x) * scale, (B.z - S.z) * scale);
    ctx.stroke();
  }

  /* Serpentine */
  ctx.strokeStyle = '#aa8830';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  for(var si = 0; si < SERPENTINE_PATH.length; si++){
    var W = SERPENTINE_PATH[si];
    var wx = (W.x - S.x) * scale;
    var wy = (W.z - S.z) * scale;
    if(si === 0) ctx.moveTo(wx, wy);
    else ctx.lineTo(wx, wy);
  }
  ctx.stroke();

  /* Landmarks */
  for(var k in LM){
    var L = LM[k];
    var lx = (L.x - S.x) * scale;
    var ly = (L.z - S.z) * scale;
    if(Math.hypot(lx, ly) > S2 - 8) continue;
    ctx.fillStyle = '#ff5577';
    ctx.beginPath();
    ctx.arc(lx, ly, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  /* North */
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('N', 0, -S2 + 16);

  ctx.restore();

  /* Car arrow */
  ctx.save();
  ctx.translate(S2, S2);
  ctx.fillStyle = '#ff3b3b';
  ctx.beginPath();
  ctx.moveTo(0, -9);
  ctx.lineTo(-6, 6);
  ctx.lineTo(0, 3);
  ctx.lineTo(6, 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  /* Border */
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(S2, S2, S2 - 3, 0, Math.PI * 2);
  ctx.stroke();
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 30 — INPUT (Buttons + Keyboard + Camera Drag + Edge Swipe)
   ═══════════════════════════════════════════════════════════════════ */
function bindHold(el, key){
  if(!el) return;
  var on = function(e){
    e.preventDefault();
    IN[key] = true;
    el.classList.add('on');
  };
  var off = function(e){
    e.preventDefault();
    IN[key] = false;
    el.classList.remove('on');
  };
  el.addEventListener('touchstart', on, {passive: false});
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}

bindHold(document.getElementById('btnGas'), 'gas');
bindHold(document.getElementById('btnRev'), 'rev');
bindHold(document.getElementById('btnL'), 'left');
bindHold(document.getElementById('btnR'), 'right');

window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(e.repeat) return;
  if(k === 'arrowup' || k === 'w') IN.gas = true;
  if(k === 'arrowdown' || k === 's') IN.rev = true;
  if(k === 'arrowleft' || k === 'a') IN.left = true;
  if(k === 'arrowright' || k === 'd') IN.right = true;
});
window.addEventListener('keyup', function(e){
  var k = e.key.toLowerCase();
  if(k === 'arrowup' || k === 'w') IN.gas = false;
  if(k === 'arrowdown' || k === 's') IN.rev = false;
  if(k === 'arrowleft' || k === 'a') IN.left = false;
  if(k === 'arrowright' || k === 'd') IN.right = false;
});

/* ── Camera drag zone ── */
(function(){
  var z = document.getElementById('camZone');
  if(!z) return;
  var drag = false, sx = 0, sy = 0, sYaw = 0, sPitch = 0;

  var dn = function(e){
    e.preventDefault();
    drag = true;
    var t = e.touches ? e.touches[0] : e;
    sx = t.clientX;
    sy = t.clientY;
    sYaw = S.camYaw;
    sPitch = S.camPitch;
    S.lastCamDrag = performance.now();
  };
  var mv = function(e){
    if(!drag) return;
    e.preventDefault();
    var t = e.touches ? e.touches[0] : e;
    S.lastCamDrag = performance.now();
    S.camYaw = sYaw - (t.clientX - sx) / 200;
    S.camPitch = Math.max(0.05, Math.min(1.2, sPitch + (sy - t.clientY) / 280));
  };
  var up = function(){ drag = false; };

  z.addEventListener('touchstart', dn, {passive: false});
  z.addEventListener('touchmove', mv, {passive: false});
  z.addEventListener('touchend', up);
  z.addEventListener('touchcancel', up);
  z.addEventListener('mousedown', dn);
  window.addEventListener('mousemove', mv);
  window.addEventListener('mouseup', up);
})();

/* ── Edge swipe detection — hint browser controls ── */
(function(){
  var edgeStartX = null;
  var edgeStartY = null;
  var edgeHintL = document.getElementById('edgeHintL');
  var edgeHintR = document.getElementById('edgeHintR');
  var hintTimerL = null;
  var hintTimerR = null;

  function showHint(which){
    var hint = which === 'left' ? edgeHintL : edgeHintR;
    if(!hint) return;
    hint.classList.add('show');
    if(which === 'left'){
      clearTimeout(hintTimerL);
      hintTimerL = setTimeout(function(){ hint.classList.remove('show'); }, 1200);
    } else {
      clearTimeout(hintTimerR);
      hintTimerR = setTimeout(function(){ hint.classList.remove('show'); }, 1200);
    }
  }

  document.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    var t = e.touches[0];
    if(t.clientX < 20) edgeStartX = t.clientX, edgeStartY = t.clientY;
    else if(t.clientX > window.innerWidth - 20) edgeStartX = t.clientX, edgeStartY = t.clientY;
    else edgeStartX = null;
  }, {passive: true});

  document.addEventListener('touchmove', function(e){
    if(edgeStartX === null) return;
    if(e.touches.length !== 1) return;
    var t = e.touches[0];
    var dx = t.clientX - edgeStartX;
    if(Math.abs(dx) > 12){
      var which = (edgeStartX < 20) ? 'left' : 'right';
      showHint(which);
      /* Try to exit fullscreen when swiping toward edge */
      if(which === 'left' && dx > 15){
        if(document.fullscreenElement){
          try { document.exitFullscreen(); } catch(e){}
        }
      }
      edgeStartX = null;
    }
  }, {passive: true});

  document.addEventListener('touchend', function(){
    edgeStartX = null;
  }, {passive: true});
})();

/* ── Global gesture prevention ── */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){
  if(e.touches.length > 1) e.preventDefault();
}, {passive: false});

/* ═══════════════════════════════════════════════════════════════════
   SECTION 31 — GAME START + RESIZE
   ═══════════════════════════════════════════════════════════════════ */
function startGame(){
  /* Spawn south of Square, facing north toward Cascade */
  S.x = 0;
  S.z = -320;
  S.heading = 0;
  S.speed = 0;
  S.steer = 0;
  S.camYaw = 0;
  S.camPitch = 0.42;
  S.suspensionY = 0;
  S.suspensionV = 0;
  S.bodyRoll = 0;
  S.bodyRollV = 0;
  S.bodyPitch = 0;
  S.bodyPitchV = 0;
  S.wheelSpin = 0;
  S.lastCamDrag = 0;

  var dist = S.camDist;
  S.camX = S.x - Math.sin(S.camYaw) * dist;
  S.camY = terrainHeight(S.camX, S.z - dist) + 3.2;
  S.camZ = S.z - Math.cos(S.camYaw) * dist;
  S.camLX = S.x;
  S.camLY = terrainHeight(S.x, S.z) + 1.3;
  S.camLZ = S.z + 6;

  player.group.position.set(S.x, terrainHeight(S.x, S.z), S.z);
  player.group.rotation.y = S.heading;
  player.group.rotation.x = 0;
  player.group.rotation.z = 0;

  S.phase = 'play';
  lastLocName = '';
  updateLocationName();

  var perf = document.getElementById('perfInfo');
  if(perf) perf.style.display = 'block';
}

function resize(){
  var w = window.innerWidth;
  var h = window.innerHeight;
  renderer.setSize(w, h, false);
  cvs.style.width = '100%';
  cvs.style.height = '100%';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){
  setTimeout(resize, 200);
  setTimeout(resize, 600);
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 32 — MAIN LOOP
   ═══════════════════════════════════════════════════════════════════ */
var lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min(0.04, (now - lastT) / 1000);
  lastT = now;

  if(S.phase === 'play') updatePhysics(dt);
  updateCamera(dt);
  updateHUD(dt);
  renderer.render(scene, camera);
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 33 — INIT
   ═══════════════════════════════════════════════════════════════════ */
resize();
player.group.position.set(S.x, terrainHeight(S.x, S.z), S.z);
requestAnimationFrame(loop);

window.__gameReady = true;
window.__gameStartFn = startGame;
