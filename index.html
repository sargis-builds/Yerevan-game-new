<style>

<script type="module">
import * as THREE from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const $=id=>document.getElementById(id);
const FAILSAFE=setTimeout(()=>{},0);

/* ════════════════════════════════════════════════════════════
   1. ՕԳՆԱԿԱՆ ՖՈՒՆԿՑԻԱՆԵՐ (math, noise, rng)
   ════════════════════════════════════════════════════════════ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry(1210);
const rr=(a,b)=>a+(b-a)*rng();
const hash2=(x,y)=>{const h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);};
function vnoise(x,y){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),u),lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),u),v);
}
function fbm(x,y,o=4){let a=.5,s=0,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5;}return s/(1-Math.pow(.5,o));}
const ridged=(x,z)=>1-Math.abs(2*fbm(x*0.004+3.1,z*0.004+9.7,4)-1);

/* ════════════════════════════════════════════════════════════
   2. ՌԵԼԻԵՖ — հարթավայր + լեռնաշղթա + Կասկադ (աստիճանաձև լեռ)
   x = արևելք, z = հյուսիս, y = վերև
   ════════════════════════════════════════════════════════════ */
const CAS={z0:260,z1:760,n:7,rise:22,half:48};
const STEPLEN=(CAS.z1-CAS.z0)/CAS.n;
function mountainH(x,z){
  const f=0.55+0.45*ridged(x,z);
  const N=sstep(600,1500,z)*60*1.9;      // հյուսիս 1.9x
  const S=sstep(500,1300,-z)*60*0.35;    // հարավ 0.35x
  const E=sstep(600,1400,x)*60*0.95;     // արևելք 0.95x
  const W=sstep(600,1400,-x)*60*1.15;    // արևմուտք 1.15x
  return Math.max(N,S,E,W)*f;
}
function cascadeH(x,z){
  const t=(z-CAS.z0)/(CAS.z1-CAS.z0); if(t<=0) return 0;
  const tc=Math.min(t,1), k=Math.min(CAS.n-1,Math.floor(tc*CAS.n)), fr=tc*CAS.n-k;
  const c=CAS.rise*(k+sstep(0,0.28,fr));
  const half=150-25*tc;
  const m=1-sstep(half,half+170,Math.abs(x));
  const fade=1-sstep(CAS.z1,CAS.z1+340,z);
  return c*m*fade;
}
const GORGE={x:-20,z:-680,a:420,b:110,depth:38};
const gorgeM=(x,z)=>1-sstep(0.35,1,Math.hypot((x-GORGE.x)/GORGE.a,(z-GORGE.z)/GORGE.b));
const HILL={x:540,z:-150,flat:32,out:86,h:16};
const hillD=(x,z)=>Math.hypot(x-HILL.x,z-HILL.z);
function catmull(P,seg){const out=[],g=i=>P[clamp(i,0,P.length-1)];
  for(let i=0;i<P.length-1;i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    for(let k=0;k<seg;k++){const t=k/seg,t2=t*t,t3=t2*t;
      out.push([0,1].map(j=>0.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)));}}
  out.push(P[P.length-1].slice());return out;}
// Վերելքի ճանապարհ՝ Սայաթ-Նովայի արևելյան ծայրից, քաղաքի եզրով շրջանցելով, մինչև Կասկադի գագաթ
const CLP=catmull([[640,0],[760,-90],[860,-260],[840,-520],[700,-720],[420,-830],[60,-870],[-300,-860],[-640,-800],[-900,-620],[-1010,-300],[-1020,60],[-960,420],[-800,700],[-540,830],[-280,840],[-110,790],[-40,768]],12);
const CLS=[0];for(let i=1;i<CLP.length;i++)CLS.push(CLS[i-1]+Math.hypot(CLP[i][0]-CLP[i-1][0],CLP[i][1]-CLP[i-1][1]));
const CLL=CLS[CLS.length-1],CLH=CAS.rise*CAS.n+0.4;
function climbAt(x,z){let bd=1e9,bs=0;
  for(let i=0;i<CLP.length-1;i++){const a=CLP[i],b=CLP[i+1],dx=b[0]-a[0],dz=b[1]-a[1],l2=dx*dx+dz*dz;
    const t=clamp(((x-a[0])*dx+(z-a[1])*dz)/l2,0,1),d=Math.hypot(x-a[0]-dx*t,z-a[1]-dz*t);
    if(d<bd){bd=d;bs=CLS[i]+Math.sqrt(l2)*t;}}
  return[bd,bs];}
function baseH(x,z){
  let h=Math.max(1.2+(fbm(x*0.0035+11,z*0.0035+7,3)-0.5)*2.4+mountainH(x,z),cascadeH(x,z));
  h-=GORGE.depth*gorgeM(x,z);                                   // կիրճ (ամենախորը կետ)
  h+=HILL.h*(1-sstep(HILL.flat,HILL.out,hillD(x,z)));           // եկեղեցու բլուր
  return h;}
function terrainH(x,z){
  const hb=baseH(x,z),c=climbAt(x,z),hr=2+(CLH-2)*c[1]/CLL,span=14+Math.max(26,Math.abs(hr-hb)*1.1);
  return c[0]>=span?hb:lerp(hb,hr,1-sstep(14,span,c[0]));}

/* ════════════════════════════════════════════════════════════
   3. RENDERER / SCENE / ԼՈՒՅՍ / ԵՐԿԻՆՔ
   ════════════════════════════════════════════════════════════ */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
let pixScale=1;
renderer.setPixelRatio(pixScale);               // pixel ratio = 1
renderer.setSize(innerWidth,innerHeight,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=false;               // ստվերներ OFF
const scene=new THREE.Scene();
const FOG=0xd3e4f0;
scene.background=new THREE.Color(FOG);
scene.fog=new THREE.Fog(FOG,600,5000);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.8,7500);
scene.add(new THREE.HemisphereLight(0xdfeaff,0x77744f,1.55));
const sun=new THREE.DirectionalLight(0xfff1d6,2.4);
sun.position.set(-500,800,350);scene.add(sun);

const sky=(()=>{
  const g=new THREE.SphereGeometry(6800,24,14);
  const p=g.attributes.position,cols=[],top=new THREE.Color(0x3d83cf),hor=new THREE.Color(FOG),c=new THREE.Color();
  for(let i=0;i<p.count;i++){const t=clamp(p.getY(i)/6800,0,1);c.copy(hor).lerp(top,Math.pow(t,0.55));cols.push(c.r,c.g,c.b);}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));
  m.renderOrder=-10;m.frustumCulled=false;scene.add(m);return m;
})();

/* ════════════════════════════════════════════════════════════
   4. ՏԵՔՍՏՈՒՐՆԵՐ ԵՎ ՆՅՈՒԹԵՐ (canvas-ով, արտաքին ֆայլեր չկան)
   ════════════════════════════════════════════════════════════ */
function mkTex(w,h,fn){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;
}
function facTex(base,trim,glass,kind,W=128,H=128){
  return mkTex(W,H,(g)=>{
    g.fillStyle=base;g.fillRect(0,0,W,H);
    for(let i=0;i<240;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.05)';g.fillRect(Math.random()*W,Math.random()*H,3+Math.random()*10,1+Math.random()*3);}
    g.fillStyle=trim;g.fillRect(0,H-7,W,7);g.fillRect(0,0,W,3);
    const n=kind==='hotel'?3:1;
    for(let i=0;i<n;i++){
      const cw=W/n,cx=cw*(i+.5);
      const ww=kind==='slit'?cw*.15:(kind==='hotel'?cw*.6:cw*.42);
      const wh=kind==='hotel'?H*.5:H*.54, y0=kind==='hotel'?H*.25:H*.2;
      const gr=g.createLinearGradient(0,y0,0,y0+wh);gr.addColorStop(0,glass[0]);gr.addColorStop(1,glass[1]);
      if(kind==='arch'){
        g.fillStyle=trim;g.beginPath();g.moveTo(cx-ww/2-4,y0+wh+3);g.lineTo(cx-ww/2-4,y0);g.arc(cx,y0,ww/2+4,Math.PI,0);g.lineTo(cx+ww/2+4,y0+wh+3);g.fill();
        g.fillStyle=gr;g.beginPath();g.moveTo(cx-ww/2,y0+wh);g.lineTo(cx-ww/2,y0);g.arc(cx,y0,ww/2,Math.PI,0);g.lineTo(cx+ww/2,y0+wh);g.fill();
        g.fillStyle='rgba(255,255,255,.35)';g.fillRect(cx-1,y0-ww/2,2,wh+ww/2);
      }else{
        g.fillStyle=trim;g.fillRect(cx-ww/2-3,y0-3,ww+6,wh+9);
        g.fillStyle=gr;g.fillRect(cx-ww/2,y0,ww,wh);
        if(kind!=='slit'){g.fillStyle='rgba(255,255,255,.3)';g.fillRect(cx-1,y0,2,wh);g.fillRect(cx-ww/2,y0+wh*.45,ww,2);}
      }
    }
  });
}
const FAC={};
function mkFac(key,base,trim,glass,kind,cw,ch,W,H){
  FAC[key]={mat:new THREE.MeshLambertMaterial({map:facTex(base,trim,glass,kind,W,H)}),cw,ch};
}
const GL=['#35506e','#142235'];
mkFac('pink','#d3946f','#ead6bd',GL,'arch',8,6.6);
mkFac('orange','#df9f60','#f0dcc0',GL,'sq',8,6.2);
mkFac('tan','#d9c39b','#f3ead7',['#4a6683','#1b2c40'],'sq',8,6.4);
mkFac('gray','#b4aea4','#dcd8cf',['#3b5670','#17283a'],'sq',8,6.0);
mkFac('basalt','#6c6864','#8c8781',['#222','#0a0a0a'],'slit',7,8);
mkFac('cream','#e6d9bd','#faf3e2',GL,'arch',8,7);
mkFac('hotel','#cdbf9f','#f0e8d4',['#3e607f','#16273a'],'hotel',20,2.27,256,40);
mkFac('blue','#3d9bc2','#eaf5f7',['#16384f','#0a2133'],'arch',7,6.4);
mkFac('tuff','#d4a96d','#efd9ae',['#3a2a1c','#1a120b'],'arch',6,7);
const FILLERS=['pink','orange','tan','gray'];

const lam=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const OVL=n=>({polygonOffset:true,polygonOffsetFactor:-n,polygonOffsetUnits:-n});
const M={
  stone:lam(0xe9dfc8),stoneDk:lam(0xa79c88),limestone:lam(0xe7dcc2),white:lam(0xf4f1ea),dark:lam(0x232831),
  roofRed:lam(0xb4502f),copper:lam(0x5fa38b),gold:lam(0xe8b94a,{emissive:0x4a3300}),glass:lam(0x2a4766),
  hedge:lam(0x2f7a38),lawn:lam(0x6fae4c,OVL(1)),water:lam(0x3fa7d6,{transparent:true,opacity:.88,emissive:0x0a3550}),
  basalt:lam(0x6c6864),steel:lam(0xb9c0c8),
  sidewalk:lam(0xbdb7ab,OVL(1)),asphalt:lam(0x383b41,OVL(2)),lineW:lam(0xf2f2f2,OVL(3)),
  pave:new THREE.MeshLambertMaterial({map:mkTex(64,64,(g,W,H)=>{g.fillStyle='#d8c8a6';g.fillRect(0,0,W,H);g.strokeStyle='#b7a584';g.lineWidth=2;for(let i=0;i<=W;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,H);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(W,i);g.stroke();}g.fillStyle='rgba(170,110,90,.35)';g.fillRect(34,34,28,28);g.fillRect(2,2,28,28);}),polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1}),
  path:new THREE.MeshLambertMaterial({map:mkTex(32,32,(g,W,H)=>{g.fillStyle='#b98a73';g.fillRect(0,0,W,H);g.strokeStyle='#8f6652';g.lineWidth=2;g.strokeRect(1,1,W-2,H-2);g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke();}),polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),
  dash:new THREE.MeshLambertMaterial({map:mkTex(16,64,(g,W,H)=>{g.clearRect(0,0,W,H);g.fillStyle='#f2c200';g.fillRect(0,0,W,28);}),alphaTest:.5,...OVL(3)}),
  zebra:new THREE.MeshLambertMaterial({map:mkTex(64,16,(g,W,H)=>{g.clearRect(0,0,W,H);g.fillStyle='#f4f4f4';for(let i=0;i<7;i++)g.fillRect(i*9.14+1,0,5,H);}),alphaTest:.5,...OVL(3)}),
  tail:lam(0x7a0d0d,{emissive:0x550000}),head:lam(0xfff3c4,{emissive:0xb9a36a}),
};
M.dash.map.repeat.set(1,1);
Object.assign(M,{turq:lam(0x2fb4c4,{emissive:0x0b3d46}),opDome:lam(0x8f949a),tuff:lam(0xd4a96d),tuffDk:lam(0xa97f4b)});

/* ════════════════════════════════════════════════════════════
   5. ՍՏԱՏԻԿ ԳԵՈՄԵՏՐԻԱՅԻ BATCH (draw-call-ները նվազեցնելու համար)
   ════════════════════════════════════════════════════════════ */
const batch=new Map();
function addGeoM(geo,mat,m,own=false){
  const g=own?geo:geo.clone();
  if(m) g.applyMatrix4(m);
  for(const k of Object.keys(g.attributes)) if(k!=='position'&&k!=='normal'&&k!=='uv') g.deleteAttribute(k);
  if(!g.attributes.uv) g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
  if(!g.attributes.normal) g.computeVertexNormals();
  g.clearGroups();
  let l=batch.get(mat); if(!l){l=[];batch.set(mat,l);} l.push(g);
}
function flushBatch(){
  for(const [mat,list] of batch){
    const allIdx=list.every(g=>g.index);

  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),col=new THREE.Color(),e=new THREE.Euler();
  let i=0;
  const tr=(t,h)=>{m.compose(_P.set(t.x,t.y-0.1,t.z),q.identity(),_S.set(t.s,h*t.s,t.s));trunk.setMatrixAt(i++,m);};
  t0.forEach(t=>tr(t,3));t1.forEach(t=>tr(t,2));trunk.count=i;
  t0.forEach((t,k)=>{
    e.set(0,t.r*6,0);q.setFromEuler(e);
    m.compose(_P.set(t.x,t.y+3.9*t.s,t.z),q,_S.set(2.3*t.s,2.0*t.s,2.3*t.s));c0.setMatrixAt(k,m);
    col.setHSL(0.26+0.05*t.r,0.5,0.25+0.13*((t.r*7)%1));c0.setColorAt(k,col);
  });
  t1.forEach((t,k)=>{
    e.set(0,t.r*6,0);q.setFromEuler(e);
    m.compose(_P.set(t.x,t.y+1.6*t.s,t.z),q,_S.set(1.9*t.s,9*t.s,1.9*t.s));c1.setMatrixAt(k,m);
    col.setHSL(0.33,0.42,0.16+0.08*((t.r*5)%1));c1.setColorAt(k,col);

}

/* ════════════════════════════════════════════════════════════
   10. ՌԵԼԻԵՖԻ MESH + հեռավոր լեռներ

function buildTerrain(){
  const X0=-1500,X1=1500,Z0=-1200,Z1=1500,ST=10;
  const nx=Math.round((X1-X0)/ST)+1,nz=Math.round((Z1-Z0)/ST)+1;
  const hs=new Float32Array(nx*nz),pos=new Float32Array(nx*nz*3),col=new Float32Array(nx*nz*3);
  for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){
    const x=X0+i*ST,z=Z0+j*ST,h=terrainH(x,z),k=j*nx+i;hs[k]=h;pos[k*3]=x;pos[k*3+1]=h;pos[k*3+2]=z;
  }
  const c=new THREE.Color(),grass=new THREE.Color(0x7aa357),dry=new THREE.Color(0x9bab6c),rock=new THREE.Color(0x8d8777),hi=new THREE.Color(0xb3afa3),stone=new THREE.Color(0xe6d9b9),dark=new THREE.Color(0x55734a);
  for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){
    const k=j*nx+i,x=pos[k*3],z=pos[k*3+2],h=hs[k];
    const hx=(hs[j*nx+Math.min(nx-1,i+1)]-hs[j*nx+Math.max(0,i-1)])/(2*ST),hz=(hs[Math.min(nz-1,j+1)*nx+i]-hs[Math.max(0,j-1)*nx+i])/(2*ST);
    const slope=Math.hypot(hx,hz);
    const n=vnoise(x*0.03,z*0.03);
    c.copy(grass).lerp(dry,clamp(n*1.1-0.2+(1-sstep(0,25,h))*0.25,0,1));
    if(h>30)c.lerp(dark,sstep(30,70,h)*0.5);
    if(h>60)c.lerp(rock,sstep(60,110,h));
    if(h>110)c.lerp(hi,sstep(110,170,h));
    if(slope>0.55)c.lerp(rock,clamp((slope-0.55)*1.6,0,0.85));
    
    if(Math.abs(x)<CAS.half+1&&z>CAS.z0-2&&z<CAS.z1+8)c.copy(stone);
    else if(z>CAS.z0&&z<CAS.z1+10&&Math.abs(x)<190&&slope>0.7)c.lerp(stone,0.55);
    col[k*3]=c.r;col[k*3+1]=c.g;col[k*3+2]=c.b;
  }
  const idx=new Uint32Array((nx-1)*(nz-1)*6);let p=0;
  for(let j=0;j<nz-1;j++)for(let i=0;i<nx-1;i++){
    const a=j*nx+i,b=a+1,d=a+nx,e=d+1;
    idx[p++]=a;idx[p++]=d;idx[p++]=b;idx[p++]=b;idx[p++]=d;idx[p++]=e;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setIndex(new THREE.BufferAttribute(idx,1));g.computeVertexNormals();
  scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})));
}
function buildFarPeaks(){

/* ════════════════════════════════════════════════════════════
   11. ՓՈՂՈՑՆԵՐ — մայթ, ասֆալտ, գծանշում, զեբրա
   ════════════════════════════════════════════════════════════ */
function buildRoads(){
  const R=RING.r;
  // 1) մայթեր
  for(const e of edges)ribbon([e.a,e.b],RW+2*SW,0.10,M.sidewalk,6,8,12);
  disc(M.sidewalk,0,0,R-RW/2-SW,R+RW/2+SW,0.10);
  for(const d of DISCS)disc(M.sidewalk,d.x,d.z,0.01,d.r+SW,0.10);
  // 2) ասֆալտ
  for(const e of edges)ribbon([e.a,e.b],RW,0.16,M.asphalt,8,8,8);
  disc(M.asphalt,0,0,R-RW/2,R+RW/2,0.16);
  for(const d of DISCS)disc(M.asphalt,d.x,d.z,0.01,d.r,0.16);
  // 3) գծանշում
  for(const e of edges){
    if(e.len>34)ribbon([[e.a[0]+e.dx*14,e.a[1]+e.dz*14],[e.b[0]-e.dx*14,e.b[1]-e.dz*14]],0.35,0.20,M.dash,12,0,6);
    if(e.len>26){
      for(const sgn of[1,-1]){
        const ox=e.dz*7.3*sgn,oz=-e.dx*7.3*sgn;
        ribbon([[e.a[0]+ox+e.dx*10,e.a[1]+oz+e.dz*10],[e.b[0]+ox-e.dx*10,e.b[1]+oz-e.dz*10]],0.2,0.20,M.lineW,6,0,8);
      }
    }
  }
  disc(M.lineW,0,0,R-RW/2+0.4,R-RW/2+0.62,0.20);disc(M.lineW,0,0,R+RW/2-0.62,R+RW/2-0.4,0.20);
  // 4) զեբրա անցումներ
  const nodes=new Map();
  const addArm=(x,z,dx,dz,len)=>{const k=Math.round(x)+','+Math.round(z);let n=nodes.get(k);if(!n){n={x,z,arms:[]};nodes.set(k,n);}n.arms.push([dx,dz,len]);};
  for(const e of edges){addArm(e.a[0],e.a[1],e.dx,e.dz,e.len);addArm(e.b[0],e.b[1],-e.dx,-e.dz,e.len);}
  const zebra=(x,z,dx,dz)=>plane(M.zebra,x,z,14,3.4,Math.atan2(-dx,-dz),0.22,0);
  for(const n of nodes.values()){
    const onRing=Math.abs(Math.hypot(n.x,n.z)-R)<1;
    if(onRing){for(const [dx,dz,len] of n.arms)if(len>30)zebra(n.x+dx*17,n.z+dz*17,dx,dz);}
    else if(n.arms.length>=3){for(const [dx,dz,len] of n.arms)if(len>32)zebra(n.x+dx*12.5,n.z+dz*12.5,dx,dz);}
  }
}

/* ════════════════════════════════════════════════════════════
   12. ԲԱԿԵՐ — սալիկ, hedge, GATE, շավիղ դեպի գլխավոր փողոց
   ════════════════════════════════════════════════════════════ */
function hedgeSeg(xa,za,xb,zb,th=1.4,h=1.3){
  const cx=(xa+xb)/2,cz=(za+zb)/2,lx=Math.abs(xb-xa)+th,lz=Math.abs(zb-za)+th;
  const L=new Loc(cx,cz,0);L.box(0,-0.6,0,lx,h+0.6,lz,M.hedge);
  addOBB(cx,cz,lx/2,lz/2,0,false,'hedge');
}
function pathTo(gx,gz,ex,ez,w){      // շավիղ (gx,gz)→(ex,ez)
  const dx=ex-gx,dz=ez-gz,l=Math.hypot(dx,dz);if(l<1)return;
  const cx=(gx+ex)/2,cz=(gz+ez)/2,rot=Math.atan2(-dz,dx);
  plane(M.path,cx,cz,l,w,rot,0.14,3);
  softZones.push({t:0,x:cx,z:cz,hx:l/2,hz:w/2+1.5,c:Math.cos(rot),s:Math.sin(rot)});
}
function lamp(x,z){
  const L=new Loc(x,z,0);L.cyl(0,0,0,0.12,4.2,M.dark,6);L.sph(0,4.4,0,0.4,M.head);
}
function makeYard(o){
  const cx=(o.x0+o.x1)/2,cz=(o.z0+o.z1)/2,w=o.x1-o.x0,d=o.z1-o.z0;
  const G=7;                                           // gate-ի կես-լայնք
  let gx,gz,nx=0,nz=0;
  if(o.gate==='N'){gx=o.gpos;gz=o.z1;nz=1;}
  else if(o.gate==='S'){gx=o.gpos;gz=o.z0;nz=-1;}
  else if(o.gate==='E'){gx=o.x1;gz=o.gpos;nx=1;}
  else{gx=o.x0;gz=o.gpos;nx=-1;}
  const Y={...o,cx,cz,w,d,gx,gz,nx,nz};yards.push(Y);
  plane(M.pave,cx,cz,w,d,0,0.12,6);
  for(const l of (o.lawns||[]))plane(M.lawn,l[0],l[1],l[2],l[3],0,0.16,0);
  // 4 կողմի hedge-եր, gate-ի կողմում բացվածքով
  const side=(xa,za,xb,zb,isGate)=>{
    if(!isGate){hedgeSeg(xa,za,xb,zb);return;}
    if(xa===xb){hedgeSeg(xa,za,xa,gz-G);hedgeSeg(xa,gz+G,xa,zb);}
    else{hedgeSeg(xa,za,gx-G,za);hedgeSeg(gx+G,za,xb,zb);}
  };
  side(o.x0,o.z1,o.x1,o.z1,o.gate==='N');side(o.x0,o.z0,o.x1,o.z0,o.gate==='S');
  side(o.x1,o.z0,o.x1,o.z1,o.gate==='E');side(o.x0,o.z0,o.x0,o.z1,o.gate==='W');
  // gate-ի սյուներ
  for(const sg of[-1,1]){
    const px=gx+(nz?sg*G:0),pz=gz+(nx?sg*G:0),L=new Loc(px,pz,0);
    L.box(0,-0.6,0,1.6,4.4,1.6,M.stone);L.sph(0,4.8,0,0.7,M.gold);addOBB(px,pz,0.8,0.8,0,false,'gate');
  }
  // շավիղ դեպի ճանապարհ
  const q=nearestRoadPoint(gx,gz);
  const dd=Math.hypot(q[0]-gx,q[1]-gz),ux=(q[0]-gx)/dd,uz=(q[1]-gz)/dd;
  Y.roadPt=q;Y.pathLen=dd-HW;
  pathTo(gx,gz,q[0]-ux*(HW-0.5),q[1]-uz*(HW-0.5),6);
  lamp(gx+(nz?-G-2:0)+ux*3,gz+(nx?-G-2:0)+uz*3);lamp(gx+(nz?G+2:0)+ux*3,gz+(nx?G+2:0)+uz*3);
  Y.plant=(opt={})=>{
    if(o.entry)pathTo(gx,gz,o.entry[0],o.entry[1],8);
    // պարագծով ծառեր
    const step=opt.step||15;
    for(let x=o.x0+4;x<=o.x1-4;x+=step){for(const z of[o.z0+3.5,o.z1-3.5])if(Math.hypot(x-gx,z-gz)>14)addTree(x,z,rr(.9,1.3));}
    for(let z=o.z0+4+step;z<=o.z1-4-step;z+=step){for(const x of[o.x0+3.5,o.x1-3.5])if(Math.hypot(x-gx,z-gz)>14)addTree(x,z,rr(.9,1.3));}
    const n=opt.scatter||0;
    for(let i=0,t=0;i<n&&t<n*8;t++){
      let x,z;
      if(o.lawns&&o.lawns.length){const l=o.lawns[Math.floor(rng()*o.lawns.length)];x=l[0]+rr(-l[2]/2+2,l[2]/2-2);z=l[1]+rr(-l[3]/2+2,l[3]/2-2);}
      else{x=rr(o.x0+6,o.x1-6);z=rr(o.z0+6,o.z1-6);}
      if(addTree(x,z,rr(.9,1.5)))i++;
    }
  };
  return Y;
}

  let impactMag=0, impactNx=0, impactNz=0;
  let hadSoftContact=false;

  const dist=v*dt, sub=Math.max(1,Math.ceil(Math.abs(dist)/0.5)), sd=dt/sub;
  for(let i=0;i<sub;i++){
    car.yaw+=car.yawRate*sd;
    const fx=Math.sin(car.yaw),fz=Math.cos(car.yaw);
    let nx=car.x+fx*v*sd,nz=car.z+fz*v*sd;
    if(blockedTerrain(nx,nz)||(v>0&&blockedTerrain(nx+fx*1.8,nz+fz*1.8))||(v<0&&blockedTerrain(nx-fx*1.8,nz-fz*1.8))){
      if(!blockedTerrain(nx,car.z))nz=car.z;
      else if(!blockedTerrain(car.x,nz))nx=car.x;
      else{nx=car.x;nz=car.z;}
      v*=0.6;
    }
    car.x=nx;car.z=nz;

    for(let it=0;it<2;it++){
      for(const off of CIRCLES){
        const cx=car.x+fx*off,cz=car.z+fz*off;
        nearColliders(cx,cz,CAR_R+1,c=>{
          const h=hitCircle(c,cx,cz,CAR_R); if(!h)return;

          // world velocity vector
          const vx=fx*v, vz=fz*v;
          // signed component of velocity along the contact normal
          const vn = vx*h.nx + vz*h.nz;   // negative = moving INTO the wall

          // ─── SOFT (hedge): slow + shake, never stop ───
          if(c.tag==='hedge'){
            if(vn<0){
              const f=Math.min(1,Math.abs(vn)/12);
              v*=1-0.15*f;
              hadSoftContact=true;
              if(-vn>impactMag){impactMag=-vn*0.4;impactNx=h.nx;impactNz=h.nz;}
            }
            car.x+=h.nx*h.pen*0.3;
            car.z+=h.nz*h.pen*0.3;
            return;
          }

          // ─── HARD wall ───
          car.x+=h.nx*h.pen; car.z+=h.nz*h.pen;

          if(vn < -0.05){
            const headOn = Math.min(1, -vn / Math.max(1.5, Math.abs(v)));
            // decompose velocity: kill normal component, keep tangent (natural slide)
            const vtx = vx - vn*h.nx;
            const vtz = vz - vn*h.nz;
            const tinyBounce = vn * 0.06;              // 6% restitution, subtle
            const nvx = vtx + tinyBounce*h.nx;
            const nvz = vtz + tinyBounce*h.nz;
            // project back to car's forward scalar
            v = nvx*fx + nvz*fz;

            // auto-align: rotate toward wall tangent (kicks in only if not steering hard)
            let tx=-h.nz, tz=h.nx;
            if(tx*fx + tz*fz < 0){tx=-tx;tz=-tz;}
            const tanYaw = Math.atan2(tx,tz);
            const steerFactor = 1 - Math.min(1,Math.abs(car.steer)/0.55)*0.75;
            const align = headOn*headOn * 0.12 * steerFactor;
            car.yaw += angDiff(tanYaw,car.yaw)*align;

            // register impulse for suspension (opposite of wall normal, i.e. into car)
            const mag = -vn;
            if(mag>impactMag){
              impactMag=mag;
              impactNx=-h.nx; impactNz=-h.nz;   // opposite = pushing car back
            }
          }
        });
      }
    }
  }
  car.ax=(v-v0)/Math.max(dt,1e-4); car.v=v;

  // ═══ Suspension & body attitude ═══
  const c=Math.cos(car.yaw), s=Math.sin(car.yaw);
  const W2=(lx,lz)=>[car.x+lx*c+lz*s, car.z-lx*s+lz*c];
  let sumH=0,frontH=0,rearH=0,leftH=0,rightH=0; const wT=[];
  for(let i=0;i<4;i++){
    const wp=WHEEL_POS[i]; const [wx,wz]=W2(wp.sx*TRACK/2,wp.sz);
    const th=terrainH(wx,wz); wT.push(th); sumH+=th;
    if(wp.front)frontH+=th; else rearH+=th;
    if(wp.sx>0)leftH+=th; else rightH+=th;
  }
  frontH*=0.5; rearH*=0.5; leftH*=0.5; rightH*=0.5;
  const avgH=sumH/4, targetY=avgH+REST_Y;

  // vertical spring — gentle, critically damped (NOT turtle, NOT ostrich)
  car.vy += (50*(targetY-car.y) - 12*car.vy) * dt;
  car.y  += car.vy * dt;
  if(Math.abs(car.y-targetY) > 1.0) car.y = targetY;

  // ─── impact compression (only when actually hit) ───
  // amplitude ∝ |v_into_wall|, direction is opposite the impact normal
  if(impactMag > 1.0){
    // compress body toward the impact (downward from the shock)
    const kick = Math.min(impactMag * 0.012, 0.14);   // max 14cm compression
    car.bodyBounce = Math.min(car.bodyBounce, -kick);
    // small velocity kick so it "sinks" then recovers
    car.bodyBounceV -= impactMag * 0.20;

    // pitch response: nose up if hit from front, nose down if hit from rear
    const fwdX = Math.sin(car.yaw), fwdZ = Math.cos(car.yaw);
    const fwdInto = fwdX*impactNx + fwdZ*impactNz;    // negative = wall in front
    car.bodyPitch += fwdInto * Math.min(0.03, impactMag * 0.004);

    // roll response: lean away from the side of impact
    const sideX = Math.cos(car.yaw), sideZ = -Math.sin(car.yaw); // right vector
    const sideInto = sideX*impactNx + sideZ*impactNz;
    car.bodyRoll += sideInto * Math.min(0.035, impactMag * 0.005);
  }

  // ─── body bounce spring, ASYMMETRIC damping ───
  // Compression (bodyBounce moving down):  fast, low damping → sharp
  // Recovery  (bodyBounce going back up):  twice the damping → half-rate return
  const kSpring = 70;
  let damp = 12;
  if(car.bodyBounce < 0 && car.bodyBounceV > 0){
    // we're below rest and moving upward = recovery phase
    damp = 26;   // ≈2× → recovery at half the rate
  }
  car.bodyBounceV += (-kSpring*car.bodyBounce - damp*car.bodyBounceV) * dt;
  car.bodyBounce  += car.bodyBounceV * dt;
  // clamp so we never look like a crawling turtle
  car.bodyBounce = clamp(car.bodyBounce, -0.16, 0.08);

  // ─── attitude: terrain + dynamic weight transfer ───
  const terrPitch = -Math.atan2(frontH-rearH, WB_LEN);
  const terrRoll  =  Math.atan2(leftH-rightH, TRACK);
  const dynPitch  = clamp(car.ax * 0.004, -0.03, 0.03);
  const dynRoll   = clamp(car.v * car.yawRate * 0.010, -0.05, 0.05);
  const tgtPitch  = terrPitch + dynPitch;
  const tgtRoll   = terrRoll  + dynRoll;
  car.bodyPitch += (tgtPitch - car.bodyPitch) * Math.min(1, dt*6);
  car.bodyRoll  += (tgtRoll  - car.bodyRoll ) * Math.min(1, dt*6);

  // ─── apply transforms ───
  carRoot.position.set(car.x, car.y, car.z);
  carRoot.rotation.set(0, car.yaw, 0);
  chassis.rotation.set(car.bodyPitch, 0, car.bodyRoll);
  chassis.position.y = car.bodyBounce;

  // ─── wheels: per-wheel terrain contact ───
  for(let i=0;i<4;i++){
    const wp = WHEEL_POS[i];
    const localY = wT[i] + REST_Y - car.y;
    car.wheelY[i] += (localY - car.wheelY[i]) * Math.min(1, dt*28);
    wheels[i].steer.position.y = car.wheelY[i];
    wheels[i].steer.rotation.y = wp.front ? -car.steer : 0;
    wheels[i].spin.rotation.x += car.v * dt / 0.36;
  }

  // ─── shadow ───
  const sh = carRoot.userData.shadow;
  sh.position.set(car.x, car.y - REST_Y + 0.06, car.z);
  sh.rotation.set(-Math.PI/2, car.yaw, 0);

  // ─── brake lights ───
  M.tail.emissive.setHex(car.braking ? 0xff2a2a : 0x550000);
  M.tail.color.setHex(car.braking ? 0xff4040 : 0x7a0d0d);
}
  /* ════════════════════════════════════════════════════════════
   17. ԿԱՄԵՐԱ — third-person chase, drag-ով պտույտ, auto-return
   ════════════════════════════════════════════════════════════ */
const cam={yaw:0,off:0,pitch:0.05,pos:new THREE.Vector3(0,10,-190),look:new THREE.Vector3(),drag:false,pid:null,lx:0,ly:0,last:0,init:false};
function updateCamera(dt,now){
  if(!cam.init){cam.yaw=car.yaw;cam.init=true;}
  cam.yaw-=angDiff(cam.yaw,car.yaw)*(1-Math.exp(-dt*(car.v<-1?1.2:3.2)));
  if(!cam.drag&&now-cam.last>1.1)cam.off*=Math.exp(-dt*2.6);

  const yaw=cam.yaw+cam.off, sp=Math.abs(car.v);
  const dist=6.5+sp*0.04;
  const cp=Math.cos(cam.pitch), sy=Math.sin(yaw), cy=Math.cos(yaw);

  const groundY = car.y - REST_Y;
  const eyeY = groundY + 1.65 + Math.sin(cam.pitch)*dist*0.55;

  const want=new THREE.Vector3(
    car.x - sy*dist*cp,
    eyeY,
    car.z - cy*dist*cp
  );
  cam.pos.lerp(want,1-Math.exp(-dt*11));

  const gh=terrainH(cam.pos.x,cam.pos.z)+1.15;
  if(cam.pos.y<gh)cam.pos.y=gh;

  camera.position.copy(cam.pos);
  cam.look.set(car.x + sy*4, car.y + 0.85, car.z + cy*4);
  camera.lookAt(cam.look);

  const fov=58+Math.min(14,sp*0.35);
  if(Math.abs(camera.fov-fov)>0.05){
    camera.fov+=(fov-camera.fov)*Math.min(1,dt*4);
    camera.updateProjectionMatrix();
  }
  sky.position.copy(camera.position);
}

/* ════════════════════════════════════════════════════════════
   19. ՎԱԼԻԴԱՑԻԱ — տոպոլոգիայի ինքնաստուգում (console)
   ════════════════════════════════════════════════════════════ */
function rectOBB(r){return{x:r.cx,z:r.cz,hx:r.w/2,hz:r.d/2,c:1,s:0};}
function validate(){
  const rep={errors:[],info:[]};
  // 1) բակերը չեն համընկնում միմյանց և փողոցների հետ
  for(let i=0;i<yards.length;i++)for(let j=i+1;j<yards.length;j++)
    if(obbOverlap(rectOBB(yards[i]),rectOBB(yards[j])))rep.errors.push(`բակերը համընկնում են՝ ${yards[i].name} ↔ ${yards[j].name}`);
  for(const y of yards){
    let minD=1e9;
    for(let x=y.x0;x<=y.x1;x+=4)for(const z of[y.z0,y.z1])minD=Math.min(minD,roadDist(x,z));
    for(let z=y.z0;z<=y.z1;z+=4)for(const x of[y.x0,y.x1])minD=Math.min(minD,roadDist(x,z));
    if(minD<HW)rep.errors.push(`բակ «${y.name}» մտնում է փողոցի մեջ (հեռ. ${minD.toFixed(1)} < ${HW})`);
    rep.info.push(`բակ ${y.name}: gate→փողոց շավիղ ${y.pathLen.toFixed(0)} մ`);
    if(y.pathLen>70||y.pathLen<0)rep.errors.push(`բակ ${y.name}: շավիղը անհամապատասխան է`);
  }
  // 2) շենքերը՝ իրենց բակի ներսում
  for(const y of yards)for(const b of landmarkBuildings){
    if(b.ell||b.name.startsWith('square')||b.name==='filler'||b.name==='avenue-bld')continue;
    const inside=b.x>y.x0&&b.x<y.x1&&b.z>y.z0&&b.z<y.z1;
    if(inside){
      for(const[sx,sz]of[[1,1],[1,-1],[-1,1],[-1,-1]]){
        const px=b.x+sx*b.hx*b.c+sz*b.hz*b.s*(b.s?1:0),pz=b.z+sz*b.hz*b.c-sx*b.hx*b.s*(b.s?1:0);
        if(px<y.x0||px>y.x1||pz<y.z0||pz>y.z1)rep.errors.push(`շենք ${b.name} դուրս է գալիս բակից ${y.name}`);
      }
    }
  }
  // 3) շենք-շենք համընկնում
  const B=landmarkBuildings.filter(b=>!b.ell);
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++)if(obbOverlap(B[i],B[j]))rep.errors.push(`շենքերը համընկնում են՝ ${B[i].name} ↔ ${B[j].name}`);
  // 4) շենքերը փողոցներից հեռու
  for(const b of landmarkBuildings){
    const pts=[[0,0],[b.hx,b.hz],[-b.hx,b.hz],[b.hx,-b.hz],[-b.hx,-b.hz]];
    for(const[p,q]of pts){const x=b.x+p*b.c+q*b.s,z=b.z-p*b.s+q*b.c;if(roadDist(x,z)<HW-0.5){rep.errors.push(`շենք ${b.name} մտնում է փողոցի մեջ (${x.toFixed(0)},${z.toFixed(0)})`);break;}}
  }
  // 5) կապակցվածություն — բոլոր նշանակետերը հասանելի են
  const key=p=>Math.round(p[0])+','+Math.round(p[1]);
  const adj=new Map();const link=(a,b)=>{const ka=key(a),kb=key(b);(adj.get(ka)||adj.set(ka,new Set()).get(ka)).add(kb);(adj.get(kb)||adj.set(kb,new Set()).get(kb)).add(ka);};
  const ringNodes=[];
  for(const e of edges){link(e.a,e.b);for(const p of[e.a,e.b])if(Math.abs(Math.hypot(p[0],p[1])-RING.r)<1)ringNodes.push(p);}
  for(let i=1;i<ringNodes.length;i++)link(ringNodes[0],ringNodes[i]);
  const start=key([0,-105]),seen=new Set([start]),q=[start];
  while(q.length){const k=q.pop();for(const n of adj.get(k)||[])if(!seen.has(n)){seen.add(n);q.push(n);}}
  for(const k of adj.keys())if(!seen.has(k))rep.errors.push('անջատված հանգույց՝ '+k);
  // 6) ամեն հանգույց (ծայր) ունի պատճառ՝ խաչմերուկ/օղակ/շրջան/կառուցված եզր
  const deg=new Map();for(const e of edges){for(const p of[e.a,e.b]){const k=key(p);deg.set(k,(deg.get(k)||0)+1);}}
  for(const[k,d]of deg){
    if(d>=2)continue;const[x,z]=k.split(',').map(Number);
    const ok=Math.abs(Math.hypot(x,z)-RING.r)<1||DISCS.some(c=>Math.hypot(x-c.x,z-c.z)<2);
    if(!ok)rep.errors.push('«կախված» փողոցի ծայր՝ '+k);
  }
  // 7) նշանակետերը ճանապարհի վրա են
  for(const l of LM){const dd=Math.min(roadDist(l.t[0],l.t[1]),climbAt(l.t[0],l.t[1])[0]);if(dd>8.5)rep.errors.push(`նշանակետ «${l.name}» ճանապարհի վրա չէ (${dd.toFixed(1)})`);}
  rep.info.push(`փողոցի կողեր՝ ${edges.length}, շենքեր՝ ${landmarkBuildings.length}, բակեր՝ ${yards.length}, collider՝ ${colliders.length}, ծառեր՝ ${TREES.length}`);
  return rep;
}

function bindBtn(el,prop){
  const on=e=>{e.preventDefault();input[prop]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){}};
  const off=e=>{input[prop]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

function buildWorld(){
  const msg=t=>{$('lmsg').textContent=t;};
  buildTerrain();
  const GC=new THREE.Color(0x2d5a2f);

  // ─── Շրջապատի արտացոլման քարտեզ՝ մետաղի/ապակու փայլի համար ───
  const pmrem = new THREE.PMREMGenerator(renderer);

  buildRoads();
  buildClimb();
  buildSquare();buildCascade();buildOpera();buildMatenadaran();buildGallery();buildMarriott();buildUniversity();buildAvenue();buildMosque();buildChurch();
  const nf=placeFillers();
  
  streetTrees();
  // ամպեր
  const cm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.92,depthWrite:false});
  const cl=new THREE.InstancedMesh(USPH,cm,70);const m=new THREE.Matrix4();let k=0;
  for(let i=0;i<14;i++){
    const a=rr(0,TAU),d=rr(900,3200),cx=Math.cos(a)*d,cz=Math.sin(a)*d,cy=rr(650,950);
    for(let j=0;j<5&&k<70;j++){m.compose(_P.set(cx+rr(-120,120),cy+rr(-20,20),cz+rr(-90,90)),_Q.identity(),_S.set(rr(80,170),rr(28,48),rr(60,110)));cl.setMatrixAt(k++,m);}
  }
  cl.count=k;cl.frustumCulled=false;scene.add(cl);
  finalizeTrees();
  flushBatch();
  buildCar();
  return nf;
}
let last=0,ema=16,adaptT=0;
function frame(t){
  requestAnimationFrame(frame);
  const now=t/1000;let dt=Math.min(0.05,now-last||0.016);last=now;
  physics(dt);updateMission(dt,now);updateCamera(dt,now);
  for(const j of jets){const u=j.userData;j.scale.set(1,u.h*(0.75+0.25*Math.sin(now*3+u.ph)),1);}
  renderer.render(scene,camera);
  // ադապտիվ լուծաչափ՝ 60 FPS թիրախի համար
  ema+=(dt*1000-ema)*0.05;adaptT+=dt;
  if(adaptT>2.5){adaptT=0;if(ema>24&&pixScale>0.6){pixScale=Math.max(0.6,pixScale-0.15);renderer.setPixelRatio(pixScale);renderer.setSize(innerWidth,innerHeight,false);}}
}
function start(){
  try{
    const nf=buildWorld();
    const rep=validate();
    console.log('%cԵրևան · տոպոլոգիայի ստուգում','font-weight:bold;color:#2a8',rep.info.join('\n'));
    if(rep.errors.length)console.warn('Խնդիրներ:\n'+rep.errors.join('\n'));else console.log('✅ Տոպոլոգիան կոռեկտ է. համընկնումներ կամ կախված փողոցներ չկան.');
    window.__yerevan={rep,car,LM,fillers:nf};
    newMission();
    const L=$('loading');L.style.opacity=0;setTimeout(()=>L.remove(),700);
    setTimeout(()=>{$('help').style.opacity=0;},9000);
    requestAnimationFrame(frame);
  }catch(err){
    console.error(err);$('lmsg').textContent='Սխալ՝ '+err.message+' (տես console)';
  }
}
setTimeout(start,30);
</script>
