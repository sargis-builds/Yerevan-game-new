<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#87ceeb">
<title>Երևան · 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;color:#fff;touch-action:none;overscroll-behavior:none;position:fixed}
#app{position:fixed;inset:0;overflow:hidden}
@media (orientation:portrait){#app{width:100vh;height:100vw;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,0,0,.32) 100%)}

#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.panel{background:linear-gradient(165deg,rgba(255,255,255,.95),rgba(230,238,250,.9));border:1px solid rgba(30,60,110,.2);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,20,60,.2);color:#0a1a30}
#topLeft{position:absolute;top:10px;left:10px;padding:9px 16px}
#lvlName{font-size:10px;letter-spacing:2.5px;color:#3a6ea5;font-weight:800}
#locName{font-size:19px;font-weight:800;margin-top:2px;color:#0a1a30}
#topRight{position:absolute;top:10px;right:10px;padding:9px 16px;text-align:right;min-width:140px}
#spdVal{font-size:33px;font-weight:900;line-height:1;color:#0a1a30}
#spdUnit{font-size:10px;color:#3a6ea5;letter-spacing:3px;font-weight:700;margin-top:1px}
#compass{position:absolute;top:110px;left:10px;padding:8px 14px;text-align:center}
#compassN{font-size:11px;font-weight:900;color:#e11d48;letter-spacing:2px}
#compassArrow{font-size:24px;color:#0a1a30;margin-top:-4px;transition:transform .1s}

#pauseBtn{position:absolute;top:10px;left:50%;transform:translateX(-50%);pointer-events:auto;padding:7px 18px;border-radius:12px;font-size:11px;letter-spacing:2px;font-weight:800;color:#0a1a30;cursor:pointer;background:rgba(255,255,255,.9);border:1px solid rgba(30,60,110,.25);z-index:25}

#controls{position:absolute;inset:0;z-index:20;pointer-events:none}
.btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(210,225,245,.92));border:2.5px solid rgba(50,90,150,.45);box-shadow:0 8px 22px rgba(0,20,60,.3),inset 0 2px 0 rgba(255,255,255,.8);color:#1a3050;font-weight:900;transition:transform .08s,background .12s;touch-action:none}
.btn:active,.btn.on{transform:scale(.94);background:linear-gradient(160deg,rgba(120,180,255,.96),rgba(70,130,220,.96));border-color:rgba(30,80,160,.9);color:#fff}
#btnL{left:22px;bottom:24px;width:114px;height:114px;font-size:46px}
#btnR{left:152px;bottom:24px;width:114px;height:114px;font-size:46px}
#btnBrake{right:160px;bottom:28px;width:98px;height:98px;font-size:14px;letter-spacing:1.5px;border-color:rgba(200,60,60,.5);color:#a02020}
#btnBrake:active,#btnBrake.on{background:linear-gradient(160deg,rgba(255,80,80,.96),rgba(180,30,30,.96));color:#fff}
#btnGas{right:26px;bottom:20px;width:126px;height:126px;font-size:16px;letter-spacing:2px;border-color:rgba(40,160,80,.5);color:#0a6030}
#btnGas:active,#btnGas.on{background:linear-gradient(160deg,rgba(70,220,120,.96),rgba(30,150,70,.96));color:#fff}
#wheelBox{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:112px;height:112px;pointer-events:none;z-index:19;filter:drop-shadow(0 4px 12px rgba(0,20,60,.35))}
#wheelIn{width:100%;height:100%;position:relative;transition:transform .05s linear}
.wRim{position:absolute;inset:0;border-radius:50%;border:10px solid transparent;background:linear-gradient(#f0f4fa,#d0daea) padding-box,conic-gradient(from 200deg,#3a4a68,#6a7a98,#a8b8d8,#6a7a98,#3a4a68,#2a3a58,#6a7a98,#a8b8d8,#6a7a98,#3a4a68) border-box;box-shadow:inset 0 0 12px rgba(0,20,60,.4)}
.wSpk{position:absolute;left:50%;top:50%;width:12px;height:48px;margin-left:-6px;border-radius:4px;background:linear-gradient(180deg,#8a9ab8,#4a5a78);transform-origin:50% 0}
.w1{transform:rotate(180deg)}.w2{transform:rotate(60deg)}.w3{transform:rotate(-60deg)}
.wHub{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c0d0e8,#4a5a78 70%);box-shadow:0 0 0 3px #2a3a58}
.wMark{position:absolute;left:50%;top:4px;width:5px;height:15px;margin-left:-2.5px;border-radius:3px;background:linear-gradient(180deg,#e04040,#801010)}

#camZone{position:absolute;top:0;right:0;width:82px;height:100%;pointer-events:auto;z-index:21;touch-action:none}

#msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:66px;font-weight:900;letter-spacing:6px;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.6);pointer-events:none;opacity:0;z-index:30;white-space:nowrap;color:#fff;padding:0 20px}
#msg.show{animation:popMsg 2.4s ease-out}
@keyframes popMsg{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}

.screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 0%,rgba(120,180,255,.35),transparent 65%),linear-gradient(170deg,#1a2a48,#0d1a30 45%,#0a1428);transition:opacity .35s}
.screen.hide{opacity:0;pointer-events:none}
#title{font-size:clamp(34px,6.8vw,62px);font-weight:900;letter-spacing:10px;background:linear-gradient(90deg,#7dd3fc,#fbbf24,#f472b6,#7dd3fc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
#sub{font-size:11px;letter-spacing:7px;color:#8ea8c8;margin-top:-6px;font-weight:700}
#startBtn{margin-top:20px;padding:15px 60px;border-radius:50px;cursor:pointer;font-size:19px;font-weight:900;letter-spacing:5px;color:#04121e;background:linear-gradient(90deg,#7dd3fc,#fbbf24);background-size:220% 100%;border:none;box-shadow:0 10px 30px rgba(80,180,255,.5);animation:shine 3.8s linear infinite}
#hint{font-size:11px;color:#8ea8c8;letter-spacing:2px;text-align:center;line-height:1.9;margin-top:6px;max-width:88vw}
.k{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(120,180,255,.16);border:1px solid rgba(150,190,255,.35);color:#b8d4ff;font-weight:700;margin:0 2px}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="vig"></div>

  <div id="hud">
    <div class="panel" id="topLeft">
      <div id="lvlName">ԵՐԵՎԱՆ · 3D</div>
      <div id="locName">Երևան</div>
    </div>
    <div class="panel" id="topRight">
      <div id="spdVal">0</div>
      <div id="spdUnit">ԿՄ/Ժ</div>
    </div>
    <div class="panel" id="compass">
      <div id="compassN">N</div>
      <div id="compassArrow">↑</div>
    </div>
    <div id="pauseBtn">⏸</div>
    <div id="wheelBox">
      <div id="wheelIn">
        <div class="wRim"></div><div class="wSpk w1"></div><div class="wSpk w2"></div><div class="wSpk w3"></div>
        <div class="wHub"></div><div class="wMark"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="btn" id="btnL">◀</div>
    <div class="btn" id="btnR">▶</div>
    <div class="btn" id="btnBrake">ՀԵՏ</div>
    <div class="btn" id="btnGas">ԳԱԶ</div>
  </div>
  <div id="camZone"></div>

  <div id="msg"></div>

  <div class="screen" id="menu">
    <div id="title">ԵՐԵՎԱՆ</div>
    <div id="sub">3D · ՌԵԼԻԵՖ · ՔԱՂԱՔ</div>
    <button id="startBtn">ՍԿՍԵԼ</button>
    <div id="hint">
      <span class="k">◀ ▶</span> ղեկ · <span class="k">ԳԱԶ</span> · <span class="k">ՀԵՏ</span> · Աջ եզրից ↕ կամերա<br>
      Շրջի՛ր քաղաքում՝ <b>Կասկադ, Օպերա, Հրապարակ, Մատենադարան, Պատկերասրահ</b>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ═══════════════════════════════════════════
   ԿԱՅՈՒՆՆԵՐ
═══════════════════════════════════════════ */
const ROAD_W = 9;
const SIDEWALK_W = 3.5;
const SPACING = 60;
const GRID_N = 11;
const MAX_KMH = 90;
const MAX_REVERSE_KMH = 25;
const CITY_SIZE = (GRID_N - 1) * SPACING;
const HALF_CITY = CITY_SIZE / 2;

const LANDMARKS = {
  cascade:      { i:1, j:5, name:'ԿԱՍԿԱԴ' },
  opera:        { i:4, j:6, name:'ՕՊԵՐԱ' },
  square:       { i:5, j:4, name:'ՀՐԱՊԱՐԱԿ' },
  gallery:      { i:5, j:5, name:'ՊԱՏԿԵՐԱՍՐԱՀ' },
  matenadaran:  { i:8, j:8, name:'ՄԱՏԵՆԱԴԱՐԱՆ' },
  northAve:     { i:5, j:3, name:'ՀՅՈՒՍ. ՊՈՂՈՏԱ' }
};

const S = {
  phase:'menu',
  x:0, z:0, heading:0,
  speed:0, steer:0,
  camX:0, camY:0, camZ:0, camLX:0, camLY:0, camLZ:0,
  camPitch:0.35,
  countdown:0, _lc:undefined,
  currentLoc:'Երևան'
};
const IN = { gas:false, brake:false, left:false, right:false };

/* ═══════════════════════════════════════════
   ՌԵԼԻԵՖ
═══════════════════════════════════════════ */
function terrainHeight(x, z) {
  let y = 0;
  const dc = Math.hypot(x + 90, z - 20);
  y += 24 * Math.exp(-dc*dc / 22000);
  const dm = Math.hypot(x - 130, z - 130);
  y += 18 * Math.exp(-dm*dm / 16000);
  const doo = Math.hypot(x + 10, z - 60);
  y += 4 * Math.exp(-doo*doo / 5000);
  y += 1.5 * Math.sin(x * 0.015) * Math.cos(z * 0.013);
  return y;
}

function nodeX(i){ return -HALF_CITY + i * SPACING; }
function nodeZ(j){ return -HALF_CITY + j * SPACING; }

/* ═══════════════════════════════════════════
   THREE
═══════════════════════════════════════════ */
const app = document.getElementById('app');
const cvs = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas:cvs, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ec5e8);
scene.fog = new THREE.Fog(0xb8d0e8, 180, 550);

const camera = new THREE.PerspectiveCamera(62, 16/9, 0.3, 900);

(function(){
  const geo = new THREE.SphereGeometry(600, 24, 14);
  const mat = new THREE.ShaderMaterial({
    uniforms:{ cT:{value:new THREE.Color(0x3a7fd0)}, cM:{value:new THREE.Color(0xa8cae8)}, cH:{value:new THREE.Color(0xf0e0b8)} },
    vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform vec3 cT,cM,cH;varying vec3 vP;void main(){float h = normalize(vP).y;vec3 col = h > 0.0 ? mix(cM, cT, pow(h, 0.6)) : cM;float horizon = exp(-abs(h)*6.0);col = mix(col, cH, horizon*0.6);gl_FragColor = vec4(col, 1.0);}',
    side:THREE.BackSide, depthWrite:false, fog:false
  });
  scene.add(new THREE.Mesh(geo, mat));
})();

scene.add(new THREE.HemisphereLight(0xc8e0f8, 0x907a5a, 0.85));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
sun.position.set(-150, 250, 120);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc8d8ff, 0.3);
fill.position.set(100, 80, -100);
scene.add(fill);

/* ԳԵՏԻՆ */
const TERRAIN_SIZE = CITY_SIZE + 400;
const TERRAIN_RES = 128;
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_RES, TERRAIN_RES);
terrainGeo.rotateX(-Math.PI/2);
(function(){
  const pos = terrainGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, terrainHeight(x, z));
  }
  pos.needsUpdate = true;
  terrainGeo.computeVertexNormals();
})();
const terrainMat = new THREE.MeshStandardMaterial({ color:0x7a9a5a, roughness:1 });
const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrainMesh);

/* ═══════════════════════════════════════════
   ՃԱՆԱՊԱՐՀՆԵՐ ԵՎ ՄԱՅԹԵՐ
═══════════════════════════════════════════ */
function addStrip(pos, uv, idx, x1, z1, x2, z2, width, yOffset, uvScale) {
  const baseVert = pos.length / 3;
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  const N = Math.max(2, Math.ceil(len / 5));
  const px = -dz/len, pz = dx/len;
  for(let i=0;i<=N;i++){
    const t = i / N;
    const cx = x1 + dx * t;
    const cz = z1 + dz * t;
    const lx = cx + px * width/2;
    const lz = cz + pz * width/2;
    const rx = cx - px * width/2;
    const rz = cz - pz * width/2;
    pos.push(lx, terrainHeight(lx, lz) + yOffset, lz);
    pos.push(rx, terrainHeight(rx, rz) + yOffset, rz);
    const uvT = t * len * uvScale;
    uv.push(0, uvT);
    uv.push(1, uvT);
  }
  for(let i=0;i<N;i++){
    const a = baseVert + i*2;
    const b = baseVert + i*2 + 1;
    const c = baseVert + (i+1)*2;
    const d = baseVert + (i+1)*2 + 1;
    idx.push(a, c, b, b, c, d);
  }
}

function addQuad(pos, uv, idx, x1, z1, x2, z2, x3, z3, x4, z4, yOffset, uvScale) {
  const baseVert = pos.length / 3;
  const y1 = terrainHeight(x1, z1) + yOffset;
  const y2 = terrainHeight(x2, z2) + yOffset;
  const y3 = terrainHeight(x3, z3) + yOffset;
  const y4 = terrainHeight(x4, z4) + yOffset;
  pos.push(x1, y1, z1);
  pos.push(x2, y2, z2);
  pos.push(x3, y3, z3);
  pos.push(x4, y4, z4);
  const s = uvScale || 1;
  uv.push(0, 0, 1*s, 0, 1*s, 1*s, 0, 1*s);
  idx.push(baseVert, baseVert+1, baseVert+2, baseVert, baseVert+2, baseVert+3);
}

function makeAsphaltTex() {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 256;
  const x = cv.getContext('2d');
  x.fillStyle = '#3a3d42'; x.fillRect(0,0,256,256);
  for(let i=0;i<3000;i++){
    x.fillStyle = Math.random()>0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.07)';
    x.fillRect(Math.random()*256, Math.random()*256, 1.5, 1.5);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function makeWalkTex() {
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 128;
  const x = cv.getContext('2d');
  x.fillStyle = '#c8c0b0'; x.fillRect(0,0,128,128);
  x.strokeStyle = 'rgba(120,110,100,0.5)'; x.lineWidth = 1.5;
  for(let i=0;i<=4;i++){
    x.beginPath(); x.moveTo(i*32, 0); x.lineTo(i*32, 128); x.stroke();
    x.beginPath(); x.moveTo(0, i*32); x.lineTo(128, i*32); x.stroke();
  }
  for(let i=0;i<800;i++){
    x.fillStyle = Math.random()>0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)';
    x.fillRect(Math.random()*128, Math.random()*128, 2, 2);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function makeRoadWithLinesTex() {
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 256;
  const x = cv.getContext('2d');
  x.fillStyle = '#3a3d42'; x.fillRect(0,0,128,256);
  for(let i=0;i<2500;i++){
    x.fillStyle = Math.random()>0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.07)';
    x.fillRect(Math.random()*128, Math.random()*256, 1.5, 1.5);
  }
  x.fillStyle = '#e8b830';
  x.fillRect(60, 0, 4, 256);
  x.fillRect(66, 0, 4, 256);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

const asphaltTex = makeAsphaltTex();
const walkTex = makeWalkTex();
const roadTex = makeRoadWithLinesTex();

const roadPositions = [], roadUVs = [], roadIndices = [];
const walkPositions = [], walkUVs = [], walkIndices = [];
const interPositions = [], interUVs = [], interIndices = [];

function edgeExists(i, j, dir) {
  if (dir === 'h' && i === 0 && j >= 3 && j <= 7) return false;
  if (dir === 'v' && i >= 3 && i <= 5 && j === 5) return false;
  return true;
}

for(let j = 0; j < GRID_N; j++){
  for(let i = 0; i < GRID_N - 1; i++){
    if(!edgeExists(i, j, 'h')) continue;
    addStrip(roadPositions, roadUVs, roadIndices, nodeX(i), nodeZ(j), nodeX(i+1), nodeZ(j), ROAD_W, 0.06, 0.06);
  }
}
for(let i = 0; i < GRID_N; i++){
  for(let j = 0; j < GRID_N - 1; j++){
    if(!edgeExists(i, j, 'v')) continue;
    addStrip(roadPositions, roadUVs, roadIndices, nodeX(i), nodeZ(j), nodeX(i), nodeZ(j+1), ROAD_W, 0.061, 0.06);
  }
}

const SIDEWALK_INSET = ROAD_W/2 + SIDEWALK_W;

for(let j = 0; j < GRID_N; j++){
  for(let i = 0; i < GRID_N - 1; i++){
    if(!edgeExists(i, j, 'h')) continue;
    const x1 = nodeX(i) + SIDEWALK_INSET;
    const x2 = nodeX(i+1) - SIDEWALK_INSET;
    const z = nodeZ(j);
    if(x1 >= x2) continue;
    addStrip(walkPositions, walkUVs, walkIndices, x1, z + ROAD_W/2 + SIDEWALK_W/2, x2, z + ROAD_W/2 + SIDEWALK_W/2, SIDEWALK_W, 0.21, 0.3);
    addStrip(walkPositions, walkUVs, walkIndices, x1, z - ROAD_W/2 - SIDEWALK_W/2, x2, z - ROAD_W/2 - SIDEWALK_W/2, SIDEWALK_W, 0.21, 0.3);
  }
}
for(let i = 0; i < GRID_N; i++){
  for(let j = 0; j < GRID_N - 1; j++){
    if(!edgeExists(i, j, 'v')) continue;
    const z1 = nodeZ(j) + SIDEWALK_INSET;
    const z2 = nodeZ(j+1) - SIDEWALK_INSET;
    const x = nodeX(i);
    if(z1 >= z2) continue;
    addStrip(walkPositions, walkUVs, walkIndices, x + ROAD_W/2 + SIDEWALK_W/2, z1, x + ROAD_W/2 + SIDEWALK_W/2, z2, SIDEWALK_W, 0.22, 0.3);
    addStrip(walkPositions, walkUVs, walkIndices, x - ROAD_W/2 - SIDEWALK_W/2, z1, x - ROAD_W/2 - SIDEWALK_W/2, z2, SIDEWALK_W, 0.22, 0.3);
  }
}
for(let i = 0; i < GRID_N; i++){
  for(let j = 0; j < GRID_N; j++){
    const cx = nodeX(i), cz = nodeZ(j);
    const w2 = ROAD_W/2;
    const sw = SIDEWALK_W;
    const corners = [
      [cx + w2, cz + w2, cx + w2 + sw, cz + w2 + sw],
      [cx - w2 - sw, cz + w2, cx - w2, cz + w2 + sw],
      [cx + w2, cz - w2 - sw, cx + w2 + sw, cz - w2],
      [cx - w2 - sw, cz - w2 - sw, cx - w2, cz - w2]
    ];
    for(const c of corners){

}

function makeMesh(pos, uv, idx, material) {

  m.frustumCulled = false;
  return m;
}

function makeBuildingTex(hue) {
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 256;
  const x = cv.getContext('2d');
  const baseColors = ['#e0d0b8', '#d8c8a8', '#e8d8c8', '#d0c0a8', '#e8dcc8', '#d8ccc0'];
  x.fillStyle = baseColors[hue % baseColors.length];
  x.fillRect(0,0,128,256);
  for(let i=0;i<1200;i++){
    x.fillStyle = `rgba(120,100,80,${Math.random()*0.08})`;
    x.fillRect(Math.random()*128, Math.random()*256, 3, 2);
  }
  const cols = 4, rows = 10;
  const cw = 128/cols, ch = 256/rows;
  for(let r=1;r<rows-1;r++){
    for(let c=0;c<cols;c++){
      x.fillStyle = '#3a4a5a';
      x.fillRect(c*cw + 6, r*ch + 6, cw - 12, ch - 12);
      x.fillStyle = Math.random() > 0.5 ? '#6a8aa8' : '#4a6a88';
      x.fillRect(c*cw + 7, r*ch + 7, cw - 14, ch - 14);
      x.fillStyle = 'rgba(255,255,255,0.3)';
      x.fillRect(c*cw + 8, r*ch + 8, (cw-16)*0.4, (ch-16)*0.4);
    }
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

/* ═══════════════════════════════════════════
   ՖԻԶԻԿԱ
═══════════════════════════════════════════ */
function updatePhysics(dt) {
  // ՂԵԿ
  let target = 0;
  if(IN.left) target = -1;
  if(IN.right) target = 1;
  S.steer += (target - S.steer) * Math.min(1, 6 * dt);
  if(!IN.left && !IN.right) {
    S.steer += (0 - S.steer) * Math.min(1, 5 * dt);
    if(Math.abs(S.steer) < 0.003) S.steer = 0;
  }

  // ԳԱԶ
  if(IN.gas) {
    S.speed += (S.speed < 40 ? 32 : 18) * dt;
  }

  // ՀԵՏ / ԱՐԳԵԼԱԿ
  if(IN.brake) {
    if(S.speed > 0.5) {
      S.speed -= 55 * dt;
    } else {
      S.speed -= 25 * dt;
    }
  }

  // ԻՆԵՐՑԻԱ
  if(!IN.gas && !IN.brake) {
    if(S.speed > 0.05) S.speed -= 8 * dt;
    else if(S.speed < -0.05) S.speed += 8 * dt;
    else S.speed = 0;
  }

  // ԹԵՔՈՒԹՅՈՒՆ
  const fx = Math.sin(S.heading), fz = Math.cos(S.heading);
  const aheadH = terrainHeight(S.x + fx*6, S.z + fz*6);
  const behindH = terrainHeight(S.x - fx*6, S.z - fz*6);
  const slope = (aheadH - behindH) / 12;
  S.speed -= slope * 15 * dt;

  S.speed = Math.max(-MAX_REVERSE_KMH, Math.min(MAX_KMH, S.speed));

  // ՊՏՈՒՅՏ
  const v = S.speed / 3.6;
  const spdFac = Math.min(1, v / 10);
  const turnRate = 1.6 * spdFac;
  S.heading -= S.steer * turnRate * dt;

  // ԴԻՐՔ
  const nfx = Math.sin(S.heading), nfz = Math.cos(S.heading);
  S.x += nfx * v * dt;
  S.z += nfz * v * dt;

  const lim = HALF_CITY + 60;
  S.x = Math.max(-lim, Math.min(lim, S.x));
  S.z = Math.max(-lim, Math.min(lim, S.z));

  // ԲԱԽՈՒՄ ՇԵՆՔԵՐԻ ՀԵՏ
  for(const b of BLD_COLLISION) {
    const hw = b.w/2 + 1.2, hd = b.d/2 + 1.2;
    const dx = S.x - b.x, dz = S.z - b.z;
    if(Math.abs(dx) < hw && Math.abs(dz) < hd) {
      const overlapX = hw - Math.abs(dx);
      const overlapZ = hd - Math.abs(dz);
      if(overlapX < overlapZ) {
        S.x = b.x + Math.sign(dx) * hw;
      } else {
        S.z = b.z + Math.sign(dz) * hd;
      }
      S.speed *= 0.5;
    }
  }

  // ՄԵՔԵՆԱՅԻ ՏԵՍՔ
  const y = terrainHeight(S.x, S.z);
  player.group.position.set(S.x, y, S.z);
  player.group.rotation.y = S.heading;

  const hR = terrainHeight(S.x + 1, S.z);
  const hL = terrainHeight(S.x - 1, S.z);
  const roll = Math.atan2(hL - hR, 2) * 0.7;
  player.group.rotation.z = roll;

  // ԱՆԻՎՆԵՐ
  const spin = v * dt * 1.7;
  for(const w of player.wheels) {
    w.mesh.rotation.x -= spin;
    if(w.tag === 'fl' || w.tag === 'fr') {
      w.mesh.rotation.y = S.steer * 0.5;
    }
  }

  updateLocationName();
}

function updateLocationName() {
  let closest = 'Երևան';
  let minD = Infinity;
  for(const k in LANDMARKS) {
    const L = LANDMARKS[k];
    const lx = nodeX(L.i) + SPACING/2;
    const lz = nodeZ(L.j) + SPACING/2;
    const d = Math.hypot(S.x - lx, S.z - lz);
    if(d < minD) { minD = d; closest = L.name; }
  }
  S.currentLoc = minD < 90 ? closest : 'Երևան';
  document.getElementById('locName').textContent = S.currentLoc;
}

/* ═══════════════════════════════════════════
   ԿԱՄԵՐԱ
═══════════════════════════════════════════ */
function updateCamera(dt) {
  const h = S.heading;
  const fx = Math.sin(h), fz = Math.cos(h);
  const dist = 8.5 - S.camPitch * 2.5;
  const high = 3.2 + S.camPitch * 5;
  const tx = S.x - fx * dist;
  const tz = S.z - fz * dist;
  const ty = terrainHeight(tx, tz) + high;
  const k = 1 - Math.exp(-7 * dt);
  S.camX += (tx - S.camX) * k;
  S.camY += (ty - S.camY) * k;
  S.camZ += (tz - S.camZ) * k;
  const lx = S.x + fx * 12;
  const lz = S.z + fz * 12;
  const ly = terrainHeight(S.x, S.z) + 1.5;
  const lk = 1 - Math.exp(-9 * dt);
  S.camLX += (lx - S.camLX) * lk;
  S.camLY += (ly - S.camLY) * lk;
  S.camLZ += (lz - S.camLZ) * lk;
  camera.position.set(S.camX, S.camY, S.camZ);
  camera.lookAt(S.camLX, S.camLY, S.camLZ);
  const tFov = 62 + (Math.abs(S.speed) / MAX_KMH) * 10;
  camera.fov += (tFov - camera.fov) * Math.min(1, 3*dt);
  camera.updateProjectionMatrix();
  camera.rotation.z += S.steer * 0.02;
}

const Aud = {
  ctx:null, ready:false, _master:null,
  engGain:null, engFilt:null, o1:null, o2:null,
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this._master = this.ctx.createGain();
    this._master.gain.value = 0.6;
    this._master.connect(this.ctx.destination);
    this.engGain = this.ctx.createGain();
    this.engGain.gain.value = 0;
    this.engFilt = this.ctx.createBiquadFilter();
    this.engFilt.type = 'lowpass';
    this.engFilt.frequency.value = 400;
    this.engFilt.connect(this.engGain);
    this.engGain.connect(this._master);
    this.o1 = this.ctx.createOscillator();
    this.o1.type = 'sine'; this.o1.frequency.value = 45;
    const g1 = this.ctx.createGain(); g1.gain.value = 1;
    this.o1.connect(g1); g1.connect(this.engFilt); this.o1.start();
    this.o2 = this.ctx.createOscillator();
    this.o2.type = 'triangle'; this.o2.frequency.value = 68;
    const g2 = this.ctx.createGain(); g2.gain.value = 0.5;
    this.o2.connect(g2); g2.connect(this.engFilt); this.o2.start();
    this.ready = true;
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setEngine(kmh, gas, run){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const absK = Math.abs(kmh);
    const f = 40 + absK * 0.9;
    this.o1.frequency.setTargetAtTime(f, t, 0.14);
    this.o2.frequency.setTargetAtTime(f*1.5, t, 0.14);
    this.engFilt.frequency.setTargetAtTime(300 + absK*5 + (gas?200:0), t, 0.2);
    const vol = run ? (0.05 + (absK/MAX_KMH)*0.1) : 0;
    this.engGain.gain.setTargetAtTime(vol, t, 0.25);
  },
  beep(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = 660;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.15);
    o.connect(g); g.connect(this._master);
    o.start(t); o.stop(t+0.2);
  }
};

/* ═══════════════════════════════════════════
   INPUT
═══════════════════════════════════════════ */
function bindHold(el, key){
  const on = e => { e.preventDefault(); IN[key]=true; el.classList.add('on'); Aud.init(); Aud.resume(); };
  const off = e => { e.preventDefault(); IN[key]=false; el.classList.remove('on'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindHold(document.getElementById('btnGas'), 'gas');
bindHold(document.getElementById('btnBrake'), 'brake');
bindHold(document.getElementById('btnL'), 'left');
bindHold(document.getElementById('btnR'), 'right');

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(e.repeat) return;
  if(k==='arrowup'||k==='w') IN.gas = true;
  if(k==='arrowdown'||k==='s') IN.brake = true;
  if(k==='arrowleft'||k==='a') IN.left = true;
  if(k==='arrowright'||k==='d') IN.right = true;
});
addEventListener('keyup', e=>{
  const k = e.key.toLowerCase();
  if(k==='arrowup'||k==='w') IN.gas = false;
  if(k==='arrowdown'||k==='s') IN.brake = false;
  if(k==='arrowleft'||k==='a') IN.left = false;
  if(k==='arrowright'||k==='d') IN.right = false;
});

(function(){
  const z = document.getElementById('camZone');
  let drag = false, sy = 0, sp = 0;
  const dn = e => { e.preventDefault(); drag=true; const t=e.touches?e.touches[0]:e; sy=t.clientY; sp=S.camPitch; };
  const mv = e => {
    if(!drag) return;
    e.preventDefault();
    const t = e.touches?e.touches[0]:e;
    const dy = t.clientY - sy;
    S.camPitch = Math.max(0.1, Math.min(0.85, sp - dy/320));
  };
  const up = ()=> drag=false;
  z.addEventListener('touchstart', dn, {passive:false});
  z.addEventListener('touchmove', mv, {passive:false});
  z.addEventListener('touchend', up);
  z.addEventListener('mousedown', dn);
  addEventListener('mousemove', mv);
  addEventListener('mouseup', up);
})();

document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('gesturechange', e=>e.preventDefault());
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
document.addEventListener('selectstart', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});

/* ═══════════════════════════════════════════
   START
═══════════════════════════════════════════ */
function startGame(){
  // ՍԿԶԲՆԱԿԱՆ ՏԵՂ — ճանապարհի կենտրոն, ուղղված արևելք
  S.x = nodeX(3) + SPACING/2;
  S.z = nodeZ(3);
  S.heading = Math.PI/2;
  S.speed = 0;
  S.steer = 0;

  const dist = 7.5;
  const fx = Math.sin(S.heading), fz = Math.cos(S.heading);
  S.camX = S.x - fx * dist;
  S.camY = terrainHeight(S.camX, S.z - fz * dist) + 4.5;
  S.camZ = S.z - fz * dist;
  S.camLX = S.x + fx * 12;
  S.camLY = terrainHeight(S.x, S.z) + 1.5;
  S.camLZ = S.z + fz * 12;

  player.group.position.set(S.x, terrainHeight(S.x, S.z), S.z);
  player.group.rotation.y = S.heading;
  player.group.rotation.z = 0;

  S.countdown = 3.0;
  S._lc = undefined;
  S.phase = 'countdown';
  document.getElementById('menu').classList.add('hide');
  showMsg('3', 'gold'); Aud.beep();
  S._lc = 3;
  Aud.init(); Aud.resume();
  updateLocationName();
}

function showMsg(text, cls){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = cls || '';
  m.classList.remove('show');
  void m.offsetWidth;
  m.classList.add('show');
}

document.getElementById('startBtn').onclick = ()=>{
  const el = document.documentElement;
  try {
    if(el.requestFullscreen) el.requestFullscreen({navigationUI:'hide'});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch(e){}
  setTimeout(()=>{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }
  }, 200);
  startGame();
};

document.getElementById('pauseBtn').onclick = ()=>{
  S.phase = S.phase === 'play' ? 'paused' : (S.phase === 'paused' ? 'play' : S.phase);
  document.getElementById('pauseBtn').textContent = S.phase === 'paused' ? '▶' : '⏸';
};

/* ═══════════════════════════════════════════
   ՉԱՓԵՐ
═══════════════════════════════════════════ */
function resize(){
  const w = app.clientWidth || window.innerWidth;
  const h = app.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  cvs.style.width = '100%';
  cvs.style.height = '100%';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 150));

/* ═══════════════════════════════════════════
   ՑԻԿԼ
═══════════════════════════════════════════ */
let lastT = performance.now();

function loop(now){
  requestAnimationFrame(loop);
  const rawDt = Math.min(0.4, (now - lastT) / 1000);
  lastT = now;
  const dt = Math.min(0.028, rawDt);

  if(S.phase === 'countdown'){
    S.countdown -= rawDt;
    const c = Math.ceil(S.countdown);
    if(c !== S._lc){
      S._lc = c;
      if(c === 2){ showMsg('2','gold'); Aud.beep(); }
      else if(c === 1){ showMsg('1','gold'); Aud.beep(); }
      else if(c <= 0){ showMsg('ԳՆԱ՛','green'); Aud.beep(); }
    }
    if(S.countdown <= 0){
      S.phase = 'play';
      S._lc = undefined;
    }
  } else if(S.phase === 'play'){
    updatePhysics(dt);
  }

  updateCamera(dt);
  updateHUD();
  Aud.setEngine(S.speed, IN.gas, S.phase === 'play' || S.phase === 'countdown');
  renderer.render(scene, camera);
}

/* INIT */
resize();
S.x = nodeX(3) + SPACING/2;
S.z = nodeZ(3);
S.heading = Math.PI/2;
S.camX = S.x - Math.sin(S.heading) * 7.5;
S.camY = terrainHeight(S.x, S.z) + 4.5;
S.camZ = S.z - Math.cos(S.heading) * 7.5;
S.camLX = S.x + Math.sin(S.heading) * 12;
S.camLY = terrainHeight(S.x, S.z) + 1.5;
S.camLZ = S.z + Math.cos(S.heading) * 12;
player.group.position.set(S.x, terrainHeight(S.x, S.z), S.z);
player.group.rotation.y = S.heading;
updateLocationName();

requestAnimationFrame(loop);

['touchstart','mousedown','keydown'].forEach(ev => {
  window.addEventListener(ev, ()=>{ Aud.init(); Aud.resume(); }, {once:true});
});

})();
</script>
