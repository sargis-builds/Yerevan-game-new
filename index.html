<title>Երևան · 3D</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   GLOBAL RESET + FULLSCREEN FIX
   ═══════════════════════════════════════════════════════════════ */
*{
  margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif
}
html,body{
  width:100vw;height:100vh;height:100dvh;
  overflow:hidden;background:#0a1020;color:#fff;
  touch-action:none;overscroll-behavior:none;
  position:fixed;inset:0
}
#app{position:fixed;inset:0;overflow:hidden}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

/* ═══════════════════════════════════════════════════════════════
   HUD
   ═══════════════════════════════════════════════════════════════ */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.panel{
  background:linear-gradient(165deg,rgba(255,255,255,.94),rgba(230,238,250,.88));
  border:1px solid rgba(30,60,110,.2);
  border-radius:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,20,60,.2);
  color:#0a1a30
}

#topLeft{
  position:absolute;
  top:calc(12px + env(safe-area-inset-top));
  left:calc(12px + env(safe-area-inset-left));
  padding:9px 16px;z-index:12
}
#lvlName{font-size:10px;letter-spacing:2.5px;color:#3a6ea5;font-weight:800}
#locName{font-size:19px;font-weight:800;margin-top:2px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#topRight{
  position:absolute;
  top:calc(12px + env(safe-area-inset-top));
  right:calc(12px + env(safe-area-inset-right));
  padding:9px 16px;text-align:right;min-width:120px;z-index:12
}
#spdVal{font-size:32px;font-weight:900;line-height:1;color:#0a1a30}
#spdUnit{font-size:10px;color:#3a6ea5;letter-spacing:3px;font-weight:700;margin-top:1px}

#minimapWrap{
  position:absolute;
  top:calc(80px + env(safe-area-inset-top));
  left:calc(12px + env(safe-area-inset-left));
  width:132px;height:132px;
  border-radius:14px;overflow:hidden;
  border:2px solid rgba(255,255,255,.85);
  box-shadow:0 4px 16px rgba(0,20,60,.35);
  background:#1a2a3a;z-index:12
}
#minimap{width:100%;height:100%;display:block}

#compass{
  position:absolute;
  top:calc(226px + env(safe-area-inset-top));
  left:calc(12px + env(safe-area-inset-left));
  padding:6px 12px;text-align:center;z-index:12
}
#compassArrow{font-size:20px;color:#0a1a30;display:block;transition:transform .1s}
#compassN{font-size:9px;font-weight:900;color:#e11d48;letter-spacing:2px}

/* ═══════════════════════════════════════════════════════════════
   CONTROLS
   ═══════════════════════════════════════════════════════════════ */
#controls{position:absolute;inset:0;z-index:20;pointer-events:none}
.btn{
  position:absolute;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(210,225,245,.92));
  border:2.5px solid rgba(50,90,150,.45);
  box-shadow:0 8px 22px rgba(0,20,60,.3),inset 0 2px 0 rgba(255,255,255,.8);
  color:#1a3050;font-weight:900;
  transition:transform .08s,background .12s;
  touch-action:none;font-family:system-ui,sans-serif
}
.btn:active,.btn.on{
  transform:scale(.94);
  background:linear-gradient(160deg,rgba(120,180,255,.96),rgba(70,130,220,.96));
  border-color:rgba(30,80,160,.9);color:#fff
}
#btnL{
  left:calc(20px + env(safe-area-inset-left));
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:96px;height:96px;font-size:36px
}
#btnR{
  left:calc(128px + env(safe-area-inset-left));
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:96px;height:96px;font-size:36px
}
#btnGas{
  right:calc(20px + env(safe-area-inset-right));
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:112px;height:112px;font-size:15px;letter-spacing:2px;
  border-color:rgba(40,160,80,.55);color:#0a6030
}
#btnGas:active,#btnGas.on{background:linear-gradient(160deg,rgba(70,220,120,.96),rgba(30,150,70,.96));color:#fff}
#btnRev{
  right:calc(148px + env(safe-area-inset-right));
  bottom:calc(28px + env(safe-area-inset-bottom));
  width:88px;height:88px;font-size:13px;letter-spacing:1.5px;
  border-color:rgba(200,60,60,.55);color:#a02020
}
#btnRev:active,#btnRev.on{background:linear-gradient(160deg,rgba(255,80,80,.96),rgba(180,30,30,.96));color:#fff}

/* Camera drag zone — upper-right quadrant */
#camZone{
  position:absolute;top:0;right:0;
  width:62%;height:56%;
  z-index:11;pointer-events:auto;touch-action:none
}

/* ═══════════════════════════════════════════════════════════════
   LOADER
   ═══════════════════════════════════════════════════════════════ */
#loader{
  position:absolute;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;
  background:radial-gradient(ellipse at 50% 40%,#16264a,#040810 75%);
  transition:opacity .6s ease-out
}
#loader.done{opacity:0;pointer-events:none}
#loaderTitle{
  font-size:clamp(34px,7vw,58px);font-weight:900;letter-spacing:14px;
  background:linear-gradient(90deg,#7dd3fc,#fbbf24,#f472b6,#7dd3fc);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 3s linear infinite;
  text-shadow:0 0 60px rgba(120,180,255,.5)
}
@keyframes shine{to{background-position:300% 0}}
#loaderSub{font-size:11px;letter-spacing:7px;color:#8ea8c8;font-weight:700}
#barWrap{
  width:280px;height:6px;border-radius:3px;
  background:rgba(255,255,255,.13);overflow:hidden;
  box-shadow:0 0 24px rgba(120,180,255,.35);margin-top:8px
}
#barFill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#7dd3fc,#fbbf24,#f472b6);
  border-radius:3px;transition:width .15s linear;
  box-shadow:0 0 14px rgba(120,180,255,.9)
}
#barText{font-size:11px;letter-spacing:3px;color:#a8c0dc;font-weight:600;min-height:14px;margin-top:4px}

#playBtn{
  position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  padding:18px 54px;border-radius:60px;
  background:linear-gradient(160deg,#7dd3fc,#3b82f6);color:#fff;
  font-size:18px;font-weight:900;letter-spacing:6px;
  border:none;cursor:pointer;
  box-shadow:0 10px 40px rgba(59,130,246,.55),inset 0 2px 0 rgba(255,255,255,.3);
  display:none;font-family:system-ui,sans-serif;z-index:110;pointer-events:auto
}
#playBtn:active{transform:translateX(-50%) scale(.95)}
#playBtn.show{display:block;animation:pop .4s ease-out}
@keyframes pop{
  0%{opacity:0;transform:translateX(-50%) scale(.8)}
  100%{opacity:1;transform:translateX(-50%) scale(1)}
}
#playHint{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  color:#8ea8c8;font-size:11px;letter-spacing:4px;font-weight:700;
  display:none
}
#playHint.show{display:block}

#errorBox{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(200,30,30,.9);color:#fff;
  padding:10px 20px;border-radius:10px;
  font-size:12px;font-family:monospace;
  max-width:90vw;display:none;z-index:200;word-break:break-all
}

#rotatePrompt{
  position:absolute;inset:0;background:rgba(4,8,16,.95);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;
  z-index:500;text-align:center;padding:30px
}
#rotatePrompt.show{display:flex}
#rotatePrompt .rot{font-size:52px;animation:rotateAnim 2s ease-in-out infinite}
@keyframes rotateAnim{
  0%,100%{transform:rotate(0)}
  50%{transform:rotate(90deg)}
}

/* ═══════════════════════════════════════════════════════════════
   DEBUG / PERF OVERLAY
   ═══════════════════════════════════════════════════════════════ */
#perfInfo{
  position:absolute;
  top:calc(80px + env(safe-area-inset-top));
  right:calc(12px + env(safe-area-inset-right));
  padding:6px 10px;
  border-radius:8px;
  background:rgba(10,20,40,.7);
  color:#7dd3fc;
  font-size:9px;
  font-family:monospace;
  letter-spacing:1px;
  display:none;
  z-index:15;
  pointer-events:none
}
</style>

<!-- ═══════════════════════════════════════════════════════════════
     LOADER SCRIPT
     ═══════════════════════════════════════════════════════════════ -->
<script>
window.__gameStartFn = null;
window.__gameReady = false;

window.addEventListener('error', function(e){
  var eb = document.getElementById('errorBox');
  if(eb){
    eb.style.display = 'block';
    eb.textContent = 'ՍԽԱԼ՝ ' + (e.message || '') + ' @' + (e.lineno || '?');
  }
});

(function(){
  var fill = document.getElementById('barFill');
  var text = document.getElementById('barText');
  var loader = document.getElementById('loader');
  var playBtn = document.getElementById('playBtn');
  var playHint = document.getElementById('playHint');
  var p = 0;

  var iv = setInterval(function(){
    p += 8 + Math.random() * 8;
    if(p > 100) p = 100;
    if(fill) fill.style.width = p + '%';
    if(text){
      if(p < 35) text.textContent = 'ՄԻԱՑՈՒՄ...';
      else if(p < 70) text.textContent = 'ԿԱՌՈՒՑՈՒՄ...';
      else if(p < 100) text.textContent = 'ՊԱՏՐԱՍՏՎՈՒՄ...';
      else text.textContent = 'ՊԱՏՐԱՍՏ Է';
    }
    if(p >= 100){
      clearInterval(iv);
      if(window.__gameReady){
        playBtn.classList.add('show');
        playHint.classList.add('show');
      }
    }
  }, 40);

  setInterval(function(){
    if(window.__gameReady && p >= 100){
      playBtn.classList.add('show');
      playHint.classList.add('show');
    }
  }, 100);

  function enterFullscreenAndStart(){
    var el = document.documentElement;
    var req = el.requestFullscreen
      || el.webkitRequestFullscreen
      || el.mozRequestFullScreen
      || el.msRequestFullscreen;
    if(req){
      try {
        var res = req.call(el, { navigationUI: 'hide' });
        if(res && res.catch) res.catch(function(){});
      } catch(e){}
    }
    try {
      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock('landscape').catch(function(){});
      }
    } catch(e){}

    setTimeout(function(){ window.scrollTo(0, 1); }, 100);
    setTimeout(function(){ window.scrollTo(0, 1); }, 500);
    setTimeout(function(){ window.scrollTo(0, 1); }, 1500);

    setTimeout(function(){
      if(window.__gameStartFn){
        try { window.__gameStartFn(); }
        catch(err){ console.error(err); }
      }
      loader.classList.add('done');
    }, 250);
  }

  playBtn.addEventListener('click', enterFullscreenAndStart);
  playBtn.addEventListener('touchend', function(e){
    e.preventDefault();
    enterFullscreenAndStart();
  }, {passive: false});
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- ═══════════════════════════════════════════════════════════════
     MAIN GAME
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   SECTION 1 — CONSTANTS
   ═══════════════════════════════════════════════════════════════════ */
var MAX_KMH          = 110;   // Max forward speed
var MAX_REV_KMH      = 25;    // Max reverse speed
var HASH_SIZE        = 50;    // Spatial hash cell size (world units)
var TERRAIN_SIZE     = 1400;  // Full terrain plane size
var TERRAIN_RES      = 60;    // Grid subdivisions (lower = faster)
var WORLD_LIMIT      = 660;   // Car movement clamp
var CASCADE_Z        = 420;   // Cascade peak z-coordinate

/* ═══════════════════════════════════════════════════════════════════
   SECTION 2 — TERRAIN HEIGHT FUNCTION
   ───────────────────────────────────────────────────────────────
   The terrain is a mathematical function sampled at build time.
   Layout (looking from above, +z = north, +x = east):
     · City plain:    z ∈ [-460, 200]  →  mostly flat with gentle waves
     · Cascade slope: z ∈ [200, 420]   →  rises to +55 (peak)
     · Cascade back:  z > 420          →  gently descends (background)
     · Matenadaran knoll (NW): (−420, 260),  +24 height
     · Opera knoll (W): (−230, 80),  +8 height
   ═══════════════════════════════════════════════════════════════════ */
function terrainHeight(x, z){
  var y = 0;

  /* ── Base gentle wave pattern across the entire plain ── */
  y += 0.9 * Math.sin(x * 0.010) * Math.cos(z * 0.008);
  y += 0.5 * Math.sin(x * 0.021 + z * 0.014);

  /* ── Cascade hill — peaks exactly at z = CASCADE_Z ──
     t = 0 at z=200 (base), 1 at z=420 (peak)
     pow(t, 1.8) gives a smooth curve that accelerates upward. */
  var t = (z - 200) / 220;
  if(t > 0){
    if(t > 1) t = 1;
    y += Math.pow(t, 1.8) * 55;
  }

  /* ── Beyond Cascade: gently descend ──
     This ensures the Cascade peak is the HIGHEST point in the map. */
  if(z > CASCADE_Z){
    var pz = z - CASCADE_Z;
    y -= Math.min(pz * 0.02, 15);
  }

  /* ── Matenadaran knoll (northwest) ── */
  var dmx = x + 420, dmz = z - 260;
  y += 24 * Math.exp(-(dmx*dmx + dmz*dmz) / 20000);

  /* ── Opera gentle knoll ── */
  var dox = x + 230, doz = z - 80;
  y += 8 * Math.exp(-(dox*dox + doz*doz) / 16000);

  return y;
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 3 — RENDERER  (heavy perf tuning for mobile)
   ═══════════════════════════════════════════════════════════════════ */
var app = document.getElementById('app');
var cvs = document.getElementById('c');

var renderer = new THREE.WebGLRenderer({
  canvas:           cvs,
  antialias:        false,               // ⚡ OFF — MSAA is a killer
  powerPreference:  'high-performance',
  stencil:          false,
  depth:            true,
  alpha:            false
});
renderer.setPixelRatio(1);               // ⚡ always 1, never devicePixelRatio
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;       // ⚡ NO shadows — biggest win
renderer.setClearColor(0xa8c8e8, 1);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8c8e8);
scene.fog = new THREE.Fog(0xc0d8e8, 260, 720);

var camera = new THREE.PerspectiveCamera(60, 16 / 9, 0.5, 2000);

/* ═══════════════════════════════════════════════════════════════════
   SECTION 4 — SKY + ARARAT
   ───────────────────────────────────────────────────────────────
   Ararat is placed NORTH (behind Cascade) so it appears in the
   background from the city. Cone silhouette, no fog applied.
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  /* ── Sky dome with 3-stop gradient shader ── */
  var skyGeo = new THREE.SphereGeometry(1500, 32, 16);
  var skyMat = new THREE.ShaderMaterial({
    uniforms: {
      cTop: { value: new THREE.Color(0x2a72c8) },
      cMid: { value: new THREE.Color(0x9cc0e0) },
      cHor: { value: new THREE.Color(0xf4dcb0) }
    },
    vertexShader: [
      'varying vec3 vP;',
      'void main(){',
      '  vP = position;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 cTop; uniform vec3 cMid; uniform vec3 cHor;',
      'varying vec3 vP;',
      'void main(){',
      '  float h = normalize(vP).y;',
      '  vec3 col = h > 0.0 ? mix(cMid, cTop, pow(h, 0.65)) : cMid;',
      '  float hor = exp(-abs(h) * 5.5);',
      '  col = mix(col, cHor, hor * 0.7);',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n'),
    side: THREE.BackSide,
    depthWrite: false,
    fog: false
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  /* ── Ararat — main peak (north, behind Cascade) ── */
  var mtnMat = new THREE.MeshBasicMaterial({ color: 0xc8d0e0, fog: false });
  var mtnMatDark = new THREE.MeshBasicMaterial({ color: 0xa8b4c8, fog: false });

  var ararat1 = new THREE.Mesh(new THREE.ConeGeometry(220, 180, 6), mtnMat);
  ararat1.position.set(320, 20, 950);
  ararat1.rotation.y = 0.3;
  scene.add(ararat1);

  /* ── Ararat — smaller sister peak (a bit west) ── */
  var ararat2 = new THREE.Mesh(new THREE.ConeGeometry(140, 120, 6), mtnMat);
  ararat2.position.set(180, 15, 920);
  ararat2.rotation.y = -0.2;
  scene.add(ararat2);

  /* ── Snow caps on both peaks (small cones in white) ── */
  var snowMat = new THREE.MeshBasicMaterial({ color: 0xf0f4f8, fog: false });
  var cap1 = new THREE.Mesh(new THREE.ConeGeometry(75, 60, 6), snowMat);
  cap1.position.set(320, 100, 950);
  cap1.rotation.y = 0.3;
  scene.add(cap1);

  var cap2 = new THREE.Mesh(new THREE.ConeGeometry(48, 40, 6), snowMat);
  cap2.position.set(180, 80, 920);
  cap2.rotation.y = -0.2;
  scene.add(cap2);
})();

/* ═══════════════════════════════════════════════════════════════════
   SECTION 5 — LIGHTS  (no shadow maps)
   ═══════════════════════════════════════════════════════════════════ */
scene.add(new THREE.HemisphereLight(0xd0e4f8, 0x8a7a5a, 0.95));

var sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
sun.position.set(-100, 200, 120);
scene.add(sun);

var fillLight = new THREE.DirectionalLight(0xc8d8ff, 0.25);
fillLight.position.set(150, 60, -120);
scene.add(fillLight);

/* ═══════════════════════════════════════════════════════════════════
   SECTION 6 — TERRAIN MESH
   ═══════════════════════════════════════════════════════════════════ */
function makeGrassTexture(){
  var cv = document.createElement('canvas');
  cv.width = 128; cv.height = 128;
  var x = cv.getContext('2d');
  x.fillStyle = '#7a9a55';
  x.fillRect(0, 0, 128, 128);
  for(var i = 0; i < 2400; i++){
    var r = Math.random();
    x.fillStyle = r > 0.66 ? '#8aaa60' : (r > 0.33 ? '#6a8a48' : '#5a7a3a');
    x.fillRect(Math.random() * 128, Math.random() * 128, 1.5, 2);
  }
  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(60, 60);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 1;
  return t;
}

/* ── Road ribbon geometry accumulator ── */
var ROAD_VERTS = [], ROAD_UVS = [], ROAD_IDX = [];

function addRoadRibbon(ax, az, bx, bz, width, bend){
  var dx = bx - ax, dz = bz - az;
  var len = Math.sqrt(dx * dx + dz * dz);
  if(len < 0.5) return;

  var nx = -dz / len, nz = dx / len;
  var b = bend || 0;
  var mx = (ax + bx) * 0.5 + nx * b;
  var mz = (az + bz) * 0.5 + nz * b;

  var curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(ax, 0, az),
    new THREE.Vector3(mx, 0, mz),
    new THREE.Vector3(bx, 0, bz)
  ], false, 'catmullrom', 0.5);

  var N = Math.max(6, Math.ceil(len / 8));
  var pts = curve.getSpacedPoints(N);
  var startIdx = ROAD_VERTS.length / 3;

  for(var i = 0; i <= N; i++){
    var p = pts[i];
    var iPrev = Math.max(0, i - 1);
    var iNext = Math.min(N, i + 1);
    var pPrev = pts[iPrev], pNext = pts[iNext];
    var tdx = pNext.x - pPrev.x, tdz = pNext.z - pPrev.z;
    var tl = Math.sqrt(tdx * tdx + tdz * tdz) || 1;
    var px = -tdz / tl, pz = tdx / tl;

    var lx = p.x + px * width / 2, lz = p.z + pz * width / 2;
    var rx = p.x - px * width / 2, rz = p.z - pz * width / 2;
    var ly = terrainHeight(lx, lz) + 0.25;
    var ry = terrainHeight(rx, rz) + 0.25;

    ROAD_VERTS.push(lx, ly, lz, rx, ry, rz);
    var v = i * (len / N) * 0.08;
    ROAD_UVS.push(0, v, 1, v);
  }
  for(var j = 0; j < N; j++){
    var a = startIdx + j * 2;
    ROAD_IDX.push(a, a+1, a+2, a+1, a+3, a+2);
  }
}

  var bend = (Math.random() - 0.5) * Math.min(20, e[2] * 1.2);

var WALK_VERTS = [], WALK_UVS = [], WALK_IDX = [];

function addSidewalks(ax, az, bx, bz, roadWidth, bend){
  var dx = bx - ax, dz = bz - az;
  var len = Math.sqrt(dx * dx + dz * dz);
  if(len < 2) return;

  var nx = -dz / len, nz = dx / len;
  var b = bend || 0;
  var mx = (ax + bx) * 0.5 + nx * b;
  var mz = (az + bz) * 0.5 + nz * b;

  var curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(ax, 0, az),
    new THREE.Vector3(mx, 0, mz),
    new THREE.Vector3(bx, 0, bz)
  ], false, 'catmullrom', 0.5);
  var N = Math.max(6, Math.ceil(len / 8));
  var pts = curve.getSpacedPoints(N);
  var sw = 2.6;
  var startIdx = WALK_VERTS.length / 3;

  for(var side = -1; side <= 1; side += 2){
    for(var i = 0; i <= N; i++){
      var p = pts[i];
      var iPrev = Math.max(0, i - 1), iNext = Math.min(N, i + 1);
      var pPrev = pts[iPrev], pNext = pts[iNext];
      var tdx = pNext.x - pPrev.x, tdz = pNext.z - pPrev.z;
      var tl = Math.sqrt(tdx * tdx + tdz * tdz) || 1;
      var px = -tdz / tl, pz = tdx / tl;

      var edge = roadWidth / 2;
      var innerX = p.x + px * side * edge;
      var innerZ = p.z + pz * side * edge;
      var outerX = p.x + px * side * (edge + sw);
      var outerZ = p.z + pz * side * (edge + sw);

      WALK_VERTS.push(innerX, terrainHeight(innerX, innerZ) + 0.32, innerZ);
      WALK_VERTS.push(outerX, terrainHeight(outerX, outerZ) + 0.32, outerZ);
      var v = i * (len / N) * 0.1;
      WALK_UVS.push(0, v, 1, v);
    }
    for(var j = 0; j < N; j++){
      var a = startIdx + j * 2;
      WALK_IDX.push(a, a+1, a+2, a+1, a+3, a+2);
    }
    startIdx = WALK_VERTS.length / 3;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 8 — COLLISION SYSTEM  (ROTATION-AWARE + SPATIAL HASH)
   ───────────────────────────────────────────────────────────────
   Fix #5: When a building is rotated 90°/270°, its footprint in
   world-space is (d, w) not (w, d).  We compute an axis-aligned
   bounding box that FULLY contains the rotated rectangle using:
       effW = |cos(r)|·w + |sin(r)|·d
       effD = |sin(r)|·w + |cos(r)|·d
   This slightly over-estimates for diagonal rotations (45°) but is
   always conservative — no tunneling, no phantom collisions.
   ═══════════════════════════════════════════════════════════════════ */
var COL_HASH = {};

function addCollision(x, z, w, d, h, rot){
  rot = rot || 0;
  var c = Math.abs(Math.cos(rot));
  var s = Math.abs(Math.sin(rot));
  var effW = c * w + s * d;
  var effD = s * w + c * d;

  var b = { x: x, z: z, w: effW, d: effD, h: h };
  var x1 = Math.floor((x - effW / 2) / HASH_SIZE);
  var x2 = Math.floor((x + effW / 2) / HASH_SIZE);
  var z1 = Math.floor((z - effD / 2) / HASH_SIZE);
  var z2 = Math.floor((z + effD / 2) / HASH_SIZE);

  for(var i = x1; i <= x2; i++){
    for(var j = z1; j <= z2; j++){
      var k = i + ',' + j;
      if(!COL_HASH[k]) COL_HASH[k] = [];
      COL_HASH[k].push(b);
    }
  }
}

function isNearLandmark(x, z, extra){
  for(var k in LM){
    var L = LM[k];
    var r = (L.r || 50) + (extra || 0);
    var dx = x - L.x, dz = z - L.z;
    if(dx * dx + dz * dz < r * r) return true;
  }
  return false;
}

function isNearRoad(x, z, margin){
  for(var i = 0; i < ROAD_EDGES.length; i++){
    var e = ROAD_EDGES[i];
    var A = ROAD_NODES[e[0]], B = ROAD_NODES[e[1]];
    var W = e[2];
    var dx = B.x - A.x, dz = B.z - A.z;
    var l2 = dx * dx + dz * dz;
    var t = ((x - A.x) * dx + (z - A.z) * dz) / l2;
    t = Math.max(0, Math.min(1, t));
    var cx = A.x + dx * t, cz = A.z + dz * t;
    var d = Math.sqrt((x - cx) * (x - cx) + (z - cz) * (z - cz));
    if(d < W / 2 + (margin || 6)) return true;
  }
  for(var i = 0; i < WINDING_PATH.length - 1; i++){
    var A2 = WINDING_PATH[i], B2 = WINDING_PATH[i + 1];
    var dx2 = B2.x - A2.x, dz2 = B2.z - A2.z;
    var l22 = dx2 * dx2 + dz2 * dz2;
    var t2 = ((x - A2.x) * dx2 + (z - A2.z) * dz2) / l22;
    t2 = Math.max(0, Math.min(1, t2));
    var cx2 = A2.x + dx2 * t2, cz2 = A2.z + dz2 * t2;
    var d2 = Math.sqrt((x - cx2) * (x - cx2) + (z - cz2) * (z - cz2));
    if(d2 < 7 + (margin || 6)) return true;
  }
  return false;
}

function makeTuffTexture(baseHex, windowStyle){
  var cv = document.createElement('canvas');
  cv.width = 128; cv.height = 256;
  var x = cv.getContext('2d');
  x.fillStyle = baseHex;
  x.fillRect(0, 0, 128, 256);
  for(var i = 0; i < 800; i++){
    x.fillStyle = 'rgba(120,100,80,' + (Math.random() * 0.09) + ')';
    x.fillRect(Math.random() * 128, Math.random() * 256, 3, 2);
  }
  var cols, rows;
  if(windowStyle === 'modern'){ cols = 5; rows = 12; }
  else if(windowStyle === 'dense'){ cols = 4; rows = 14; }
  else { cols = 3; rows = 8; }
  var cw = 128 / cols, ch = 256 / rows;
  for(var r = 1; r < rows - 0.5; r++){
    for(var c = 0; c < cols; c++){
      var wx = c * cw + cw * 0.15;
      var wy = r * ch + ch * 0.12;
      var ww = cw * 0.7;
      var wh = ch * 0.66;
      x.fillStyle = '#2a3a4a';
      x.fillRect(wx, wy, ww, wh);
      var hue = Math.random();
      var wc = hue > 0.7 ? '#8ac8e8' : (hue > 0.4 ? '#6a8aa8' : '#4a6a88');
      x.fillStyle = wc;
      x.fillRect(wx + 1, wy + 1, ww - 2, wh - 2);
      x.fillStyle = 'rgba(255,255,255,0.35)';
      x.fillRect(wx + 2, wy + 2, ww * 0.35, wh * 0.4);
    }
  }
  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 11 — INSTANCED BUILDING SYSTEM
   ───────────────────────────────────────────────────────────────
   Instead of creating a Mesh per building (250+ draw calls), we:
     1. Collect every building's (x,y,z,w,h,d,rot,matIdx) into arrays.
     2. Group by material index.
     3. Create ONE InstancedMesh per material.
     4. Upload all transformation matrices at once.
   Result: ~8 draw calls instead of ~250.  30× faster.

   Same approach for rooftop props (roofs, chimneys, AC units).
   ═══════════════════════════════════════════════════════════════════ */

/* ── Shared geometry: unit cube, unit cone ── */
var BOX_GEO = new THREE.BoxGeometry(1, 1, 1);
var CONE_GEO = new THREE.ConeGeometry(0.5, 1, 4);   // 4-sided pyramid
var CYL_GEO = new THREE.CylinderGeometry(0.5, 0.5, 1, 8);

/* ── Data accumulators (populated during build phase) ── */
var BUILDING_DATA = {
  boxes: {},       // matIdx -> [{x,y,z,w,h,d,rot}]
  roofs: {},       // matIdx -> [{x,y,z,w,h,d,rot}]
  cones: [],       // [{x,y,z,r,h,rotY}]     — pitched roofs
  chimneys: [],    // [{x,y,z,r,h}]          — cylinder pipes
  acUnits: [],     // [{x,y,z,w,h,d,rot}]    — AC boxes on flat roofs
  waterTanks: [],  // [{x,y,z,r,h}]          — rooftop water tanks
  antennas: []     // [{x,y,z,r,h}]          — rooftop antennas
};

/* ── Helper: ensure array exists for a given material key ── */
function ensureArray(map, key){
  if(!map[key]) map[key] = [];
  return map[key];
}

/* ── Collect a single rectangular building block ── */
function collectBox(x, z, w, h, d, rot, matIdx){
  var y = terrainHeight(x, z);
  var arr = ensureArray(BUILDING_DATA.boxes, matIdx);
  arr.push({ x: x, y: y, z: z, w: w, h: h, d: d, rot: rot });
  /* Rotation-aware collision (Fix #5) */
  addCollision(x, z, w, d, h, rot);
  return y;
}

/* ── Collect a rooftop element (same geometry as box) ── */
function collectRoofBox(x, y, z, w, h, d, rot, matIdx){
  var arr = ensureArray(BUILDING_DATA.roofs, matIdx);
  arr.push({ x: x, y: y, z: z, w: w, h: h, d: d, rot: rot });
}

/* ── Collect a pyramidal pitched roof ── */
function collectConeRoof(x, y, z, r, h, rotY){
  BUILDING_DATA.cones.push({ x: x, y: y, z: z, r: r, h: h, rotY: rotY || 0 });
}

/* ── Collect a rooftop chimney (cylinder) ── */
function collectChimney(x, y, z, r, h){
  BUILDING_DATA.chimneys.push({ x: x, y: y, z: z, r: r, h: h });
}

/* ── Collect an AC unit (small box) ── */
function collectAC(x, y, z, w, h, d, rot){
  BUILDING_DATA.acUnits.push({ x: x, y: y, z: z, w: w, h: h, d: d, rot: rot });
}

/* ── Collect a water tank (cylinder) ── */
function collectWaterTank(x, y, z, r, h){
  BUILDING_DATA.waterTanks.push({ x: x, y: y, z: z, r: r, h: h });
}

/* ── Collect an antenna (thin cylinder) ── */
function collectAntenna(x, y, z, r, h){
  BUILDING_DATA.antennas.push({ x: x, y: y, z: z, r: r, h: h });
}

/* ── Local-to-world offset rotation (matches three.js Y-axis rotation) ──
   In three.js, matrix4.makeRotationY(θ) transforms (x, z) as:
       x' = cos(θ)·x + sin(θ)·z
       z' = -sin(θ)·x + cos(θ)·z
   We use this for placing child boxes (L-shapes, T-shapes). */
function rotateOffset(lx, lz, rot){
  var c = Math.cos(rot), s = Math.sin(rot);
  return {
    x: c * lx + s * lz,
    z: -s * lx + c * lz
  };
}

/* ───────────────────────────────────────────────────────────────
   BUILDING SHAPES
   ─────────────────────────────────────────────────────────────── */

/* ── Simple box, optionally with rooftop detail ── */
function addBuildingBox(cx, cz, w, h, d, rot, matIdx, detail){
  var y = collectBox(cx, cz, w, h, d, rot, matIdx);
  var topY = y + h;

  /* ── Rooftop detail (optional) ── */
  if(detail !== false && h > 8){
    /* Small flat parapet cap */
    if(Math.random() < 0.6){
      var capMat = Math.random() < 0.5 ? MAT_ROOF_TOP : MAT_ROOF_FLAT;
      var capIdx = (capMat === MAT_ROOF_TOP) ? 100 : 101;
      collectRoofBox(cx, topY + 0.4, cz, w * 0.96, 0.8, d * 0.96, rot, capIdx);
    }

    /* Pitched pyramid roof (only for low buildings) */
    if(h < 18 && Math.random() < 0.30){
      var cr = Math.max(w, d) * 0.72;
      var ch = 3 + Math.random() * 4;
      collectConeRoof(cx, topY + ch / 2, cz, cr, ch, rot + Math.PI / 4);
    }

    /* Chimney (tall brick building) */
    if(h > 20 && Math.random() < 0.45){
      var off = rotateOffset(w * 0.3, d * 0.3, rot);
      collectChimney(
        cx + off.x, topY + 1.5, cz + off.z,
        0.4 + Math.random() * 0.2, 3 + Math.random() * 2
      );
    }

    /* AC unit on flat roof */
    if(h > 22 && Math.random() < 0.5){
      var acOff = rotateOffset(
        (Math.random() - 0.5) * w * 0.5,
        (Math.random() - 0.5) * d * 0.5,
        rot
      );
      collectAC(
        cx + acOff.x, topY + 0.6, cz + acOff.z,
        1.5 + Math.random(), 1.2, 1.5 + Math.random(), rot
      );
    }

    /* Water tank */
    if(h > 25 && Math.random() < 0.25){
      var wtOff = rotateOffset(
        (Math.random() - 0.5) * w * 0.4,
        (Math.random() - 0.5) * d * 0.4,
        rot
      );
      collectWaterTank(
        cx + wtOff.x, topY + 1.5, cz + wtOff.z,
        1.2 + Math.random() * 0.4, 2.5 + Math.random()
      );
    }

    /* Antenna */
    if(h > 32 && Math.random() < 0.20){
      collectAntenna(cx, topY + 3, cz, 0.08, 6);
    }
  }
}

/* ── L-shape: main block + wing attached at +X ── */
function addBuildingL(cx, cz, baseW, baseH, baseD, rot, matIdx){
  addBuildingBox(cx, cz, baseW, baseH, baseD, rot, matIdx, false);

  var wingW = baseW * 0.65;
  var wingD = baseD * 0.55;
  var wingH = baseH * 0.85;

  /* Wing offsets relative to main center, in local space */
  var lx = baseW * 0.5 + wingW * 0.5 - baseW * 0.15;
  var lz = -baseD * 0.5 + wingD * 0.5;

  var off = rotateOffset(lx, lz, rot);
  addBuildingBox(cx + off.x, cz + off.z, wingW, wingH, wingD, rot, matIdx, false);
}

/* ── T-shape: main block + perpendicular wing crossing at center ── */
function addBuildingT(cx, cz, baseW, baseH, baseD, rot, matIdx){
  addBuildingBox(cx, cz, baseW, baseH, baseD, rot, matIdx, false);

  var crossW = baseW * 0.9;
  var crossD = baseD * 0.55;
  var crossH = baseH * 0.9;

  /* Cross wing, perpendicular direction */
  var crossRot = rot + Math.PI / 2;
  addBuildingBox(cx, cz, crossW, crossH, crossD, crossRot, matIdx, false);
}

/* ── U-shape: main block + two wings on both sides ── */
function addBuildingU(cx, cz, baseW, baseH, baseD, rot, matIdx){
  addBuildingBox(cx, cz, baseW, baseH, baseD, rot, matIdx, false);

  var wingW = baseW * 0.4;
  var wingD = baseD * 0.55;
  var wingH = baseH * 0.9;

  /* Left wing */
  var offL = rotateOffset(-baseW * 0.5 - wingW * 0.5 + baseW * 0.1, 0, rot);
  addBuildingBox(cx + offL.x, cz + offL.z, wingW, wingH, wingD, rot, matIdx, false);

  /* Right wing */
  var offR = rotateOffset(baseW * 0.5 + wingW * 0.5 - baseW * 0.1, 0, rot);
  addBuildingBox(cx + offR.x, cz + offR.z, wingW, wingH, wingD, rot, matIdx, false);
}

/* ── Courtyard: four thin buildings around a hollow rectangle ── */
function addBuildingCourtyard(cx, cz, w, h, d, rot, matIdx){
  var t = Math.min(w, d) * 0.22;   /* wall thickness */

  /* North wall */
  var offN = rotateOffset(0, -d * 0.5 + t * 0.5, rot);
  addBuildingBox(cx + offN.x, cz + offN.z, w, h, t, rot, matIdx, false);

  /* South wall */
  var offS = rotateOffset(0, d * 0.5 - t * 0.5, rot);
  addBuildingBox(cx + offS.x, cz + offS.z, w, h, t, rot, matIdx, false);

  /* West wall */
  var offW = rotateOffset(-w * 0.5 + t * 0.5, 0, rot);
  addBuildingBox(cx + offW.x, cz + offW.z, t, h, d - t * 2, rot, matIdx, false);

  /* East wall */
  var offE = rotateOffset(w * 0.5 - t * 0.5, 0, rot);
  addBuildingBox(cx + offE.x, cz + offE.z, t, h, d - t * 2, rot, matIdx, false);
}

/* ───────────────────────────────────────────────────────────────
   FLUSH: turn collected data into InstancedMesh objects
   ─────────────────────────────────────────────────────────────── */
function flushInstancedGroups(){
  var dummy = new THREE.Object3D();

  /* ── 1. Building boxes grouped by material ── */
  for(var matIdx in BUILDING_DATA.boxes){
    var arr = BUILDING_DATA.boxes[matIdx];
    if(!arr || arr.length === 0) continue;

    /* Determine which material object to use (0–7 = BLD_MATS, 100+ = roof) */
    var mi = parseInt(matIdx, 10);
    var mat = (mi < 100) ? BLD_MATS[mi] : (mi === 100 ? MAT_ROOF_TOP : MAT_ROOF_FLAT);

    var im = new THREE.InstancedMesh(BOX_GEO, mat, arr.length);
    im.frustumCulled = false;   /* We spread across the whole map — disable culling */

    for(var i = 0; i < arr.length; i++){
      var b = arr[i];
      dummy.position.set(b.x, b.y + b.h / 2, b.z);
      dummy.rotation.set(0, b.rot, 0);
      dummy.scale.set(b.w, b.h, b.d);
      dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix);
    }
    im.instanceMatrix.needsUpdate = true;
    scene.add(im);
  }

  /* ── 2. Roof boxes (already keyed as 100 / 101) ── */
  for(var rMatIdx in BUILDING_DATA.roofs){
    var rArr = BUILDING_DATA.roofs[rMatIdx];
    if(!rArr || rArr.length === 0) continue;

    var rmi = parseInt(rMatIdx, 10);
    var rMat = (rmi === 100) ? MAT_ROOF_TOP : MAT_ROOF_FLAT;

    var rIm = new THREE.InstancedMesh(BOX_GEO, rMat, rArr.length);
    rIm.frustumCulled = false;

    for(var j = 0; j < rArr.length; j++){
      var rb = rArr[j];
      dummy.position.set(rb.x, rb.y, rb.z);
      dummy.rotation.set(0, rb.rot, 0);
      dummy.scale.set(rb.w, rb.h, rb.d);
      dummy.updateMatrix();
      rIm.setMatrixAt(j, dummy.matrix);
    }
    rIm.instanceMatrix.needsUpdate = true;
    scene.add(rIm);
  }

  /* ── 3. Cone (pyramidal) roofs ── */
  if(BUILDING_DATA.cones.length > 0){
    var cArr = BUILDING_DATA.cones;
    var cMat = new THREE.MeshLambertMaterial({ color: 0xa85030 });
    var cIm = new THREE.InstancedMesh(CONE_GEO, cMat, cArr.length);
    cIm.frustumCulled = false;

    for(var k = 0; k < cArr.length; k++){
      var cr = cArr[k];
      dummy.position.set(cr.x, cr.y, cr.z);
      dummy.rotation.set(0, cr.rotY, 0);
      dummy.scale.set(cr.r * 2, cr.h, cr.r * 2);
      dummy.updateMatrix();
      cIm.setMatrixAt(k, dummy.matrix);
    }
    cIm.instanceMatrix.needsUpdate = true;
    scene.add(cIm);
  }

  /* ── 4. Chimneys (cylinders) ── */
  if(BUILDING_DATA.chimneys.length > 0){
    var chArr = BUILDING_DATA.chimneys;
    var chIm = new THREE.InstancedMesh(CYL_GEO, MAT_CHIMNEY, chArr.length);
    chIm.frustumCulled = false;

    for(var ck = 0; ck < chArr.length; ck++){
      var c = chArr[ck];
      dummy.position.set(c.x, c.y, c.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(c.r * 2, c.h, c.r * 2);
      dummy.updateMatrix();
      chIm.setMatrixAt(ck, dummy.matrix);
    }
    chIm.instanceMatrix.needsUpdate = true;
    scene.add(chIm);
  }

  /* ── 5. AC units (small boxes) ── */
  if(BUILDING_DATA.acUnits.length > 0){
    var acArr = BUILDING_DATA.acUnits;
    var acIm = new THREE.InstancedMesh(BOX_GEO, MAT_AC_UNIT, acArr.length);
    acIm.frustumCulled = false;

    for(var ak = 0; ak < acArr.length; ak++){
      var a = acArr[ak];
      dummy.position.set(a.x, a.y, a.z);
      dummy.rotation.set(0, a.rot, 0);
      dummy.scale.set(a.w, a.h, a.d);
      dummy.updateMatrix();
      acIm.setMatrixAt(ak, dummy.matrix);
    }
    acIm.instanceMatrix.needsUpdate = true;
    scene.add(acIm);
  }

  /* ── 6. Water tanks (cylinders) ── */
  if(BUILDING_DATA.waterTanks.length > 0){
    var wtArr = BUILDING_DATA.waterTanks;
    var wtIm = new THREE.InstancedMesh(CYL_GEO, MAT_WATER_TANK, wtArr.length);
    wtIm.frustumCulled = false;

    for(var wk = 0; wk < wtArr.length; wk++){
      var w = wtArr[wk];
      dummy.position.set(w.x, w.y, w.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(w.r * 2, w.h, w.r * 2);
      dummy.updateMatrix();
      wtIm.setMatrixAt(wk, dummy.matrix);
    }
    wtIm.instanceMatrix.needsUpdate = true;
    scene.add(wtIm);
  }

  /* ── 7. Antennas (thin cylinders) ── */
  if(BUILDING_DATA.antennas.length > 0){
    var anArr = BUILDING_DATA.antennas;
    var anIm = new THREE.InstancedMesh(CYL_GEO, MAT_ANTENNA, anArr.length);
    anIm.frustumCulled = false;

    for(var ank = 0; ank < anArr.length; ank++){
      var an = anArr[ank];
      dummy.position.set(an.x, an.y, an.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(an.r * 2, an.h, an.r * 2);
      dummy.updateMatrix();
      anIm.setMatrixAt(ank, dummy.matrix);
    }
    anIm.instanceMatrix.needsUpdate = true;
    scene.add(anIm);
  }

  /* ── Report for debugging ── */
  var totalBoxes = 0;
  for(var mb in BUILDING_DATA.boxes) totalBoxes += BUILDING_DATA.boxes[mb].length;
  console.log(
    '[InstancedBuildings]',
    'boxes:', totalBoxes,
    '| roofs:', Object.keys(BUILDING_DATA.roofs).reduce(function(a, k){
      return a + BUILDING_DATA.roofs[k].length;
    }, 0),
    '| cones:', BUILDING_DATA.cones.length,
    '| chimneys:', BUILDING_DATA.chimneys.length,
    '| AC:', BUILDING_DATA.acUnits.length,
    '| tanks:', BUILDING_DATA.waterTanks.length,
    '| antennas:', BUILDING_DATA.antennas.length
  );
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 12 — CITY FABRIC POPULATION
   ───────────────────────────────────────────────────────────────
   Places ~140 buildings in the city plain, avoiding landmarks and
   roads.  Each building is randomly one of five shapes:
     · Simple box  (65%)
     · L-shape     (12%)
     · T-shape     (8%)
     · U-shape     (8%)
     · Courtyard   (7%)
   ═══════════════════════════════════════════════════════════════════ */
(function populateCity(){
  var placed = 0;
  var tries = 0;
  var MAX_BUILDINGS = 140;
  var MAX_TRIES = 4000;

  while(placed < MAX_BUILDINGS && tries < MAX_TRIES){
    tries++;

    /* Random position within city bounds */
    var x = (Math.random() - 0.5) * 1000;
    var z = (Math.random() - 0.5) * 1000;

    /* Bounds filters */
    if(Math.hypot(x, z) > 620) continue;
    if(isNearLandmark(x, z, 12)) continue;
    if(isNearRoad(x, z, 9)) continue;
    if(z > 240 && Math.abs(x) < 260) continue;   /* Cascade green zone */
    if(z < -400) continue;                       /* Beyond Marriott */

    /* Size */
    var w = 12 + Math.random() * 22;
    var d = 12 + Math.random() * 22;

    /* Height category */
    var r = Math.random();
    var h;
    if(r < 0.35) h = 10 + Math.random() * 8;
    else if(r < 0.68) h = 16 + Math.random() * 14;
    else if(r < 0.90) h = 28 + Math.random() * 16;
    else h = 44 + Math.random() * 22;

    /* Rotation — snap to 90° grid for a tidier city look */
    var rot = Math.round(Math.random() * 4) * Math.PI / 2;

    /* Material selection */
    var matIdx;
    if(h > 40 && Math.random() < 0.55) matIdx = 5;  /* Glass tower */
    else matIdx = Math.floor(Math.random() * 8);

    /* Shape selection */
    var shapeRoll = Math.random();
    if(shapeRoll < 0.65){
      /* Simple box */
      addBuildingBox(x, z, w, h, d, rot, matIdx, true);
    } else if(shapeRoll < 0.77){
      /* L-shape */
      addBuildingL(x, z, w, h, d, rot, matIdx);
    } else if(shapeRoll < 0.85){
      /* T-shape */
      addBuildingT(x, z, w, h, d, rot, matIdx);
    } else if(shapeRoll < 0.93){
      /* U-shape */
      addBuildingU(x, z, w, h, d, rot, matIdx);
    } else {
      /* Courtyard */
      addBuildingCourtyard(x, z, w, h, d, rot, matIdx);
    }
    placed++;
  }

  console.log('[CityFabric] Placed ' + placed + ' buildings in ' + tries + ' tries');
})();

/* ═══════════════════════════════════════════════════════════════════
   SECTION 13 — LANDMARKS (detailed, unique geometry)
   ───────────────────────────────────────────────────────────────
   Landmarks use raw Mesh objects (not instanced) because each is
   unique and there are only 8 of them.
   ═══════════════════════════════════════════════════════════════════ */

/* ── Shared landmark materials ── */
var MAT_TUFF       = new THREE.MeshLambertMaterial({ color: 0xe8d6b0 });
var MAT_TUFF_DARK  = new THREE.MeshLambertMaterial({ color: 0xc8a878 });
var MAT_ROOF_RED   = new THREE.MeshLambertMaterial({ color: 0xa04828 });
var MAT_STONE      = new THREE.MeshLambertMaterial({ color: 0x9a8870 });
var MAT_GOLD       = new THREE.MeshLambertMaterial({ color: 0xd8b050 });
var MAT_WATER      = new THREE.MeshLambertMaterial({ color: 0x3a7ac8 });
var MAT_GLASS_CYAN = new THREE.MeshLambertMaterial({ color: 0x7ac0e0, transparent: true, opacity: 0.75 });
var MAT_TREE_GRN   = new THREE.MeshLambertMaterial({ color: 0x2a5a20 });
var MAT_TRUNK      = new THREE.MeshLambertMaterial({ color: 0x4a2a14 });
var MAT_LAWN       = new THREE.MeshLambertMaterial({ color: 0x5a8a3a });
var MAT_FOUNTAIN   = new THREE.MeshLambertMaterial({ color: 0xb8a888 });

/* ── Helpers for constructing a landmark group ── */
function addBox(parent, x, y, z, w, h, d, mat, rot){
  var m = new THREE.Mesh(BOX_GEO, mat);
  m.scale.set(w, h, d);
  m.position.set(x, y, z);
  if(rot) m.rotation.y = rot;
  parent.add(m);
  return m;
}

function addCyl(parent, x, y, z, r1, r2, h, mat, seg){
  var g = new THREE.CylinderGeometry(r1, r2, h, seg || 12);
  var m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}

function addCone(parent, x, y, z, r, h, mat, seg, rotY){
  var g = new THREE.ConeGeometry(r, h, seg || 4);
  var m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  if(rotY) m.rotation.y = rotY;
  parent.add(m);
  return m;
}

/* ─── REPUBLIC SQUARE ─── */
function buildSquare(){
  var g = new THREE.Group();
  var cx = LM.square.x, cz = LM.square.z;
  var y0 = terrainHeight(cx, cz);

  /* Big plaza */
  var plaza = new THREE.Mesh(
    new THREE.CircleGeometry(46, 40),
    new THREE.MeshLambertMaterial({ color: 0xc8b090 })
  );
  plaza.rotation.x = -Math.PI / 2;
  plaza.position.set(0, y0 + 0.22, 0);
  g.add(plaza);

  /* Central fountain */
  addCyl(g, 0, y0 + 0.6, 0, 7, 7.5, 1.2, MAT_FOUNTAIN, 20);
  addCyl(g, 0, y0 + 1.3, 0, 6, 6, 0.5, MAT_WATER, 20);
  addCyl(g, 0, y0 + 3.5, 0, 0.3, 0.3, 4, MAT_WATER, 8);

  /* Curved government wings on the north side */
  for(var side = -1; side <= 1; side += 2){
    for(var seg = 0; seg < 5; seg++){
      var ang = side * (0.5 + seg * 0.16);
      var rr = 40 + seg * 1.5;
      var bx = Math.sin(ang) * rr;
      var bz = Math.cos(ang) * rr * 0.6 - 30;
      var bh = 15 - seg * 0.8;
      addBox(g, bx, y0 + bh / 2, bz, 8, bh, 8, MAT_TUFF, ang);
      var cAng = ang + Math.PI / 2;
      for(var ci = -1; ci <= 1; ci++){
        var ox = Math.cos(cAng) * ci * 2.2;
        var oz = -Math.sin(cAng) * ci * 2.2;
        addCyl(
          g,
          bx + ox + Math.sin(ang) * 4.2,
          y0 + 5,
          bz + oz + Math.cos(ang) * 4.2,
          0.6, 0.6, 10, MAT_TUFF, 8
        );
      }
    }
  }

  /* Clock tower */
  addBox(g, 0, y0 + 16, -62, 9, 32, 9, MAT_TUFF);
  addBox(g, 0, y0 + 34, -62, 11, 3, 11, MAT_TUFF_DARK);
  var clock = new THREE.Mesh(
    new THREE.CylinderGeometry(2.6, 2.6, 0.3, 20),
    new THREE.MeshLambertMaterial({ color: 0xf8f0d8 })
  );
  clock.rotation.x = Math.PI / 2;
  clock.position.set(0, y0 + 27, -57.5);
  g.add(clock);

  /* Two flanking government buildings */
  function wing(px){
    addBox(g, px, y0 + 10, 0, 22, 20, 30, MAT_TUFF);
    addBox(g, px, y0 + 21, 0, 24, 2.5, 32, MAT_TUFF_DARK);
    for(var i = -5; i <= 5; i++){
      addCyl(g, px + i * 2.2, y0 + 6, 16, 0.75, 0.75, 12, MAT_TUFF, 10);
    }
  }
  wing(-38);
  wing(38);

  /* Ring of trees around plaza */
  for(var ti = 0; ti < 18; ti++){
    var a = (ti / 18) * Math.PI * 2;
    var tx = Math.sin(a) * 44;
    var tz = Math.cos(a) * 44;
    addCyl(g, tx, y0 + 1.2, tz, 0.28, 0.35, 2.4, MAT_TRUNK, 6);
    addCone(g, tx, y0 + 4.5, tz, 1.6, 3.6, MAT_TREE_GRN, 6);
  }

  g.position.set(cx, 0, cz);
  scene.add(g);
  addCollision(cx, cz, 76, 30, 32, 0);
  addCollision(cx, cz - 62, 12, 12, 36, 0);
}

/* ─── OPERA ─── */
function buildOpera(){
  var g = new THREE.Group();
  var cx = LM.opera.x, cz = LM.opera.z;
  var y0 = terrainHeight(cx, cz);

  /* Park lawn */
  var park = new THREE.Mesh(new THREE.CircleGeometry(58, 32), MAT_LAWN);
  park.rotation.x = -Math.PI / 2;
  park.position.set(0, y0 + 0.28, 0);
  g.add(park);

  /* Oval main body */
  var main = new THREE.Mesh(new THREE.CylinderGeometry(24, 26, 18, 28), MAT_TUFF);
  main.position.set(0, y0 + 9, 0);
  main.scale.set(1.0, 1.0, 0.72);
  g.add(main);

  /* Dome cap */
  var cap = new THREE.Mesh(new THREE.CylinderGeometry(24.5, 24.5, 2.5, 28), MAT_TUFF_DARK);
  cap.position.set(0, y0 + 19.2, 0);
  cap.scale.set(1.0, 1.0, 0.72);
  g.add(cap);

  /* Drum */
  var drum = new THREE.Mesh(new THREE.CylinderGeometry(14, 14, 6, 20), MAT_TUFF_DARK);
  drum.position.set(0, y0 + 23.5, 0);
  drum.scale.set(1.0, 1.0, 0.72);

   ═══════════════════════════════════════════════════════════════════ */
(function(){
  var NUM = 500;
  var trunkGeo = new THREE.CylinderGeometry(0.22, 0.32, 2.2, 5);
  trunkGeo.translate(0, 1.1, 0);
  var leafGeo = new THREE.ConeGeometry(1.5, 3.4, 6);
  leafGeo.translate(0, 3.6, 0);

  var trunks = new THREE.InstancedMesh(trunkGeo, MAT_TRUNK, NUM);
  var leaves = new THREE.InstancedMesh(leafGeo, MAT_TREE_GRN, NUM);
  trunks.frustumCulled = false;
  leaves.frustumCulled = false;

  var dummy = new THREE.Object3D();
  var placed = 0, tries = 0;
  while(placed < NUM && tries < 8000){
    tries++;
    var x = (Math.random() - 0.5) * 1200;
    var z = (Math.random() - 0.5) * 1200;

    if(Math.hypot(x, z) < 100) continue;
    if(isNearLandmark(x, z, 4)) continue;
    /* Prefer near roads */
    var nearRoad = isNearRoad(x, z, 12);
    if(!nearRoad && Math.random() < 0.7) continue;

    var y = terrainHeight(x, z);
    var s = 0.7 + Math.random() * 0.9;
    var rot = Math.random() * Math.PI * 2;

    dummy.position.set(x, y, z);
    dummy.rotation.set(0, rot, 0);
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    trunks.setMatrixAt(placed, dummy.matrix);
    leaves.setMatrixAt(placed, dummy.matrix);
    placed++;
  }
  trunks.count = placed;
  leaves.count = placed;
  trunks.instanceMatrix.needsUpdate = true;
  leaves.instanceMatrix.needsUpdate = true;
  scene.add(trunks);
  scene.add(leaves);
  console.log('[Trees] Placed ' + placed + ' trees');
})();

function buildCar(colorHex){
  var g = new THREE.Group();
  g.rotation.order = 'YXZ';

  var bodyMat   = new THREE.MeshLambertMaterial({ color: colorHex });
  var darkMat   = new THREE.MeshLambertMaterial({ color: 0x0a0d14 });

  var tireMat   = new THREE.MeshLambertMaterial({ color: 0x0e0e12 });
  var rimMat    = new THREE.MeshLambertMaterial({ color: 0xc0c8d0 });
  var headMat   = new THREE.MeshBasicMaterial({ color: 0xfff4d0 });
  var tailMat   = new THREE.MeshBasicMaterial({ color: 0xff2222 });

  var chassis = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.2, 4.7), darkMat);
  chassis.position.y = 0.36;
  g.add(chassis);

  var body = new THREE.Mesh(new THREE.BoxGeometry(1.96, 0.6, 4.6), bodyMat);
  body.position.y = 0.75;
  g.add(body);

  var shoulder = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.22, 4.45), bodyMat);
  shoulder.position.y = 1.14;
  g.add(shoulder);

  var nose = new THREE.Mesh(new THREE.BoxGeometry(1.78, 0.52, 1.25), bodyMat);
  nose.position.set(0, 0.82, 2.55);
  g.add(nose);

  var hood = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.15, 1.75), bodyMat);
  hood.position.set(0, 1.22, 1.6);
  g.add(hood);

  var cabin = new THREE.Mesh(new THREE.BoxGeometry(1.74, 0.66, 2.35), glassMat);
  cabin.position.set(0, 1.55, -0.35);
  g.add(cabin);

  var roof = new THREE.Mesh(new THREE.BoxGeometry(1.68, 0.11, 2.15), bodyMat);
  roof.position.set(0, 1.92, -0.35);
  g.add(roof);

  [-0.87, 0.87].forEach(function(px){
    var pA = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.68, 0.22), darkMat);
    pA.position.set(px, 1.55, 0.78);
    pA.rotation.x = -0.3;

    var pB = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.68, 0.14), darkMat);
    pB.position.set(px, 1.55, -0.35);
    g.add(pB);

    var pC = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.68, 0.2), darkMat);
    pC.position.set(px, 1.55, -1.42);
    pC.rotation.x = 0.28;
    g.add(pC);
  });

  var fB = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.34, 0.44), darkMat);
  fB.position.set(0, 0.62, 2.98);
  g.add(fB);

  var rB = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.32, 0.42), darkMat);
  rB.position.set(0, 0.62, -2.4);
  g.add(rB);

  var grille = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.36, 0.06), chromeMat);
  grille.position.set(0, 0.74, 3.2);
  g.add(grille);

  var trunk = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.15, 1.25), bodyMat);
  trunk.position.set(0, 1.18, -1.95);
  g.add(trunk);

  var spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.72, 0.09, 0.55), darkMat);
  spoiler.position.set(0, 1.36, -2.2);
  g.add(spoiler);

  [-1.02, 1.02].forEach(function(x){
    var arm = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.05, 0.09), darkMat);
    arm.position.set(x * 0.95, 1.48, 0.78);
    g.add(arm);

    var mir = new THREE.Mesh(new THREE.BoxGeometry(0.21, 0.1, 0.15), bodyMat);
    mir.position.set(x * 1.15, 1.45, 0.78);
    g.add(mir);
  });

  [-0.62, 0.62].forEach(function(x){
    var h = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.24, 0.08), headMat);
    h.position.set(x, 0.88, 3.12);
    g.add(h);
  });

  [-0.62, 0.62].forEach(function(x){
    var t = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.2, 0.08), tailMat);
    t.position.set(x, 0.88, -2.5);
    g.add(t);
  });

  /* ── Wheels ── */
  function makeWheel(){
    var steer = new THREE.Group();
    var roll = new THREE.Group();
    steer.add(roll);

    var tireGeo = new THREE.TorusGeometry(0.44, 0.17, 8, 16);
    tireGeo.rotateY(Math.PI / 2);
    var tire = new THREE.Mesh(tireGeo, tireMat);
    roll.add(tire);

    var discGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.26, 16);
    discGeo.rotateZ(Math.PI / 2);

      var a = (sp / 5) * Math.PI * 2;
      var spoke = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.06, 0.5), rimMat);

      spoke.position.y = Math.sin(a) * 0.2;
      spoke.position.z = Math.cos(a) * 0.2;
      roll.add(spoke);

    return { steer: steer, roll: roll };

    { x:  1.02, z:  1.5, tag: 'fr' },
    { x: -1.02, z: -1.5, tag: 'rl' },
    { x:  1.02, z: -1.5, tag: 'rr' }

  var shadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.6, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  g.add(shadow);

  return { group: g, wheels: wheels, tailMat: tailMat, bodyMat: bodyMat };
}

};

/* ═══════════════════════════════════════════════════════════════════
   SECTION 18 — PHYSICS
   ═══════════════════════════════════════════════════════════════════ */
function updatePhysics(dt){
  /* Steering input */
  var target = 0;
  if(IN.left) target = -1;
  if(IN.right) target = 1;

  S.steer += (target - S.steer) * Math.min(1, 6 * dt);
  if(!IN.left && !IN.right){
    S.steer += (0 - S.steer) * Math.min(1, 5 * dt);
    if(Math.abs(S.steer) < 0.003) S.steer = 0;
  }

  /* Throttle */
  if(IN.gas) S.speed += (S.speed < 40 ? 38 : 22) * dt;
  if(IN.rev){
    if(S.speed > 0.5) S.speed -= 65 * dt;
    else S.speed -= 28 * dt;
  }
  if(!IN.gas && !IN.rev){
    if(S.speed > 0.05) S.speed -= 10 * dt;
    else if(S.speed < -0.05) S.speed += 10 * dt;
    else S.speed = 0;
  }

  /* Slope resistance */
  var fx = Math.sin(S.heading), fz = Math.cos(S.heading);
  var aheadH = terrainHeight(S.x + fx * 5, S.z + fz * 5);
  var behindH = terrainHeight(S.x - fx * 5, S.z - fz * 5);
  var slope = (aheadH - behindH) / 10;
  S.speed -= slope * 22 * dt;
  S.speed = Math.max(-MAX_REV_KMH, Math.min(MAX_KMH, S.speed));

  /* Steering — reverses when moving backward (Fix #4) */
  var v = S.speed / 3.6;
  var spdFac = Math.max(-1, Math.min(1, v / 8));
  S.heading -= S.steer * 1.9 * spdFac * dt;

  /* Position update */
  var nfx = Math.sin(S.heading), nfz = Math.cos(S.heading);
  S.x += nfx * v * dt;
  S.z += nfz * v * dt;

  /* World limits */
  S.x = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, S.x));
  S.z = Math.max(-WORLD_LIMIT, Math.min(WORLD_LIMIT, S.z));

  /* ═══════ Collision using spatial hash ═══════ */
  var hk = Math.floor(S.x / HASH_SIZE) + ',' + Math.floor(S.z / HASH_SIZE);
  var nearby = COL_HASH[hk];
  if(nearby){
    for(var ci = 0; ci < nearby.length; ci++){
      var b = nearby[ci];
      var hw = b.w / 2 + 1.4;
      var hd = b.d / 2 + 1.4;
      var ddx = S.x - b.x;
      var ddz = S.z - b.z;
      if(Math.abs(ddx) < hw && Math.abs(ddz) < hd){
        var ox = hw - Math.abs(ddx);
        var oz = hd - Math.abs(ddz);
        if(ox < oz) S.x = b.x + Math.sign(ddx || 1) * hw;
        else S.z = b.z + Math.sign(ddz || 1) * hd;
        S.speed *= 0.35;
      }
    }
  }

  /* Ground height */
  var groundY = terrainHeight(S.x, S.z);

  /* Suspension */
  var targetSusp = -slope * 0.04;
  S.suspensionV += (targetSusp - S.suspensionY) * 55 * dt - S.suspensionV * 9 * dt;
  S.suspensionY += S.suspensionV * dt;

  /* Terrain-following pitch and roll (Fix #7) */
  var rx = Math.cos(S.heading), rz = -Math.sin(S.heading);
  var hF = terrainHeight(S.x + fx * 1.6, S.z + fz * 1.6);
  var hB = terrainHeight(S.x - fx * 1.6, S.z - fz * 1.6);
  var hL = terrainHeight(S.x - rx * 1.1, S.z - rz * 1.1);
  var hR = terrainHeight(S.x + rx * 1.1, S.z + rz * 1.1);

  var terrainPitch = Math.atan2(hF - hB, 3.2);
  var terrainRoll  = Math.atan2(hR - hL, 2.2);

  S.bodyPitchV += (terrainPitch - S.bodyPitch) * 14 * dt - S.bodyPitchV * 8 * dt;
  S.bodyPitch  += S.bodyPitchV * dt;

  var steerRoll = -S.steer * 0.06;
  S.bodyRollV += (terrainRoll + steerRoll - S.bodyRoll) * 14 * dt - S.bodyRollV * 8 * dt;
  S.bodyRoll  += S.bodyRollV * dt;

  /* Apply transforms */
  player.group.position.set(S.x, groundY + S.suspensionY, S.z);
  player.group.rotation.y = S.heading;
  player.group.rotation.x = -S.bodyPitch;
  player.group.rotation.z = S.bodyRoll;

  /* Wheels (Fix #1 + #2) */
  var spin = v * dt * 2.2;
  S.wheelSpin += spin;
  for(var wk = 0; wk < player.wheels.length; wk++){
    var w = player.wheels[wk];
    w.roll.rotation.x = S.wheelSpin;
    if(w.tag === 'fl' || w.tag === 'fr'){
      w.steer.rotation.y = -S.steer * 0.5;
    }
  }

  /* Brake light */
  var braking = IN.rev || (!IN.gas && Math.abs(S.speed) > 4);
  player.tailMat.color.setHex(braking ? 0xff1010 : 0xff2222);

  updateLocationName();
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 19 — LOCATION NAME
   ═══════════════════════════════════════════════════════════════════ */
var lastLocName = '';
function updateLocationName(){
  var closest = 'Երևան', minD = Infinity;
  for(var k in LM){
    var L = LM[k];
    var d = Math.hypot(S.x - L.x, S.z - L.z);
    if(d < minD){ minD = d; closest = L.name; }
  }
  var newLoc = minD < 90 ? closest : 'Երևան';
  if(newLoc !== lastLocName){
    lastLocName = newLoc;
    S.loc = newLoc;
    var el = document.getElementById('locName');
    if(el) el.textContent = newLoc;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 20 — CAMERA
   ═══════════════════════════════════════════════════════════════════ */
function updateCamera(dt){
  /* Auto-follow when driving and not recently dragged (Fix #49) */
  var timeSinceDrag = performance.now() - S.lastCamDrag;
  if(Math.abs(S.speed) > 6 && timeSinceDrag > 1800){
    var diff = S.heading - S.camYaw;
    while(diff >  Math.PI) diff -= Math.PI * 2;
    while(diff < -Math.PI) diff += Math.PI * 2;
    S.camYaw += diff * Math.min(1, 1.8 * dt);
  }

  var dist = S.camDist * Math.cos(S.camPitch * 0.65);
  var high = 1.8 + S.camDist * Math.sin(S.camPitch);

  var tx = S.x - Math.sin(S.camYaw) * dist;
  var tz = S.z - Math.cos(S.camYaw) * dist;
  var ty = terrainHeight(tx, tz) + high;
  var minY = terrainHeight(tx, tz) + 1.7;
  if(ty < minY) ty = minY;

  var k = 1 - Math.exp(-9 * dt);
  S.camX += (tx - S.camX) * k;
  S.camY += (ty - S.camY) * k;
  S.camZ += (tz - S.camZ) * k;

  var lx = S.x + Math.sin(S.heading) * 6;
  var lz = S.z + Math.cos(S.heading) * 6;
  var ly = terrainHeight(S.x, S.z) + 1.3;
  var lk = 1 - Math.exp(-11 * dt);
  S.camLX += (lx - S.camLX) * lk;
  S.camLY += (ly - S.camLY) * lk;
  S.camLZ += (lz - S.camLZ) * lk;

  camera.position.set(S.camX, S.camY, S.camZ);
  camera.lookAt(S.camLX, S.camLY, S.camLZ);

  var tFov = 62 + Math.abs(S.speed / MAX_KMH) * 6;
  if(Math.abs(camera.fov - tFov) > 0.2){
    camera.fov += (tFov - camera.fov) * Math.min(1, 3 * dt);
    camera.updateProjectionMatrix();
  }

  /* Sun follows camera for consistent lighting */
  sun.position.set(S.x - 100, 200, S.z + 120);
  sun.target.position.set(S.x, 0, S.z);
  sun.target.updateMatrixWorld();
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 21 — HUD + MINIMAP
   ═══════════════════════════════════════════════════════════════════ */
var spdEl = document.getElementById('spdVal');
var compassEl = document.getElementById('compassArrow');
var perfEl = document.getElementById('perfInfo');
var lastSpd = -1;

var minimapCanvas = document.getElementById('minimap');
var mmCtx = minimapCanvas.getContext('2d');
var MM_SIZE = 264;
var MM_RANGE = 320;

/* Frame counter for perf display */
var fps = 0, frameCount = 0, fpsTimer = 0;

function updateHUD(dt){
  var spd = Math.round(Math.abs(S.speed));
  if(spd !== lastSpd){
    spdEl.textContent = spd;
    lastSpd = spd;
  }
  var deg = S.heading * 180 / Math.PI;
  compassEl.style.transform = 'rotate(' + (-deg) + 'deg)';

  /* Perf overlay */
  frameCount++;
  fpsTimer += dt;
  if(fpsTimer >= 0.5){
    fps = Math.round(frameCount / fpsTimer);
    frameCount = 0;
    fpsTimer = 0;
    if(perfEl){
      perfEl.textContent =
        fps + ' FPS · ' +
        renderer.info.render.calls + ' calls · ' +
        renderer.info.render.triangles + ' tris';
    }
  }

  drawMinimap();
}

function drawMinimap(){
  var ctx = mmCtx;
  var S2 = MM_SIZE / 2;
  var scale = (MM_SIZE / 2) / MM_RANGE;
  ctx.clearRect(0, 0, MM_SIZE, MM_SIZE);

  ctx.fillStyle = '#1a2a3a';
  ctx.fillRect(0, 0, MM_SIZE, MM_SIZE);
  ctx.fillStyle = '#2a4a2a';
  ctx.beginPath();
  ctx.arc(S2, S2, S2 - 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(S2, S2);
  ctx.rotate(-S.heading);

  /* Roads */
  ctx.strokeStyle = '#ffcc44';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  for(var i = 0; i < ROAD_EDGES.length; i++){
    var e = ROAD_EDGES[i];
    var A = ROAD_NODES[e[0]], B = ROAD_NODES[e[1]];
    ctx.beginPath();
    ctx.moveTo((A.x - S.x) * scale, (A.z - S.z) * scale);
    ctx.lineTo((B.x - S.x) * scale, (B.z - S.z) * scale);
    ctx.stroke();
  }

  /* Winding path */
  ctx.strokeStyle = '#a08a3a';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for(var wi = 0; wi < WINDING_PATH.length; wi++){
    var W = WINDING_PATH[wi];
    var wx = (W.x - S.x) * scale;
    var wy = (W.z - S.z) * scale;
    if(wi === 0) ctx.moveTo(wx, wy);
    else ctx.lineTo(wx, wy);
  }
  ctx.stroke();

  /* Landmarks */
  for(var k in LM){
    var L = LM[k];
    var lx = (L.x - S.x) * scale;
    var ly = (L.z - S.z) * scale;
    if(Math.hypot(lx, ly) > S2 - 8) continue;
    ctx.fillStyle = '#ff5577';
    ctx.beginPath();
    ctx.arc(lx, ly, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('N', 0, -S2 + 16);

  ctx.restore();

  /* Car arrow */
  ctx.save();
  ctx.translate(S2, S2);
  ctx.fillStyle = '#ff3b3b';
  ctx.beginPath();
  ctx.moveTo(0, -9);
  ctx.lineTo(-6, 6);
  ctx.lineTo(0, 3);
  ctx.lineTo(6, 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(S2, S2, S2 - 3, 0, Math.PI * 2);
  ctx.stroke();
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 22 — INPUT BINDING
   ═══════════════════════════════════════════════════════════════════ */
function bindHold(el, key){
  if(!el) return;
  var on = function(e){
    e.preventDefault();
    IN[key] = true;
    el.classList.add('on');
  };
  var off = function(e){
    e.preventDefault();
    IN[key] = false;
    el.classList.remove('on');
  };
  el.addEventListener('touchstart', on, {passive: false});
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}

bindHold(document.getElementById('btnGas'), 'gas');
bindHold(document.getElementById('btnRev'), 'rev');
bindHold(document.getElementById('btnL'), 'left');
bindHold(document.getElementById('btnR'), 'right');

window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(e.repeat) return;
  if(k === 'arrowup' || k === 'w') IN.gas = true;
  if(k === 'arrowdown' || k === 's') IN.rev = true;
  if(k === 'arrowleft' || k === 'a') IN.left = true;
  if(k === 'arrowright' || k === 'd') IN.right = true;
});
window.addEventListener('keyup', function(e){
  var k = e.key.toLowerCase();
  if(k === 'arrowup' || k === 'w') IN.gas = false;
  if(k === 'arrowdown' || k === 's') IN.rev = false;
  if(k === 'arrowleft' || k === 'a') IN.left = false;
  if(k === 'arrowright' || k === 'd') IN.right = false;
});

/* ── Camera drag zone ── */
(function(){
  var z = document.getElementById('camZone');
  if(!z) return;
  var drag = false, sx = 0, sy = 0, sYaw = 0, sPitch = 0;

  var dn = function(e){
    e.preventDefault();
    drag = true;
    var t = e.touches ? e.touches[0] : e;
    sx = t.clientX;
    sy = t.clientY;
    sYaw = S.camYaw;
    sPitch = S.camPitch;
    S.lastCamDrag = performance.now();
  };
  var mv = function(e){
    if(!drag) return;
    e.preventDefault();
    var t = e.touches ? e.touches[0] : e;
    S.lastCamDrag = performance.now();
    S.camYaw = sYaw - (t.clientX - sx) / 200;
    S.camPitch = Math.max(0.05, Math.min(1.2, sPitch + (sy - t.clientY) / 280));
  };
  var up = function(){ drag = false; };

  z.addEventListener('touchstart', dn, {passive: false});
  z.addEventListener('touchmove', mv, {passive: false});
  z.addEventListener('touchend', up);
  z.addEventListener('touchcancel', up);
  z.addEventListener('mousedown', dn);
  window.addEventListener('mousemove', mv);
  window.addEventListener('mouseup', up);
})();

/* ── Global gesture prevention ── */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){
  if(e.touches.length > 1) e.preventDefault();
}, {passive: false});

/* ═══════════════════════════════════════════════════════════════════
   SECTION 23 — GAME START
   ═══════════════════════════════════════════════════════════════════ */
function startGame(){
  /* Spawn on main road facing Cascade */
  S.x = 0;
  S.z = -320;
  S.heading = 0;
  S.speed = 0;
  S.steer = 0;
  S.camYaw = 0;
  S.camPitch = 0.42;
  S.suspensionY = 0;
  S.suspensionV = 0;
  S.bodyRoll = 0;
  S.bodyRollV = 0;
  S.bodyPitch = 0;
  S.bodyPitchV = 0;
  S.wheelSpin = 0;
  S.lastCamDrag = 0;

  var dist = S.camDist;
  S.camX = S.x - Math.sin(S.camYaw) * dist;
  S.camY = terrainHeight(S.camX, S.z - dist) + 3.2;
  S.camZ = S.z - Math.cos(S.camYaw) * dist;
  S.camLX = S.x;
  S.camLY = terrainHeight(S.x, S.z) + 1.3;
  S.camLZ = S.z + 6;

  player.group.position.set(S.x, terrainHeight(S.x, S.z), S.z);
  player.group.rotation.y = S.heading;
  player.group.rotation.x = 0;
  player.group.rotation.z = 0;

  S.phase = 'play';
  lastLocName = '';
  updateLocationName();

  /* Reveal perf overlay */
  var perf = document.getElementById('perfInfo');
  if(perf) perf.style.display = 'block';
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 24 — RESIZE
   ═══════════════════════════════════════════════════════════════════ */
function resize(){
  var w = window.innerWidth;
  var h = window.innerHeight;
  renderer.setSize(w, h, false);
  cvs.style.width = '100%';
  cvs.style.height = '100%';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){
  setTimeout(resize, 200);
  setTimeout(resize, 600);
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resize);
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 25 — MAIN LOOP
   ═══════════════════════════════════════════════════════════════════ */
var lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min(0.04, (now - lastT) / 1000);
  lastT = now;

  if(S.phase === 'play'){
    updatePhysics(dt);
  }
  updateCamera(dt);
  updateHUD(dt);
  renderer.render(scene, camera);
}

/* ═══════════════════════════════════════════════════════════════════
   SECTION 26 — INIT
   ═══════════════════════════════════════════════════════════════════ */
resize();
player.group.position.set(S.x, terrainHeight(S.x, S.z), S.z);
requestAnimationFrame(loop);

/* Signal readiness to the loader */
window.__gameReady = true;
window.__gameStartFn = startGame;
