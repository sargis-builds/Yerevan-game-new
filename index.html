<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1020">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Երևան · 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1020;color:#fff;touch-action:none;overscroll-behavior:none;position:fixed}
#app{position:fixed;inset:0;overflow:hidden}
@media (orientation:portrait){#app{width:100vh;height:100vw;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.panel{
  background:linear-gradient(165deg,rgba(255,255,255,.95),rgba(230,238,250,.9));
  border:1px solid rgba(30,60,110,.2);border-radius:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,20,60,.2);color:#0a1a30;
}
#topLeft{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));padding:9px 16px}
#lvlName{font-size:10px;letter-spacing:2.5px;color:#3a6ea5;font-weight:800}
#locName{font-size:19px;font-weight:800;margin-top:2px}
#topRight{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));padding:9px 16px;text-align:right;min-width:130px}
#spdVal{font-size:33px;font-weight:900;line-height:1}
#spdUnit{font-size:10px;color:#3a6ea5;letter-spacing:3px;font-weight:700;margin-top:1px}
#compass{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 78px);left:max(12px,env(safe-area-inset-left));padding:8px 14px;text-align:center}
#compassArrow{font-size:22px;color:#0a1a30;transition:transform .1s}

#controls{position:absolute;inset:0;z-index:20;pointer-events:none}
.btn{
  position:absolute;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(210,225,245,.92));
  border:2.5px solid rgba(50,90,150,.45);
  box-shadow:0 8px 22px rgba(0,20,60,.3),inset 0 2px 0 rgba(255,255,255,.8);
  color:#1a3050;font-weight:900;
  transition:transform .08s,background .12s;touch-action:none;
}
.btn:active,.btn.on{transform:scale(.94);background:linear-gradient(160deg,rgba(120,180,255,.96),rgba(70,130,220,.96));border-color:rgba(30,80,160,.9);color:#fff}

#btnL{left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:100px;height:100px;font-size:38px}
#btnR{left:calc(max(18px,env(safe-area-inset-left)) + 116px);bottom:max(22px,env(safe-area-inset-bottom));width:100px;height:100px;font-size:38px}
#btnGas{right:max(20px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:116px;height:116px;font-size:15px;letter-spacing:2px;border-color:rgba(40,160,80,.55);color:#0a6030}
#btnGas:active,#btnGas.on{background:linear-gradient(160deg,rgba(70,220,120,.96),rgba(30,150,70,.96));color:#fff}
#btnRev{right:calc(max(20px,env(safe-area-inset-right)) + 132px);bottom:max(26px,env(safe-area-inset-bottom));width:92px;height:92px;font-size:13px;letter-spacing:1.5px;border-color:rgba(200,60,60,.55);color:#a02020}
#btnRev:active,#btnRev.on{background:linear-gradient(160deg,rgba(255,80,80,.96),rgba(180,30,30,.96));color:#fff}

#camZone{position:absolute;top:0;right:0;width:55%;height:55%;z-index:12;pointer-events:auto;touch-action:none}

#loader{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 50% 40%,#16264a,#040810 75%);transition:opacity .6s ease-out}
#loader.done{opacity:0;pointer-events:none}
#loaderTitle{font-size:clamp(34px,7vw,58px);font-weight:900;letter-spacing:14px;background:linear-gradient(90deg,#7dd3fc,#fbbf24,#f472b6,#7dd3fc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:300% 0}}
#loaderSub{font-size:11px;letter-spacing:7px;color:#8ea8c8;font-weight:700}
#barWrap{width:280px;height:6px;border-radius:3px;background:rgba(255,255,255,.13);overflow:hidden;margin-top:8px}
#barFill{height:100%;width:0%;background:linear-gradient(90deg,#7dd3fc,#fbbf24,#f472b6);border-radius:3px;transition:width .15s linear}
#barText{font-size:11px;letter-spacing:3px;color:#a8c0dc;font-weight:600;min-height:14px;margin-top:4px}
#tapHint{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;letter-spacing:5px;font-weight:800;opacity:0;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#errorBox{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(200,30,30,.9);color:#fff;padding:10px 20px;border-radius:10px;font-size:12px;font-family:monospace;max-width:90vw;display:none;z-index:200;word-break:break-all}
</style>

<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="panel" id="topLeft">
      <div id="lvlName">ԵՐԵՎԱՆ · 3D</div>
      <div id="locName">Երևան</div>
    </div>
    <div class="panel" id="topRight">
      <div id="spdVal">0</div>
      <div id="spdUnit">ԿՄ/Ժ</div>
    </div>
    <div class="panel" id="compass">
      <div id="compassArrow">↑</div>
    </div>
  </div>

  <div id="controls">
    <div class="btn" id="btnL">◀</div>
    <div class="btn" id="btnR">▶</div>
    <div class="btn" id="btnGas">ԳԱԶ</div>
    <div class="btn" id="btnRev">ՀԵՏ</div>
  </div>

  <div id="camZone"></div>

  <div id="loader">
    <div id="loaderTitle">ԵՐԵՎԱՆ</div>
    <div id="loaderSub">3D · ՔԱՂԱՔ · ՌԵԼԻԵՖ</div>
    <div id="barWrap"><div id="barFill"></div></div>
    <div id="barText">ՄԻԱՑՈՒՄ...</div>
    <div id="tapHint">ՀՊԵՔ ՍԿՍԵԼՈՒ ՀԱՄԱՐ</div>
  </div>

  <div id="errorBox"></div>
</div>

<script>
window.__gameStartFn = null;
window.addEventListener('error', function(e){
  var eb = document.getElementById('errorBox');
  if(eb){ eb.style.display = 'block'; eb.textContent = 'ՍԽԱԼ՝ ' + (e.message || '') + ' @' + (e.lineno || '?'); }
});

(function(){
  var fill = document.getElementById('barFill');
  var text = document.getElementById('barText');
  var loader = document.getElementById('loader');
  var p = 0, started = false;

  var iv = setInterval(function(){
    p += 8 + Math.random() * 8;
    if(p > 100) p = 100;
    if(fill) fill.style.width = p + '%';
    if(text){
      if(p < 35) text.textContent = 'ՄԻԱՑՈՒՄ...';
      else if(p < 70) text.textContent = 'ԿԱՌՈՒՑՈՒՄ...';
      else if(p < 100) text.textContent = 'ՊԱՏՐԱՍՏՎՈՒՄ...';
      else text.textContent = 'ՊԱՏՐԱՍՏ';
    }
    if(p >= 100) clearInterval(iv);
  }, 40);

  function launch(){
    if(started) return;
    started = true;
    if(!window.__gameStartFn) return;
    try { window.__gameStartFn(); } catch(e){ console.error(e); }
    if(loader) loader.classList.add('done');
  }

  // Start on first user interaction (needed for fullscreen)
  function onFirstTap(e){
    // Request fullscreen from user gesture
    try {
      var el = document.documentElement;
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if(fn) {
        var r = fn.call(el);
        if(r && r.catch) r.catch(function(){});
      }
      if(screen.orientation && screen.orientation.lock){
        try { screen.orientation.lock('landscape').catch(function(){}); } catch(_){}
      }
      window.scrollTo(0, 1);
      setTimeout(function(){ window.scrollTo(0, 1); }, 200);
      setTimeout(function(){ window.scrollTo(0, 1); }, 700);
    } catch(_){}

    // Wait a tiny beat for fullscreen transition
    setTimeout(launch, 200);

    window.removeEventListener('touchstart', onFirstTap);
    window.removeEventListener('mousedown', onFirstTap);
  }

  window.addEventListener('touchstart', onFirstTap, {passive: true});
  window.addEventListener('mousedown', onFirstTap);

  // Fallback auto-start (if user has mouse/keyboard and never taps)
  setTimeout(function(){
    if(!started && window.__gameStartFn){
      // Still require gesture for fullscreen, but launch game anyway
      setTimeout(launch, 200);
    }
  }, 5000);
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
'use strict';

/* ═════════════ CONSTANTS ═════════════ */
var MAX_KMH = 110;
var MAX_REV_KMH = 25;
var ROAD_WIDTH = 14;
var HASH_SIZE = 40;

var LM = {
  square:     { x: 0,    z: 0,    name: 'Հանրապետության հրապարակ' },
  cascades:   { x: 0,    z: 420,  name: 'Կասկադ' },
  opera:      { x: -230, z: 80,   name: 'Օպերայի շենք' },
  matenadaran:{ x: -420, z: 260,  name: 'Մատենադարան' },
  gallery:    { x: -180, z: -30,  name: 'Ազգային պատկերասրահ' },
  northAve:   { x: 130,  z: 30,   name: 'Հյուսիսային պողոտա' },
  marriott:   { x: -20,  z: -200, name: 'Marriott Hotel' },
  university: { x: 260,  z: -280, name: 'Երևանի պետական համալսարան' }
};

/* ═════════════ TERRAIN ═════════════ */
function terrainHeight(x, z){
  var y = 0;
  // Rise to north → Cascade hill
  var t = (z - 60) / 360;
  if(t < 0) t = 0;
  if(t > 1) t = 1;
  y += Math.pow(t, 1.7) * 82;
  if(z > 420) y += (z - 420) * 0.15;

  // Matenadaran small hill
  var dmx = x + 420, dmz = z - 260;
  y += 22 * Math.exp(-(dmx*dmx + dmz*dmz) / 18000);

  // Bumpy green hills around Cascades (wild nature)
  var dcx = x, dcz = z - 420;
  var dc = Math.sqrt(dcx*dcx + dcz*dcz);
  if(dc < 320 && z > 260){
    var str = (320 - dc) / 320;
    y += str * str * 5 * Math.sin(x * 0.06) * Math.cos(z * 0.05);
    y += str * str * 3 * Math.sin(x * 0.11 + z * 0.07);
  }

  // Gentle waves
  y += 1 * Math.sin(x * 0.012) * Math.cos(z * 0.009);
  return y;
}

/* ═════════════ RENDERER ═════════════ */
var app = document.getElementById('app');
var cvs = document.getElementById('c');

var renderer = new THREE.WebGLRenderer({
  canvas: cvs, antialias: true, powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = true;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8c8e8);
scene.fog = new THREE.Fog(0xb8d4e8, 240, 600);

var camera = new THREE.PerspectiveCamera(58, 16/9, 0.3, 800);

/* Sky */
(function(){
  var g = new THREE.SphereGeometry(700, 24, 12);
  var m = new THREE.ShaderMaterial({
    uniforms: {
      cT: { value: new THREE.Color(0x3a7fd0) },
      cM: { value: new THREE.Color(0xa8cae8) },
      cH: { value: new THREE.Color(0xf8e0b8) }
    },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 cT; uniform vec3 cM; uniform vec3 cH; varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 col = h > 0.0 ? mix(cM, cT, pow(h, 0.6)) : cM; float hor = exp(-abs(h) * 6.0); col = mix(col, cH, hor * 0.65); gl_FragColor = vec4(col, 1.0); }',
    side: THREE.BackSide, depthWrite: false, fog: false
  });
  scene.add(new THREE.Mesh(g, m));
})();

/* Lights */
scene.add(new THREE.HemisphereLight(0xc8e0f8, 0x8a7a5a, 0.85));
var sun = new THREE.DirectionalLight(0xfff0d0, 1.15);
sun.position.set(-60, 120, 45);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 320;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.04;
scene.add(sun);
var sunTarget = new THREE.Object3D();
scene.add(sunTarget);
sun.target = sunTarget;

/* ═════════════ TERRAIN MESH ═════════════ */
function makeGrassTex(){
  var cv = document.createElement('canvas');
  cv.width = 128; cv.height = 128;
  var x = cv.getContext('2d');
  x.fillStyle = '#7a9a55';
  x.fillRect(0, 0, 128, 128);
  for(var i = 0; i < 2000; i++){
    var r = Math.random();
    x.fillStyle = r > 0.66 ? '#8aaa60' : (r > 0.33 ? '#6a8a48' : '#5a7a3a');
    x.fillRect(Math.random() * 128, Math.random() * 128, 1.5, 2);
  }
  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(40, 40);
  t.encoding = THREE.sRGBEncoding;
  return t;
}

var TERRAIN_SIZE = 1400;
var TERRAIN_RES = 90;
var terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_RES, TERRAIN_RES);
terrainGeo.rotateX(-Math.PI / 2);

(function(){
  var pos = terrainGeo.attributes.position;
  for(var i = 0; i < pos.count; i++){
    pos.setY(i, terrainHeight(pos.getX(i), pos.getZ(i)));
  }
  pos.needsUpdate = true;
  terrainGeo.computeVertexNormals();
})();

var terrainMesh = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({
  map: makeGrassTex(), roughness: 1, metalness: 0
}));
terrainMesh.receiveShadow = true;
scene.add(terrainMesh);

/* ═════════════ ROADS (SPLINE-BASED) ═════════════ */
function makeAsphaltTex(){
  var cv = document.createElement('canvas');
  cv.width = 128; cv.height = 256;
  var x = cv.getContext('2d');
  x.fillStyle = '#3a3d42';
  x.fillRect(0, 0, 128, 256);
  for(var i = 0; i < 1200; i++){
    x.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.07)';
    x.fillRect(Math.random() * 128, Math.random() * 256, 1.5, 1.5);
  }
  // Dashed center line
  x.fillStyle = '#e8b830';
  for(var y = 0; y < 256; y += 32){
    x.fillRect(60, y, 3, 16);
    x.fillRect(66, y, 3, 16);
  }
  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

var asphaltTex = makeAsphaltTex();
var asphaltMat = new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.92, metalness: 0.02 });

/* Build a curved road ribbon from control points */
function buildRoad(points, width, yOffset, material){
  var v3 = [];
  for(var i = 0; i < points.length; i++){
    v3.push(new THREE.Vector3(points[i].x, 0, points[i].z));
  }
  var curve = new THREE.CatmullRomCurve3(v3, false, 'catmullrom', 0.5);
  var len = curve.getLength();
  var N = Math.max(24, Math.ceil(len / 6));
  var pts = curve.getSpacedPoints(N);

  var pos = [], uv = [], idx = [];
  for(var i = 0; i <= N; i++){
    var p = pts[i];
    var prev = pts[Math.max(0, i-1)];
    var next = pts[Math.min(N, i+1)];
    var dx = next.x - prev.x, dz = next.z - prev.z;
    var l = Math.hypot(dx, dz) || 1;
    var nx = -dz / l, nz = dx / l;

    var lx = p.x + nx * width / 2, lz = p.z + nz * width / 2;
    var rx = p.x - nx * width / 2, rz = p.z - nz * width / 2;

    pos.push(lx, terrainHeight(lx, lz) + yOffset, lz);
    pos.push(rx, terrainHeight(rx, rz) + yOffset, rz);

    var uvY = i * (len / N) * 0.05;
    uv.push(0, uvY, 1, uvY);
  }
  for(var i = 0; i < N; i++){
    var b = i * 2;
    idx.push(b, b+1, b+2, b+1, b+3, b+2);
  }

  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  var mesh = new THREE.Mesh(geo, material || asphaltMat);
  mesh.receiveShadow = true;
  return mesh;
}

/* Road network - curved, organic, matches Yerevan layout */
var ROADS = [
  // Mashtots Ave: main N-S from south → square → cascade base
  [ {x:10,z:-440}, {x:4,z:-320}, {x:-6,z:-180}, {x:0,z:-40},
    {x:6,z:60}, {x:14,z:150}, {x:4,z:240}, {x:-6,z:320} ],

  // Tumanyan: E-W through square
  [ {x:-380,z:-30}, {x:-200,z:-12}, {x:-60,z:0},
    {x:60,z:4}, {x:200,z:10}, {x:380,z:20} ],

  // West ring: around Opera / Matenadaran side
  [ {x:-120,z:180}, {x:-230,z:150}, {x:-290,z:60},
    {x:-280,z:-40}, {x:-230,z:-140}, {x:-100,z:-220} ],

  // East ring / Northern Ave side
  [ {x:110,z:200}, {x:200,z:130}, {x:230,z:20},
    {x:220,z:-80}, {x:180,z:-190}, {x:60,z:-260} ],

  // NW to Matenadaran
  [ {x:-280,z:-40}, {x:-360,z:60}, {x:-400,z:160}, {x:-420,z:250} ],

  // NE outer
  [ {x:230,z:20}, {x:340,z:-40}, {x:420,z:-160} ],

  // SE outer
  [ {x:180,z:-190}, {x:260,z:-280}, {x:380,z:-340} ],

  // Southwest connector
  [ {x:-230,z:-140}, {x:-300,z:-260}, {x:-380,z:-360} ]
];

for(var ri = 0; ri < ROADS.length; ri++){
  scene.add(buildRoad(ROADS[ri], ROAD_WIDTH, 0.12));
}

/* Winding road up to Cascades (from far east, snaking up the hill) */
var WINDING = [
  {x:380, z:100}, {x:330, z:180}, {x:260, z:240}, {x:200, z:310},
  {x:250, z:380}, {x:210, z:440}, {x:130, z:490}, {x:70, z:530},
  {x:30, z:560}, {x:6, z:580}
];
scene.add(buildRoad(WINDING, 11, 0.15));

/* ═════════════ COLLISIONS (spatial hash) ═════════════ */
var COL_HASH = {};

function addCollision(x, z, w, d, h, rotY){
  var c = Math.abs(Math.cos(rotY || 0));
  var s = Math.abs(Math.sin(rotY || 0));
  var aw = w * c + d * s;
  var ad = w * s + d * c;
  var b = { x: x, z: z, w: aw, d: ad, h: h };

  var x1 = Math.floor((b.x - aw/2) / HASH_SIZE);
  var x2 = Math.floor((b.x + aw/2) / HASH_SIZE);
  var z1 = Math.floor((b.z - ad/2) / HASH_SIZE);
  var z2 = Math.floor((b.z + ad/2) / HASH_SIZE);
  for(var i = x1; i <= x2; i++){
    for(var j = z1; j <= z2; j++){
      var k = i + ',' + j;
      if(!COL_HASH[k]) COL_HASH[k] = [];
      COL_HASH[k].push(b);
    }
  }
}

/* ═════════════ BUILDINGS (VARIED) ═════════════ */
function makeBuildingTex(baseColor){
  var cv = document.createElement('canvas');
  cv.width = 128; cv.height = 256;
  var x = cv.getContext('2d');
  x.fillStyle = baseColor;
  x.fillRect(0, 0, 128, 256);
  for(var i = 0; i < 700; i++){
    x.fillStyle = 'rgba(120,100,80,' + (Math.random() * 0.09) + ')';
    x.fillRect(Math.random() * 128, Math.random() * 256, 3, 2);
  }
  var cols = 3, rows = 8;
  var cw = 128 / cols, ch = 256 / rows;
  for(var r = 1; r < rows; r++){
    for(var c = 0; c < cols; c++){
      var wx = c * cw + 8;
      var wy = r * ch + 8;
      x.fillStyle = '#2a3a4a';
      x.fillRect(wx, wy, cw - 16, ch - 14);
      x.fillStyle = Math.random() > 0.5 ? '#6a8aa8' : '#4a6a88';
      x.fillRect(wx + 1, wy + 1, cw - 18, ch - 16);
      x.fillStyle = 'rgba(255,255,255,0.4)';
      x.fillRect(wx + 2, wy + 2, (cw - 20) * 0.35, (ch - 18) * 0.35);
    }
  }
  var t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

/* Road proximity test */
function isRoadZone(x, z){
  for(var ri = 0; ri < ROADS.length; ri++){
    var pts = ROADS[ri];
    for(var i = 0; i < pts.length - 1; i++){
      var p1 = pts[i], p2 = pts[i+1];
      var dx = p2.x - p1.x, dz = p2.z - p1.z;
      var l2 = dx*dx + dz*dz;
      var t = ((x - p1.x) * dx + (z - p1.z) * dz) / l2;
      t = Math.max(0, Math.min(1, t));
      var px = p1.x + dx * t, pz = p1.z + dz * t;
      if(Math.hypot(x - px, z - pz) < ROAD_WIDTH / 2 + 10) return true;
    }
  }
  for(var i = 0; i < WINDING.length - 1; i++){
    var p1 = WINDING[i], p2 = WINDING[i+1];
    var dx = p2.x - p1.x, dz = p2.z - p1.z;
    var l2 = dx*dx + dz*dz;
    var t = ((x - p1.x) * dx + (z - p1.z) * dz) / l2;
    t = Math.max(0, Math.min(1, t));
    var px = p1.x + dx * t, pz = p1.z + dz * t;
    if(Math.hypot(x - px, z - pz) < 14) return true;
  }
  return false;
}

function isNearLandmark(x, z, r){
  for(var k in LM){
    var L = LM[k];
    if(Math.hypot(x - L.x, z - L.z) < r) return true;
  }
  return false;
}

/* Build varied city fabric */
function buildCityBlocks(){
  var placed = 0;
  var tries = 0;
  while(placed < 95 && tries < 800){
    tries++;
    var x = (Math.random() - 0.5) * 1000;
    var z = (Math.random() - 0.5) * 1000;

    if(isNearLandmark(x, z, 60)) continue;
    if(isRoadZone(x, z)) continue;
    // Skip cascade area (green zone)
    if(z > 280 && Math.abs(x) < 220) continue;
    // Skip further out
    if(Math.hypot(x, z) > 620) continue;

    var w = 10 + Math.random() * 20;
    var d = 10 + Math.random() * 20;
    var h;
    var r = Math.random();
    if(r < 0.45) h = 9 + Math.random() * 10;
    else if(r < 0.8) h = 16 + Math.random() * 18;
    else if(r < 0.95) h = 28 + Math.random() * 20;
    else h = 45 + Math.random() * 25; // tall tower

    var rot = Math.round(Math.random() * 4) * Math.PI / 2;
    var shape = Math.random();

    // Pick material - sometimes modern for tall buildings
    var matIdx;
    if(h > 40 && Math.random() < 0.6) matIdx = 6; // glass
    else matIdx = Math.floor(Math.random() * 6);

    if(shape < 0.15){
      // L-shape
      placeBox(x, z, w, h, d, rot, matIdx);
      var ox = Math.cos(rot) * (w * 0.6);
      var oz = -Math.sin(rot) * (w * 0.6);
      placeBox(x + ox, z + oz, w * 0.55, h * 0.75, d * 0.55, rot, matIdx);
    } else if(shape < 0.25 && h < 30){
      // T-shape
      placeBox(x, z, w, h, d, rot, matIdx);
      var ox = Math.cos(rot) * (d * 0.55);
      var oz = -Math.sin(rot) * (d * 0.55);
      placeBox(x + oz, z + ox, w * 0.7, h * 0.85, d * 0.5, rot + Math.PI/2, matIdx);
    } else {
      placeBox(x, z, w, h, d, rot, matIdx);
    }

    // Sometimes add a roof detail
    if(h > 15 && Math.random() < 0.4){
      var rw = w * 0.6, rd = d * 0.6, rh = 1.5 + Math.random() * 2;
      var roofM = new THREE.Mesh(BOX_GEO, BLD_MATS[Math.floor(Math.random() * 6)]);
      roofM.scale.set(rw, rh, rd);
      roofM.position.set(x, terrainHeight(x, z) + h + rh/2, z);
      roofM.rotation.y = rot;
      roofM.castShadow = true;
      scene.add(roofM);
    }

    placed++;
  }
}

(function(){
  var NUM = 260;
  var trunkGeo = new THREE.CylinderGeometry(0.25, 0.35, 2, 5);
  trunkGeo.translate(0, 1, 0);
  var leafGeo = new THREE.ConeGeometry(1.6, 3, 6);
  leafGeo.translate(0, 3.5, 0);

  var trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3a20, roughness: 0.95 });
  var leafMat = new THREE.MeshStandardMaterial({ color: 0x2a5a20, roughness: 0.95 });

  var trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, NUM);
  var leaves = new THREE.InstancedMesh(leafGeo, leafMat, NUM);

  var dummy = new THREE.Object3D();
  var placed = 0, tries = 0;
  while(placed < NUM && tries < 3000){
    tries++;
    var x = (Math.random() - 0.5) * 1200;
    var z = (Math.random() - 0.5) * 1200;
    if(Math.hypot(x, z) < 120) continue;
    if(isRoadZone(x, z)) continue;
    if(isNearLandmark(x, z, 42)) continue;
    if(Math.abs(x - LM.cascades.x) < 40 && Math.abs(z - LM.cascades.z) < 100) continue;

    var y = terrainHeight(x, z);
    var s = 0.7 + Math.random() * 0.8;
    var rot = Math.random() * Math.PI * 2;

    dummy.position.set(x, y, z);
    dummy.rotation.set(0, rot, 0);
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    trunks.setMatrixAt(placed, dummy.matrix);
    leaves.setMatrixAt(placed, dummy.matrix);
    placed++;
  }
  trunks.count = placed;
  leaves.count = placed;
  trunks.instanceMatrix.needsUpdate = true;
  leaves.instanceMatrix.needsUpdate = true;
  trunks.castShadow = true;
  leaves.castShadow = true;
  scene.add(trunks);
  scene.add(leaves);
})();

    arm.position.set(x * 0.95, 1.48, 0.78);
    g.add(arm);
    var mir = new THREE.Mesh(new THREE.BoxGeometry(0.21, 0.1, 0.15), bodyMat);
    mir.position.set(x * 1.15, 1.45, 0.78);
    g.add(mir);
  });

  [-0.62, 0.62].forEach(function(x){
    var h = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.24, 0.08), headMat);
    h.position.set(x, 0.88, 3.12);
    g.add(h);
  });

  [-0.62, 0.62].forEach(function(x){
    var t = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.2, 0.08), tailMat);
    t.position.set(x, 0.88, -2.5);
    g.add(t);
  });

  function makeWheel(){
    var steer = new THREE.Group();
    var roll = new THREE.Group();
    steer.add(roll);

    var tireGeo = new THREE.TorusGeometry(0.44, 0.17, 10, 20);
    tireGeo.rotateY(Math.PI / 2);
    var tire = new THREE.Mesh(tireGeo, tireMat);
    tire.castShadow = true;
    roll.add(tire);

    var discGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.26, 16);
    discGeo.rotateZ(Math.PI / 2);
    var disc = new THREE.Mesh(discGeo, rimMat);
    roll.add(disc);

    for(var sp = 0; sp < 5; sp++){
      var a = (sp / 5) * Math.PI * 2;
      var spoke = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.06, 0.5), rimMat);
      spoke.rotation.x = a;
      spoke.position.y = Math.sin(a) * 0.2;
      spoke.position.z = Math.cos(a) * 0.2;
      roll.add(spoke);
    }

    var ringGeo = new THREE.TorusGeometry(0.32, 0.035, 5, 16);
    ringGeo.rotateY(Math.PI / 2);
    var ring = new THREE.Mesh(ringGeo, chromeMat);
    roll.add(ring);

    return { steer: steer, roll: roll };
  }

  var wheels = [];
  var wp = [
    { x: -1.02, z: 1.5, tag: 'fl' },
    { x: 1.02, z: 1.5, tag: 'fr' },
    { x: -1.02, z: -1.5, tag: 'rl' },
    { x: 1.02, z: -1.5, tag: 'rr' }
  ];
  for(var wi = 0; wi < wp.length; wi++){
    var w = makeWheel();
    // ✅ FIX: wheel center at 0.61 (torus outer radius), so tire bottom touches ground
    w.steer.position.set(wp[wi].x, 0.61, wp[wi].z);
    g.add(w.steer);
    wheels.push({ steer: w.steer, roll: w.roll, tag: wp[wi].tag });
  }

  var brakeLight = new THREE.PointLight(0xff2020, 0, 8);
  brakeLight.position.set(0, 0.88, -2.6);
  g.add(brakeLight);

  return { group: g, wheels: wheels, brakeLight: brakeLight, tailMat: tailMat };
}

var player = buildCar(0xe83030);
scene.add(player.group);

/* ═════════════ STATE ═════════════ */
var S = {
  phase: 'loading',
  x: 0, z: -320, heading: 0, speed: 0, steer: 0,
  camX: 0, camY: 0, camZ: 0,
  camLX: 0, camLY: 0, camLZ: 0,
  camYaw: 0, camPitch: 0.38, camDist: 8.5,
  loc: 'Երևան',
  suspensionY: 0, suspensionV: 0,
  bodyRoll: 0, bodyRollV: 0,
  lastCamDrag: 0
};

var IN = { gas: false, rev: false, left: false, right: false };

/* ═════════════ PHYSICS ═════════════ */
function updatePhysics(dt){
  var target = 0;
  if(IN.left) target = -1;
  if(IN.right) target = 1;

  S.steer += (target - S.steer) * Math.min(1, 6 * dt);
  if(!IN.left && !IN.right){
    S.steer += (0 - S.steer) * Math.min(1, 5 * dt);
    if(Math.abs(S.steer) < 0.003) S.steer = 0;
  }

  if(IN.gas) S.speed += (S.speed < 40 ? 40 : 22) * dt;
  if(IN.rev){
    if(S.speed > 0.5) S.speed -= 65 * dt;
    else S.speed -= 28 * dt;
  }
  if(!IN.gas && !IN.rev){
    if(S.speed > 0.05) S.speed -= 10 * dt;
    else if(S.speed < -0.05) S.speed += 10 * dt;
    else S.speed = 0;
  }

  // Slope resistance
  var fx = Math.sin(S.heading), fz = Math.cos(S.heading);
  var aheadH = terrainHeight(S.x + fx * 6, S.z + fz * 6);
  var behindH = terrainHeight(S.x - fx * 6, S.z - fz * 6);
  var slope = (aheadH - behindH) / 12;
  S.speed -= slope * 18 * dt;
  S.speed = Math.max(-MAX_REV_KMH, Math.min(MAX_KMH, S.speed));

  // ✅ FIX: reverse steering sign preserved
  var v = S.speed / 3.6;
  var spdFac = Math.max(-1, Math.min(1, v / 10));
  S.heading -= S.steer * 1.7 * spdFac * dt;

  var nfx = Math.sin(S.heading), nfz = Math.cos(S.heading);
  S.x += nfx * v * dt;
  S.z += nfz * v * dt;

  var lim = 680;
  S.x = Math.max(-lim, Math.min(lim, S.x));
  S.z = Math.max(-lim, Math.min(lim, S.z));

  // Collision via hash
  var hk = Math.floor(S.x / HASH_SIZE) + ',' + Math.floor(S.z / HASH_SIZE);
  var nearby = COL_HASH[hk];
  if(nearby){
    for(var ci = 0; ci < nearby.length; ci++){
      var b = nearby[ci];
      var hw = b.w / 2 + 1.2;
      var hd = b.d / 2 + 1.2;
      var ddx = S.x - b.x;
      var ddz = S.z - b.z;
      if(Math.abs(ddx) < hw && Math.abs(ddz) < hd){
        var ox = hw - Math.abs(ddx);
        var oz = hd - Math.abs(ddz);
        if(ox < oz) S.x = b.x + Math.sign(ddx) * hw;
        else S.z = b.z + Math.sign(ddz) * hd;
        S.speed *= 0.4;
      }
    }
  }

  var groundY = terrainHeight(S.x, S.z);
  var targetSusp = -slope * 0.05;
  S.suspensionV += (targetSusp - S.suspensionY) * 50 * dt - S.suspensionV * 8 * dt;
  S.suspensionY += S.suspensionV * dt;

  player.group.position.set(S.x, groundY + S.suspensionY, S.z);
  player.group.rotation.y = S.heading;

  // ✅ FIX: body roll uses car-local axis
  var rx = Math.cos(S.heading), rz = -Math.sin(S.heading);
  var terrainRoll = Math.atan2(
    terrainHeight(S.x - rx, S.z - rz) - terrainHeight(S.x + rx, S.z + rz),
    2
  ) * 0.7;
  var targetRoll = -S.steer * 0.05 + terrainRoll;
  S.bodyRollV += (targetRoll - S.bodyRoll) * 15 * dt - S.bodyRollV * 7 * dt;
  S.bodyRoll += S.bodyRollV * dt;
  player.group.rotation.z = S.bodyRoll;

  // ✅ FIX: wheel spin direction (+= is forward)
  var spin = v * dt * 2.0;
  for(var wk = 0; wk < player.wheels.length; wk++){
    var w = player.wheels[wk];
    w.roll.rotation.x += spin;
    if(w.tag === 'fl' || w.tag === 'fr'){
      // ✅ FIX: steering rotation is NEGATIVE
      w.steer.rotation.y = -S.steer * 0.5;
    }
  }

  var braking = IN.rev || (!IN.gas && Math.abs(S.speed) > 3);
  player.brakeLight.intensity = braking ? 1.5 : 0;
  player.tailMat.color.setHex(braking ? 0xff1010 : 0xff2222);

  updateLocationName();
}

var lastLoc = '';
function updateLocationName(){
  var closest = 'Երևան', minD = Infinity;
  for(var k in LM){
    var L = LM[k];
    var d = Math.hypot(S.x - L.x, S.z - L.z);
    if(d < minD){ minD = d; closest = L.name; }
  }
  var newLoc = minD < 80 ? closest : 'Երևան';
  if(newLoc !== lastLoc){
    lastLoc = newLoc;
    S.loc = newLoc;
    document.getElementById('locName').textContent = newLoc;
  }
}

/* ═════════════ CAMERA (orbit on right, auto-follow) ═════════════ */
function updateCamera(dt){
  // Auto-return to behind car only if driving and not recently dragged
  var timeSinceDrag = performance.now() - S.lastCamDrag;
  if(Math.abs(S.speed) > 5 && timeSinceDrag > 2000){
    var diff = ((S.heading - S.camYaw + Math.PI) % (Math.PI * 2)) - Math.PI;
    if(diff < -Math.PI) diff += Math.PI * 2;
    S.camYaw += diff * Math.min(1, 1.6 * dt);
  }

  var dist = S.camDist * Math.cos(S.camPitch * 0.7);
  var high = 1.5 + S.camDist * Math.sin(S.camPitch);

  var tx = S.x - Math.sin(S.camYaw) * dist;
  var tz = S.z - Math.cos(S.camYaw) * dist;
  var ty = terrainHeight(tx, tz) + high;
  var minY = terrainHeight(tx, tz) + 1.6;
  if(ty < minY) ty = minY;

  var k = 1 - Math.exp(-9 * dt);
  S.camX += (tx - S.camX) * k;
  S.camY += (ty - S.camY) * k;
  S.camZ += (tz - S.camZ) * k;

  var lx = S.x + Math.sin(S.heading) * 6;
  var lz = S.z + Math.cos(S.heading) * 6;
  var ly = terrainHeight(S.x, S.z) + 1.2;
  var lk = 1 - Math.exp(-10 * dt);
  S.camLX += (lx - S.camLX) * lk;
  S.camLY += (ly - S.camLY) * lk;
  S.camLZ += (lz - S.camLZ) * lk;

  camera.position.set(S.camX, S.camY, S.camZ);
  camera.lookAt(S.camLX, S.camLY, S.camLZ);

  var tFov = 60 + Math.abs(S.speed / MAX_KMH) * 8;
  if(Math.abs(camera.fov - tFov) > 0.15){
    camera.fov += (tFov - camera.fov) * Math.min(1, 3 * dt);
    camera.updateProjectionMatrix();
  }

  sunTarget.position.copy(player.group.position);
  sun.position.copy(player.group.position).add(new THREE.Vector3(-60, 120, 45));
}

/* ═════════════ HUD ═════════════ */
var lastSpd = -1;
function updateHUD(){
  var spd = Math.round(Math.abs(S.speed));
  if(spd !== lastSpd){
    document.getElementById('spdVal').textContent = spd;
    lastSpd = spd;
  }
  var deg = S.heading * 180 / Math.PI;
  document.getElementById('compassArrow').style.transform = 'rotate(' + (-deg) + 'deg)';
}

/* ═════════════ INPUT ═════════════ */
function bindHold(el, key){
  if(!el) return;
  var on = function(e){
    e.preventDefault();
    IN[key] = true;
    el.classList.add('on');
  };
  var off = function(e){
    e.preventDefault();
    IN[key] = false;
    el.classList.remove('on');
  };
  el.addEventListener('touchstart', on, {passive: false});
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}

bindHold(document.getElementById('btnGas'), 'gas');
bindHold(document.getElementById('btnRev'), 'rev');
bindHold(document.getElementById('btnL'), 'left');
bindHold(document.getElementById('btnR'), 'right');

window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(e.repeat) return;
  if(k === 'arrowup' || k === 'w') IN.gas = true;
  if(k === 'arrowdown' || k === 's') IN.rev = true;
  if(k === 'arrowleft' || k === 'a') IN.left = true;
  if(k === 'arrowright' || k === 'd') IN.right = true;
});
window.addEventListener('keyup', function(e){
  var k = e.key.toLowerCase();
  if(k === 'arrowup' || k === 'w') IN.gas = false;
  if(k === 'arrowdown' || k === 's') IN.rev = false;
  if(k === 'arrowleft' || k === 'a') IN.left = false;
  if(k === 'arrowright' || k === 'd') IN.right = false;
});

/* Camera drag zone — right half, vertical limited, horizontal free */
(function(){
  var z = document.getElementById('camZone');
  if(!z) return;
  var drag = false, sx = 0, sy = 0, sYaw = 0, sPitch = 0;

  var dn = function(e){
    e.preventDefault();
    drag = true;
    var t = e.touches ? e.touches[0] : e;
    sx = t.clientX; sy = t.clientY;
    sYaw = S.camYaw; sPitch = S.camPitch;
    S.lastCamDrag = performance.now();
  };
  var mv = function(e){
    if(!drag) return;
    e.preventDefault();
    var t = e.touches ? e.touches[0] : e;
    S.lastCamDrag = performance.now();
    // Horizontal: unlimited yaw
    S.camYaw = sYaw - (t.clientX - sx) / 220;
    // Vertical: limited pitch
    S.camPitch = Math.max(0.05, Math.min(1.15, sPitch + (sy - t.clientY) / 300));
  };
  var up = function(){ drag = false; };

  z.addEventListener('touchstart', dn, {passive: false});
  z.addEventListener('touchmove', mv, {passive: false});
  z.addEventListener('touchend', up);
  z.addEventListener('touchcancel', up);
  z.addEventListener('mousedown', dn);
  window.addEventListener('mousemove', mv);
  window.addEventListener('mouseup', up);
})();

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){
  if(e.touches.length > 1) e.preventDefault();
}, {passive: false});

/* ═════════════ START GAME ═════════════ */
function startGame(){
  S.x = 0;
  S.z = -320;
  S.heading = 0;
  S.speed = 0;
  S.camYaw = 0;
  S.camPitch = 0.38;
  S.suspensionY = 0;
  S.bodyRoll = 0;
  S.lastCamDrag = 0;

  var dist = S.camDist;
  S.camX = S.x - Math.sin(S.camYaw) * dist;
  S.camY = terrainHeight(S.camX, S.z - dist) + 3;
  S.camZ = S.z - Math.cos(S.camYaw) * dist;
  S.camLX = S.x;
  S.camLY = terrainHeight(S.x, S.z) + 1.2;
  S.camLZ = S.z + 6;

  player.group.position.set(S.x, terrainHeight(S.x, S.z), S.z);
  player.group.rotation.y = S.heading;
  player.group.rotation.z = 0;

  S.phase = 'play';
  updateLocationName();
}

/* ═════════════ RESIZE ═════════════ */
function resize(){
  var w = app.clientWidth || window.innerWidth;
  var h = app.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  cvs.style.width = '100%';
  cvs.style.height = '100%';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });

/* ═════════════ LOOP ═════════════ */
var lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now;

  if(S.phase === 'play') updatePhysics(dt);
  updateCamera(dt);
  updateHUD();
  renderer.render(scene, camera);
}

/* ═════════════ INIT ═════════════ */
resize();
player.group.position.set(S.x, terrainHeight(S.x, S.z), S.z);
requestAnimationFrame(loop);

window.__gameStartFn = startGame;

})();
</script>
