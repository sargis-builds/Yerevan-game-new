<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#87ceeb">
<title>Երևան · 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;color:#fff;touch-action:none;overscroll-behavior:none;position:fixed}
#app{position:fixed;inset:0;overflow:hidden}
@media (orientation:portrait){#app{width:100vh;height:100vw;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.32) 100%)}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.panel{background:linear-gradient(165deg,rgba(255,255,255,.95),rgba(230,238,250,.9));border:1px solid rgba(30,60,110,.2);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,20,60,.2);color:#0a1a30}
#topLeft{position:absolute;top:10px;left:10px;padding:9px 16px}
#lvlName{font-size:10px;letter-spacing:2.5px;color:#3a6ea5;font-weight:800}
#locName{font-size:19px;font-weight:800;margin-top:2px}
#topRight{position:absolute;top:10px;right:10px;padding:9px 16px;text-align:right;min-width:140px}
#spdVal{font-size:33px;font-weight:900;line-height:1}
#spdUnit{font-size:10px;color:#3a6ea5;letter-spacing:3px;font-weight:700;margin-top:1px}
#compass{position:absolute;top:110px;left:10px;padding:8px 14px;text-align:center}
#compassN{font-size:11px;font-weight:900;color:#e11d48;letter-spacing:2px}
#compassArrow{font-size:24px;color:#0a1a30;margin-top:-4px;transition:transform .1s}
#pauseBtn{position:absolute;top:10px;left:50%;transform:translateX(-50%);pointer-events:auto;padding:7px 18px;border-radius:12px;font-size:11px;letter-spacing:2px;font-weight:800;color:#0a1a30;cursor:pointer;background:rgba(255,255,255,.9);border:1px solid rgba(30,60,110,.25);z-index:25}
#controls{position:absolute;inset:0;z-index:20;pointer-events:none}
.btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(210,225,245,.92));border:2.5px solid rgba(50,90,150,.45);box-shadow:0 8px 22px rgba(0,20,60,.3),inset 0 2px 0 rgba(255,255,255,.8);color:#1a3050;font-weight:900;transition:transform .08s,background .12s;touch-action:none}
.btn:active,.btn.on{transform:scale(.94);background:linear-gradient(160deg,rgba(120,180,255,.96),rgba(70,130,220,.96));border-color:rgba(30,80,160,.9);color:#fff}
#btnL{left:22px;bottom:24px;width:114px;height:114px;font-size:46px}
#btnR{left:152px;bottom:24px;width:114px;height:114px;font-size:46px}
#btnBrake{right:160px;bottom:28px;width:98px;height:98px;font-size:14px;letter-spacing:1.5px;border-color:rgba(200,60,60,.5);color:#a02020}
#btnBrake:active,#btnBrake.on{background:linear-gradient(160deg,rgba(255,80,80,.96),rgba(180,30,30,.96));color:#fff}
#btnGas{right:26px;bottom:20px;width:126px;height:126px;font-size:16px;letter-spacing:2px;border-color:rgba(40,160,80,.5);color:#0a6030}
#btnGas:active,#btnGas.on{background:linear-gradient(160deg,rgba(70,220,120,.96),rgba(30,150,70,.96));color:#fff}
#camZone{position:absolute;top:0;right:0;width:82px;height:100%;pointer-events:auto;z-index:21;touch-action:none}
#msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:66px;font-weight:900;letter-spacing:6px;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.6);pointer-events:none;opacity:0;z-index:30;white-space:nowrap;color:#fff;padding:0 20px}
#msg.show{animation:popMsg 2.4s ease-out}
@keyframes popMsg{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}

#homeScreen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 0%,rgba(120,180,255,.4),transparent 65%),linear-gradient(170deg,#0c1830,#060c18 55%,#040810);transition:opacity .8s}
#homeScreen.hide{opacity:0;pointer-events:none}
#title{font-size:clamp(36px,7vw,66px);font-weight:900;letter-spacing:12px;background:linear-gradient(90deg,#7dd3fc,#fbbf24,#f472b6,#7dd3fc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
#sub{font-size:11px;letter-spacing:8px;color:#8ea8c8;margin-top:-4px;font-weight:700}
#loadingBar{margin-top:20px;width:220px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
#loadingFill{height:100%;width:0%;background:linear-gradient(90deg,#7dd3fc,#fbbf24);transition:width .3s}
#hint{font-size:11px;color:#8ea8c8;letter-spacing:2px;text-align:center;line-height:1.9;margin-top:20px;max-width:88vw}
.k{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(120,180,255,.16);border:1px solid rgba(150,190,255,.35);color:#b8d4ff;font-weight:700;margin:0 2px}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="vig"></div>

  <div id="hud">
    <div class="panel" id="topLeft">
      <div id="lvlName">ԵՐԵՎԱՆ · 3D</div>
      <div id="locName">Երևան</div>
    </div>
    <div class="panel" id="topRight">
      <div id="spdVal">0</div>
      <div id="spdUnit">ԿՄ/Ժ</div>
    </div>
    <div class="panel" id="compass">
      <div id="compassN">N</div>
      <div id="compassArrow">↑</div>
    </div>
    <div id="pauseBtn">⏸</div>
  </div>

  <div id="controls">
    <div class="btn" id="btnL">◀</div>
    <div class="btn" id="btnR">▶</div>
    <div class="btn" id="btnBrake">ՀԵՏ</div>
    <div class="btn" id="btnGas">ԳԱԶ</div>
  </div>
  <div id="camZone"></div>

  <div id="msg"></div>

  <div id="homeScreen">
    <div id="title">ԵՐԵՎԱՆ</div>
    <div id="sub">3D · ՔԱՂԱՔ · ՌԵԼԻԵՖ</div>
    <div id="loadingBar"><div id="loadingFill"></div></div>
    <div id="hint">
      <span class="k">◀ ▶</span> ղեկ · <span class="k">ԳԱԶ</span> · <span class="k">ՀԵՏ</span> · Աջ եզրից ↕ կամերա<br>
      Բարձրացի՛ր Կասկադի գագաթը ոլորուն ճանապարհով
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ═══════ ԿԱՅՈՒՆՆԵՐ ═══════ */
const ROAD_W = 9, SIDEWALK_W = 3.5, SPACING = 60, GRID_N = 11;
const MAX_KMH = 90, MAX_REV_KMH = 25;
const CITY_SIZE = (GRID_N-1)*SPACING, HALF_CITY = CITY_SIZE/2;

const LANDMARKS = {
  cascade:     { i:5, j:9,  name:'ԿԱՍԿԱԴ' },
  matenadaran: { i:2, j:9,  name:'ՄԱՏԵՆԱԴԱՐԱՆ' },
  opera:       { i:3, j:6,  name:'ՕՊԵՐԱ' },
  gallery:     { i:4, j:5,  name:'ՊԱՏԿԵՐԱՍՐԱՀ' },
  square:      { i:5, j:5,  name:'ՀՐԱՊԱՐԱԿ' },
  northAve:    { i:7, j:5,  name:'ՀՅՈՒՍ. ՊՈՂՈՏԱ' },
  marriott:    { i:5, j:3,  name:'ՄԱՐԻՈԹ' },
  university:  { i:7, j:3,  name:'ՀԱՄԱԼՍԱՐԱՆ' }
};

const S = {
  phase:'loading', x:0, z:0, heading:0, speed:0, steer:0,
  camX:0, camY:0, camZ:0, camLX:0, camLY:0, camLZ:0,
  camPitch:0.25, camDist:6.5,
  loc:'Երևան', suspensionY:0, suspensionV:0, targetSusp:0,
  bodyRoll:0, bodyRollV:0, targetRoll:0
};
const IN = { gas:false, brake:false, left:false, right:false };

/* ═══════ ՌԵԼԻԵՖ — Կասկադ + Մատենադարան բարձրադիր ═══════ */
function terrainHeight(x, z){
  let y = 0;
  // Կասկադի բլուր — հյուսիս (z+), ամենաբարձր
  const dc = Math.hypot(x - 0, z - 380);
  y += 55 * Math.exp(-dc*dc / 55000);
  // Մատենադարանի բլուր — հս-արմ
  const dm = Math.hypot(x + 250, z - 320);
  y += 32 * Math.exp(-dm*dm / 28000);
  // Ընդհանուր թեք դեպի հյուսիս
  y += Math.max(0, z) * 0.06;
  // Ալիքներ
  y += 1.2 * Math.sin(x*0.012) * Math.cos(z*0.011);
  return Math.max(0, y);
}

function nodeX(i){ return -HALF_CITY + i*SPACING; }
function nodeZ(j){ return -HALF_CITY + j*SPACING; }

/* ═══════ THREE ═══════ */
const app = document.getElementById('app');
const cvs = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas:cvs, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec7e8);
scene.fog = new THREE.Fog(0xb8d4e8, 200, 550);

const camera = new THREE.PerspectiveCamera(60, 16/9, 0.3, 900);

/* ԵՐԿԻՆՔ */
(function(){
  const g = new THREE.SphereGeometry(700, 32, 16);
  const m = new THREE.ShaderMaterial({
    uniforms:{ cT:{value:new THREE.Color(0x3a7fd0)}, cM:{value:new THREE.Color(0xa8cae8)}, cH:{value:new THREE.Color(0xf8e0b8)} },
    vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform vec3 cT,cM,cH;varying vec3 vP;void main(){float h=normalize(vP).y;vec3 col=h>0.0?mix(cM,cT,pow(h,0.6)):cM;float hor=exp(-abs(h)*6.0);col=mix(col,cH,hor*0.65);gl_FragColor=vec4(col,1.0);}',
    side:THREE.BackSide, depthWrite:false, fog:false
  });
  scene.add(new THREE.Mesh(g,m));
})();

/* ԼՈՒՅՍԵՐ */
scene.add(new THREE.HemisphereLight(0xc8e0f8, 0x8a7a5a, 0.75));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.35);
sun.position.set(-100, 200, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 400;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
scene.add(sun);
const sunTarget = new THREE.Object3D();
scene.add(sunTarget);
sun.target = sunTarget;
const fill = new THREE.DirectionalLight(0xc8d8ff, 0.3);
fill.position.set(100, 80, -100);
scene.add(fill);

/* ԳԵՏԻՆ — ռելիեֆով */
const TERRAIN_SIZE = CITY_SIZE + 400;
const TERRAIN_RES = 160;
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_RES, TERRAIN_RES);
terrainGeo.rotateX(-Math.PI/2);
(function(){
  const pos = terrainGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, terrainHeight(x, z));
  }
  pos.needsUpdate = true;
  terrainGeo.computeVertexNormals();
})();
// Խոտի տեքստուրա
function makeGrassTex(){
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 256;
  const x = cv.getContext('2d');
  x.fillStyle = '#7a9a55'; x.fillRect(0,0,256,256);
  for(let i=0;i<7000;i++){
    const r = Math.random();
    x.fillStyle = r>0.66 ? '#8aaa60' : r>0.33 ? '#6a8a48' : '#5a7a3a';
    x.fillRect(Math.random()*256, Math.random()*256, 1.5, 2);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(30, 30);
  t.encoding = THREE.sRGBEncoding;
  return t;
}
const terrainMat = new THREE.MeshStandardMaterial({ map:makeGrassTex(), roughness:1 });
const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
terrainMesh.receiveShadow = true;
scene.add(terrainMesh);

/* ═══════ ՃԱՆԱՊԱՐՀՆԵՐ + ՄԱՅԹԵՐ ═══════ */
function addStrip(pos, uv, idx, x1, z1, x2, z2, width, yOff, uvScale){
  const base = pos.length/3;
  const dx = x2-x1, dz = z2-z1;
  const len = Math.hypot(dx, dz);
  const N = Math.max(2, Math.ceil(len/5));
  const px = -dz/len, pz = dx/len;
  for(let i=0;i<=N;i++){
    const t = i/N;
    const cx = x1 + dx*t, cz = z1 + dz*t;
    const lx = cx + px*width/2, lz = cz + pz*width/2;
    const rx = cx - px*width/2, rz = cz - pz*width/2;
    pos.push(lx, terrainHeight(lx,lz)+yOff, lz);
    pos.push(rx, terrainHeight(rx,rz)+yOff, rz);
    const uvT = t*len*uvScale;
    uv.push(0, uvT, 1, uvT);
  }
  for(let i=0;i<N;i++){
    const a = base+i*2, b = base+i*2+1, c = base+(i+1)*2, d = base+(i+1)*2+1;
    idx.push(a,c,b, b,c,d);
  }
}
function addQuad(pos, uv, idx, x1, z1, x2, z2, x3, z3, x4, z4, yOff, uvScale){
  const base = pos.length/3;
  pos.push(x1, terrainHeight(x1,z1)+yOff, z1);
  pos.push(x2, terrainHeight(x2,z2)+yOff, z2);
  pos.push(x3, terrainHeight(x3,z3)+yOff, z3);
  pos.push(x4, terrainHeight(x4,z4)+yOff, z4);
  const s = uvScale||1;
  uv.push(0,0, 1*s,0, 1*s,1*s, 0,1*s);
  idx.push(base,base+1,base+2, base,base+2,base+3);
}

function makeAsphaltTex(){
  const cv = document.createElement('canvas');
  cv.width=256; cv.height=256;
  const x = cv.getContext('2d');
  x.fillStyle = '#3a3d42'; x.fillRect(0,0,256,256);
  for(let i=0;i<3500;i++){
    x.fillStyle = Math.random()>0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.07)';
    x.fillRect(Math.random()*256, Math.random()*256, 1.5, 1.5);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function makeWalkTex(){
  const cv = document.createElement('canvas');
  cv.width=128; cv.height=128;
  const x = cv.getContext('2d');
  x.fillStyle = '#c8c0b0'; x.fillRect(0,0,128,128);
  x.strokeStyle = 'rgba(120,110,100,0.5)'; x.lineWidth = 1.5;
  for(let i=0;i<=4;i++){
    x.beginPath(); x.moveTo(i*32,0); x.lineTo(i*32,128); x.stroke();
    x.beginPath(); x.moveTo(0,i*32); x.lineTo(128,i*32); x.stroke();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function makeRoadWithLinesTex(){
  const cv = document.createElement('canvas');
  cv.width=128; cv.height=256;
  const x = cv.getContext('2d');
  x.fillStyle = '#3a3d42'; x.fillRect(0,0,128,256);
  for(let i=0;i<2500;i++){
    x.fillStyle = Math.random()>0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.07)';
    x.fillRect(Math.random()*128, Math.random()*256, 1.5, 1.5);
  }
  x.fillStyle = '#e8b830';
  x.fillRect(60,0,4,256); x.fillRect(66,0,4,256);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
const asphaltTex = makeAsphaltTex();
const walkTex = makeWalkTex();
const roadTex = makeRoadWithLinesTex();

const roadPositions=[], roadUVs=[], roadIndices=[];
const walkPositions=[], walkUVs=[], walkIndices=[];
const interPositions=[], interUVs=[], interIndices=[];

function edgeExists(i, j, dir){
  // Բաց թողնում ենք որոշ եզրեր վայրերի տարածքում
  if (dir === 'h' && i === 4 && j === 5) return false;
  if (dir === 'v' && i === 5 && j === 4) return false;
  if (dir === 'h' && i === 6 && j === 5) return false;
  if (dir === 'h' && i === 4 && j === 9) return false;
  if (dir === 'v' && i === 5 && j === 5) return false;
  return true;
}

// Հորիզոնական ճանապարհներ
for(let j = 0; j < GRID_N; j++){
  for(let i = 0; i < GRID_N - 1; i++){
    if(!edgeExists(i,j,'h')) continue;
    addStrip(roadPositions, roadUVs, roadIndices, nodeX(i), nodeZ(j), nodeX(i+1), nodeZ(j), ROAD_W, 0.06, 0.06);
  }
}
// Ուղղահայաց
for(let i = 0; i < GRID_N; i++){
  for(let j = 0; j < GRID_N - 1; j++){
    if(!edgeExists(i,j,'v')) continue;
    addStrip(roadPositions, roadUVs, roadIndices, nodeX(i), nodeZ(j), nodeX(i), nodeZ(j+1), ROAD_W, 0.061, 0.06);
  }
}

const SWI = ROAD_W/2 + SIDEWALK_W;

// Մայթեր
for(let j = 0; j < GRID_N; j++){
  for(let i = 0; i < GRID_N - 1; i++){
    if(!edgeExists(i,j,'h')) continue;
    const x1 = nodeX(i)+SWI, x2 = nodeX(i+1)-SWI, z = nodeZ(j);
    if(x1 >= x2) continue;
    addStrip(walkPositions, walkUVs, walkIndices, x1, z+ROAD_W/2+SIDEWALK_W/2, x2, z+ROAD_W/2+SIDEWALK_W/2, SIDEWALK_W, 0.22, 0.3);
    addStrip(walkPositions, walkUVs, walkIndices, x1, z-ROAD_W/2-SIDEWALK_W/2, x2, z-ROAD_W/2-SIDEWALK_W/2, SIDEWALK_W, 0.22, 0.3);
  }
}
for(let i = 0; i < GRID_N; i++){
  for(let j = 0; j < GRID_N - 1; j++){
    if(!edgeExists(i,j,'v')) continue;
    const z1 = nodeZ(j)+SWI, z2 = nodeZ(j+1)-SWI, x = nodeX(i);
    if(z1 >= z2) continue;
    addStrip(walkPositions, walkUVs, walkIndices, x+ROAD_W/2+SIDEWALK_W/2, z1, x+ROAD_W/2+SIDEWALK_W/2, z2, SIDEWALK_W, 0.22, 0.3);
    addStrip(walkPositions, walkUVs, walkIndices, x-ROAD_W/2-SIDEWALK_W/2, z1, x-ROAD_W/2-SIDEWALK_W/2, z2, SIDEWALK_W, 0.22, 0.3);
  }
}
// Խաչմերուկների անկյունային մայթեր
for(let i = 0; i < GRID_N; i++){
  for(let j = 0; j < GRID_N; j++){
    const cx = nodeX(i), cz = nodeZ(j);
    const w2 = ROAD_W/2, sw = SIDEWALK_W;
    const corners = [
      [cx+w2, cz+w2, cx+w2+sw, cz+w2+sw],
      [cx-w2-sw, cz+w2, cx-w2, cz+w2+sw],
      [cx+w2, cz-w2-sw, cx+w2+sw, cz-w2],
      [cx-w2-sw, cz-w2-sw, cx-w2, cz-w2]
    ];
    for(const c of corners){
      addQuad(walkPositions, walkUVs, walkIndices, c[0],c[1], c[2],c[1], c[2],c[3], c[0],c[3], 0.22, 0.3);
    }
    addQuad(interPositions, interUVs, interIndices, cx-w2,cz-w2, cx+w2,cz-w2, cx+w2,cz+w2, cx-w2,cz+w2, 0.07, 0.15);
  }
}

function makeMesh(pos, uv, idx, material){
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
  const m = new THREE.Mesh(geo, material);
  m.receiveShadow = true;
  m.frustumCulled = false;
  return m;
}
scene.add(makeMesh(roadPositions, roadUVs, roadIndices, new THREE.MeshStandardMaterial({ map:roadTex, roughness:0.9, metalness:0.02 })));

/* ═══════ ՇԵՆՔԵՐ ═══════ */
function makeBuildingTex(hue){
  const cv = document.createElement('canvas');
  cv.width = 128; cv.height = 256;
  const x = cv.getContext('2d');
  const baseColors = ['#e0d0b8','#d8c8a8','#e8d8c8','#d0c0a8','#e8dcc8','#d8ccc0'];
  x.fillStyle = baseColors[hue % baseColors.length];
  x.fillRect(0,0,128,256);
  for(let i=0;i<1500;i++){
    x.fillStyle = `rgba(120,100,80,${Math.random()*0.1})`;
    x.fillRect(Math.random()*128, Math.random()*256, 3, 2);
  }
  const cols = 4, rows = 10;
  const cw = 128/cols, ch = 256/rows;
  for(let r=1;r<rows-1;r++){
    for(let c=0;c<cols;c++){
      x.fillStyle = '#3a4a5a';
      x.fillRect(c*cw+6, r*ch+6, cw-12, ch-12);
      x.fillStyle = Math.random()>0.5 ? '#6a8aa8' : '#4a6a88';
      x.fillRect(c*cw+7, r*ch+7, cw-14, ch-14);
      x.fillStyle = 'rgba(255,255,255,0.35)';
      x.fillRect(c*cw+8, r*ch+8, (cw-16)*0.4, (ch-16)*0.4);
    }
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
const BLD_MATS = [];
for(let i=0;i<6;i++){
  BLD_MATS.push(new THREE.MeshStandardMaterial({ map:makeBuildingTex(i), roughness:0.85, metalness:0.05 }));
}
const BOX_GEO = new THREE.BoxGeometry(1,1,1);
const buildings = [];
const BLD_COLLISION = [];

for(let i = 0; i < GRID_N - 1; i++){
  for(let j = 0; j < GRID_N - 1; j++){
    let skip = false;
    for(const k in LANDMARKS){
      const L = LANDMARKS[k];
      if(Math.abs(L.i-i) <= 1 && Math.abs(L.j-j) <= 1){ skip = true; break; }
    }
    if(skip) continue;
    // Cascade-ի շուրջը ազատ թողնենք (բլրի վրա)
    if(j >= 8) continue;
    const cellCX = nodeX(i)+SPACING/2;
    const cellCZ = nodeZ(j)+SPACING/2;
    const usable = SPACING - ROAD_W - 2*SIDEWALK_W;
    if(usable < 8) continue;
    const w = usable*(0.55 + Math.random()*0.3);
    const d = usable*(0.55 + Math.random()*0.3);
    const h = 12 + Math.random()*26;
    const bx = cellCX + (Math.random()-0.5)*(usable-w)*0.8;
    const bz = cellCZ + (Math.random()-0.5)*(usable-d)*0.8;
    const m = new THREE.Mesh(BOX_GEO, BLD_MATS[Math.floor(Math.random()*BLD_MATS.length)]);
    m.scale.set(w,h,d);
    m.position.set(bx, terrainHeight(bx,bz)+h/2, bz);
    m.rotation.y = Math.round(Math.random()*4) * Math.PI/2;
    m.castShadow = true;
    m.receiveShadow = true;
    scene.add(m);
    buildings.push(m);
    BLD_COLLISION.push({ x:bx, z:bz, w, d, h });
  }
}

function buildCascade(cx, cz){
  const g = new THREE.Group();
  const rockMat = new THREE.MeshStandardMaterial({ color:0xb8a890, roughness:0.95 });
  const darkRockMat = new THREE.MeshStandardMaterial({ color:0x8a7a68, roughness:0.95 });
  const tuffMat = new THREE.MeshStandardMaterial({ color:0xd8c8a8, roughness:0.9 });
  const waterMat = new THREE.MeshStandardMaterial({ color:0x4a8ac8, roughness:0.15, metalness:0.6 });
  const baseY = terrainHeight(cx, cz);

  // Ժայռի հիմք — մեծ ամուր զանգված
  for(let s = 0; s < 6; s++){
    const levelY = baseY + s * 4;
    const width = 40 - s * 4;
    const depth = 24 - s * 3;

    // Հիմնական ժայռի բլոկ
    const rock = new THREE.Mesh(
      new THREE.BoxGeometry(width, 3.5, depth),
      s % 2 === 0 ? rockMat : darkRockMat
    );
    rock.position.set(0, levelY + 1.75, s * 2.5);
    rock.castShadow = true;
    rock.receiveShadow = true;
    g.add(rock);

    // Ջրի ավազան
    const pool = new THREE.Mesh(
      new THREE.BoxGeometry(width - 8, 0.6, depth - 8),
      waterMat
    );
    pool.position.set(0, levelY + 3.7, s * 2.5);
    g.add(pool);

    // Աջ ու ձախ ժայռեր
    [-1, 1].forEach(side => {
      const tower = new THREE.Mesh(
        new THREE.BoxGeometry(6, 6, 8),
        rockMat
      );
      tower.position.set(side * (width/2 + 3), levelY + 3, s * 2.5);
      tower.castShadow = true;
      g.add(tower);
    });
  }

  // Գագաթին հուշարձան-սյուն
  const pillar = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 2, 12, 12),
    tuffMat
  );
  pillar.position.set(0, baseY + 6*4 + 6, 15);
  pillar.castShadow = true;
  g.add(pillar);

  // Աջ ու ձախ մեծ կամարներ (Կասկադի կողային մուտքեր)
  [-1, 1].forEach(side => {
    for(let s = 0; s < 6; s++){
      const arch = new THREE.Mesh(
        new THREE.BoxGeometry(3, 4, 6),
        tuffMat
      );
      arch.position.set(side * 22, baseY + s*4 + 2, s * 2.5);
      arch.castShadow = true;
      g.add(arch);
    }
  });

  g.position.set(cx, 0, cz);
  scene.add(g);

  // Collision-ներ՝ յուրաքանչյուր հարթակ
  for(let s = 0; s < 6; s++){
    const w = 44 - s * 4;
    BLD_COLLISION.push({
      x: cx,
      z: cz + s * 2.5,
      w: w,
      d: 24 - s * 3,
      h: 4
    });
  }
}

// Հատուկ ճանապարհ՝ միանում է ցանցին, բարձրանում է Կասկադ
const windRoadCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(nodeX(5), 0, nodeZ(6) + 30),
  new THREE.Vector3(nodeX(5) - 40, 0, nodeZ(7) + 10),
  new THREE.Vector3(nodeX(5) + 50, 0, nodeZ(8) - 10),
  new THREE.Vector3(nodeX(5) - 30, 0, nodeZ(8) + 40),
  new THREE.Vector3(nodeX(5) + 10, 0, nodeZ(9) + 20),
  new THREE.Vector3(nodeX(5), 0, nodeZ(9) + 60)
], false, 'catmullrom', 0.5);

(function buildWindingRoad(){
  const pts = windRoadCurve.getPoints(60);
  // Բարձրությունները ձևափոխենք ըստ տեղանքի
  for(const p of pts){
    p.y = terrainHeight(p.x, p.z) + 0.15;
  }

  const roadW = 10;
  const pos = [], uv = [], idx = [];
  for(let i=0;i<pts.length-1;i++){
    const p1 = pts[i], p2 = pts[i+1];
    const dx = p2.x-p1.x, dz = p2.z-p1.z;
    const len = Math.hypot(dx,dz);
    if(len < 0.01) continue;
    const nx = -dz/len, nz = dx/len;
    const base = pos.length/3;
    pos.push(p1.x + nx*roadW/2, p1.y, p1.z + nz*roadW/2);
    pos.push(p1.x - nx*roadW/2, p1.y, p1.z - nz*roadW/2);
    pos.push(p2.x + nx*roadW/2, p2.y, p2.z + nz*roadW/2);
    pos.push(p2.x - nx*roadW/2, p2.y, p2.z - nz*roadW/2);
    uv.push(0,0, 1,0, 0,1, 1,1);
    idx.push(base,base+1,base+2, base+1,base+3,base+2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map:roadTex.clone(), roughness:0.9 }));
  mesh.receiveShadow = true;
  scene.add(mesh);
})();

  // ═══ ԱՆԻՎՆԵՐ (մանրամասն) ═══
  function makeWheel(){
    const steer = new THREE.Group();
    const roll = new THREE.Group();
    steer.add(roll);

    // Անվադող (torus, axle-ը X-ի ուղղությամբ)
    const tireGeo = new THREE.TorusGeometry(0.42, 0.15, 10, 24);
    tireGeo.rotateY(Math.PI/2);
    const tire = new THREE.Mesh(tireGeo, tireMat);
    tire.castShadow = true;
    roll.add(tire);

    // Սկավառակ (rim disc)
    const discGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.24, 20);
    discGeo.rotateZ(Math.PI/2);
    const disc = new THREE.Mesh(discGeo, rimMat);
    roll.add(disc);

    // ⚠️ ՇՊԻՑԵՐ (5 հատ) — սահուն պտտվող
    for(let i = 0; i < 5; i++){
      const a = (i / 5) * Math.PI * 2;
      const spokeGeo = new THREE.BoxGeometry(0.06, 0.055, 0.5);
      const spoke = new THREE.Mesh(spokeGeo, rimMat);
      // Պտտում ենք X-ի շուրջ
      spoke.rotation.x = a;
      // Տեղադրում ենք արտաքին հատվածում
      spoke.position.set(0, Math.sin(a) * 0.02, 0);
      // Շարժում ենք երկայնքով (local Z)
      const dirY = Math.sin(a), dirZ = Math.cos(a);
      spoke.position.y = dirY * 0.14;
      spoke.position.z = dirZ * 0.14;
      // Երկարացնում ենք
      spoke.scale.z = 0.95;
      roll.add(spoke);
    }

    // Կենտրոնական cap (hubcap)
    const capGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.26, 12);
    capGeo.rotateZ(Math.PI/2);
    const cap = new THREE.Mesh(capGeo, chromeMat);
    roll.add(cap);

    // Արտաքին օղակ (chrome rim edge)
    const ringGeo = new THREE.TorusGeometry(0.3, 0.03, 6, 20);
    ringGeo.rotateY(Math.PI/2);
    const ring = new THREE.Mesh(ringGeo, chromeMat);
    roll.add(ring);

    return { steer, roll };
  }

  const wheels = [];
  const wheelPositions = [
    { x: -1.02, z: 1.5, tag: 'fl' },
    { x:  1.02, z: 1.5, tag: 'fr' },
    { x: -1.02, z: -1.5, tag: 'rl' },

  ];
  for(const wp of wheelPositions){

  const brakeLight = new THREE.PointLight(0xff2020, 0, 6);

  return { group:g, wheels, brakeLight, tailMat };
}

/* ═══════ ՖԻԶԻԿԱ ═══════ */
function updatePhysics(dt){
  // ՂԵԿ
  let target = 0;
  if(IN.left) target = -1;
  if(IN.right) target = 1;
  S.steer += (target - S.steer) * Math.min(1, 6 * dt);
  if(!IN.left && !IN.right){
    S.steer += (0 - S.steer) * Math.min(1, 5 * dt);
    if(Math.abs(S.steer) < 0.003) S.steer = 0;
  }

  // ԳԱԶ
  if(IN.gas){
    S.speed += (S.speed < 40 ? 34 : 20) * dt;
  }
  // ՀԵՏ
  if(IN.brake){
    if(S.speed > 0.5) S.speed -= 58 * dt;
    else S.speed -= 26 * dt;
  }
  // ԻՆԵՐՑԻԱ
  if(!IN.gas && !IN.brake){
    if(S.speed > 0.05) S.speed -= 9 * dt;
    else if(S.speed < -0.05) S.speed += 9 * dt;
    else S.speed = 0;
  }

  // ԹԵՔՈՒԹՅՈՒՆ
  const fx = Math.sin(S.heading), fz = Math.cos(S.heading);
  const aheadH = terrainHeight(S.x + fx*6, S.z + fz*6);
  const behindH = terrainHeight(S.x - fx*6, S.z - fz*6);
  const slope = (aheadH - behindH) / 12;
  S.speed -= slope * 18 * dt;

  S.speed = Math.max(-MAX_REV_KMH, Math.min(MAX_KMH, S.speed));

  // ՊՏՈՒՅՏ
  const v = S.speed / 3.6;
  const spdFac = Math.min(1, v / 10);
  const turnRate = 1.65 * spdFac;
  S.heading -= S.steer * turnRate * dt;

  const nfx = Math.sin(S.heading), nfz = Math.cos(S.heading);
  S.x += nfx * v * dt;
  S.z += nfz * v * dt;

  const lim = HALF_CITY + 80;
  S.x = Math.max(-lim, Math.min(lim, S.x));
  S.z = Math.max(-lim, Math.min(lim, S.z));

  // ՇԵՆՔԵՐԻ ՀԵՏ ԲԱԽՈՒՄ
  for(const b of BLD_COLLISION){
    const hw = b.w/2 + 1.2, hd = b.d/2 + 1.2;
    const dx = S.x - b.x, dz = S.z - b.z;
    if(Math.abs(dx) < hw && Math.abs(dz) < hd){
      const ox = hw - Math.abs(dx), oz = hd - Math.abs(dz);
      if(ox < oz) S.x = b.x + Math.sign(dx) * hw;
      else S.z = b.z + Math.sign(dz) * hd;
      S.speed *= 0.5;
      S.targetSusp = -0.15;
    }
  }

  // ⚠️ ՏԵՍՔ + ԱՄՈՐՏԻԶԱՑԻԱ
  const groundY = terrainHeight(S.x, S.z);
  const y = groundY + S.suspensionY;
  player.group.position.set(S.x, y, S.z);
  player.group.rotation.y = S.heading;

  // Կողային թեքվածություն (roll) ըստ ղեկի + արագության
  const terrainRoll = Math.atan2(terrainHeight(S.x-1,S.z)-terrainHeight(S.x+1,S.z), 2) * 0.75;
  S.targetRoll = -S.steer * 0.06 + terrainRoll;
  // ⚠️ Սահուն ամորտիզացիա
  S.bodyRollV += (S.targetRoll - S.bodyRoll) * 14 * dt - S.bodyRollV * 6 * dt;
  S.bodyRoll += S.bodyRollV * dt;
  player.group.rotation.z = S.bodyRoll;

  // ⚠️ Կախոց (suspension) — վեր-ներքև
  S.suspensionV += (S.targetSusp - S.suspensionY) * 55 * dt - S.suspensionV * 8 * dt;
  S.suspensionY += S.suspensionV * dt;
  S.targetSusp *= Math.pow(0.1, dt);  // աստիճանաբար հանգչում է

  // ⚠️ Ներս նստելը կախոցի պատճառով
  player.group.scale.y = 1 + S.suspensionY * 0.15;

  // ⚠️ ԱՆԻՎՆԵՐԻ ՊՏՈՒՅՏ — steer group-ը պտտվում է Y-ով, roll group-ը X-ով
  const spin = v * dt * 1.9;
  for(const w of player.wheels){
    w.roll.rotation.x -= spin;
    if(w.tag === 'fl' || w.tag === 'fr'){
      w.steer.rotation.y = S.steer * 0.5;
    }
  }

  // Brake light
  const braking = IN.brake || (!IN.gas && S.speed > 3);
  player.brakeLight.intensity = braking ? 1.5 : 0;
  player.tailMat.color.setHex(braking ? 0xff1010 : 0xff2222);

  updateLocationName();
}

function updateLocationName(){
  let closest = 'Երևան';
  let minD = Infinity;
  for(const k in LANDMARKS){
    const L = LANDMARKS[k];
    const lx = nodeX(L.i)+SPACING/2;
    const lz = nodeZ(L.j)+SPACING/2;
    const d = Math.hypot(S.x-lx, S.z-lz);
    if(d < minD){ minD = d; closest = L.name; }
  }
  S.loc = minD < 100 ? closest : 'Երևան';
  document.getElementById('locName').textContent = S.loc;
}

/* ═══════ ԿԱՄԵՐԱ ═══════ */
function updateCamera(dt){
  const h = S.heading;
  const fx = Math.sin(h), fz = Math.cos(h);
  // ⚠️ ԱՎԵԼԻ ՄՈՏԻԿ, մեքենան ավելի մեծ երևա
  const dist = S.camDist - S.camPitch * 1.2;
  const high = 2.8 + S.camPitch * 3.5;
  const tx = S.x - fx*dist;
  const tz = S.z - fz*dist;
  const ty = terrainHeight(tx, tz) + high;
  const k = 1 - Math.exp(-8 * dt);
  S.camX += (tx-S.camX)*k;
  S.camY += (ty-S.camY)*k;
  S.camZ += (tz-S.camZ)*k;
  const lx = S.x + fx*10;
  const lz = S.z + fz*10;
  const ly = terrainHeight(S.x, S.z) + 1.2;
  const lk = 1 - Math.exp(-10 * dt);
  S.camLX += (lx-S.camLX)*lk;
  S.camLY += (ly-S.camLY)*lk;
  S.camLZ += (lz-S.camLZ)*lk;
  camera.position.set(S.camX, S.camY, S.camZ);
  camera.lookAt(S.camLX, S.camLY, S.camLZ);
  const tFov = 62 + Math.abs(S.speed/MAX_KMH) * 8;
  camera.fov += (tFov - camera.fov) * Math.min(1, 3*dt);
  camera.updateProjectionMatrix();
  camera.rotation.z += S.steer * 0.018;

  // Արևը հետևում է
  sunTarget.position.copy(player.group.position);
  sun.position.copy(player.group.position).add(new THREE.Vector3(-100, 200, 80));
}

}

/* ═══════ ՁԱՅՆ ═══════ */
const Aud = {
  ctx:null, ready:false, _master:null, engGain:null, engFilt:null, o1:null, o2:null,
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this._master = this.ctx.createGain(); this._master.gain.value = 0.6;
    this._master.connect(this.ctx.destination);
    this.engGain = this.ctx.createGain(); this.engGain.gain.value = 0;
    this.engFilt = this.ctx.createBiquadFilter(); this.engFilt.type = 'lowpass';
    this.engFilt.frequency.value = 400;
    this.engFilt.connect(this.engGain);
    this.engGain.connect(this._master);
    this.o1 = this.ctx.createOscillator(); this.o1.type = 'sine'; this.o1.frequency.value = 45;
    const g1 = this.ctx.createGain(); g1.gain.value = 1;
    this.o1.connect(g1); g1.connect(this.engFilt); this.o1.start();
    this.o2 = this.ctx.createOscillator(); this.o2.type = 'triangle'; this.o2.frequency.value = 68;
    const g2 = this.ctx.createGain(); g2.gain.value = 0.5;
    this.o2.connect(g2); g2.connect(this.engFilt); this.o2.start();
    this.ready = true;
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setEngine(kmh, gas, run){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const a = Math.abs(kmh);
    const f = 40 + a * 0.9;
    this.o1.frequency.setTargetAtTime(f, t, 0.14);
    this.o2.frequency.setTargetAtTime(f*1.5, t, 0.14);
    this.engFilt.frequency.setTargetAtTime(300 + a*5 + (gas?200:0), t, 0.2);
    this.engGain.gain.setTargetAtTime(run ? (0.05 + (a/MAX_KMH)*0.1) : 0, t, 0.25);
  },
  beep(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = 660;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.15);
    o.connect(g); g.connect(this._master);
    o.start(t); o.stop(t+0.2);
  }
};

function bindHold(el, key){
  const on = e => { e.preventDefault(); IN[key]=true; el.classList.add('on'); Aud.init(); Aud.resume(); };
  const off = e => { e.preventDefault(); IN[key]=false; el.classList.remove('on'); };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off); el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
}

  if(k==='arrowup'||k==='w') IN.gas = true;

});

(function(){
  const z = document.getElementById('camZone');
  let drag = false, sy = 0, sp = 0;
  const dn = e => { e.preventDefault(); drag=true; const t=e.touches?e.touches[0]:e; sy=t.clientY; sp=S.camPitch; };
  const mv = e => {
    if(!drag) return;
    e.preventDefault();
    const t = e.touches?e.touches[0]:e;
    const dy = t.clientY - sy;
    S.camPitch = Math.max(0.05, Math.min(0.85, sp - dy/320));

  const up = ()=> drag=false;
  z.addEventListener('touchstart', dn, {passive:false});
  z.addEventListener('touchmove', mv, {passive:false});
  z.addEventListener('touchend', up);
  z.addEventListener('mousedown', dn);
  addEventListener('mousemove', mv);
  addEventListener('mouseup', up);
})();

/* ═══════ HOME SCREEN → AUTO-START ═══════ */
function startGame(){
  // ՍԿԶԲՆԱԿԱՆ ՏԵՂ — ճանապարհի կենտրոն, ուղղված դեպի Կասկադ
  S.x = nodeX(5) + SPACING/2;
  S.z = nodeZ(3);
  S.heading = 0;   // +Z ուղղություն (հյուսիս, դեպի Կասկադ)
  S.speed = 0;
  S.steer = 0;
  S.suspensionY = 0; S.suspensionV = 0; S.targetSusp = 0;
  S.bodyRoll = 0; S.bodyRollV = 0;

  const dist = S.camDist, fx = Math.sin(S.heading), fz = Math.cos(S.heading);
  S.camX = S.x - fx*dist;
  S.camY = terrainHeight(S.x - fx*dist, S.z - fz*dist) + 3;
  S.camZ = S.z - fz*dist;
  S.camLX = S.x + fx*10;
  S.camLY = terrainHeight(S.x, S.z) + 1.2;
  S.camLZ = S.z + fz*10;

  player.group.position.set(S.x, terrainHeight(S.x, S.z), S.z);
  player.group.rotation.y = S.heading;
  player.group.rotation.z = 0;

  S.phase = 'play';
  document.getElementById('homeScreen').classList.add('hide');
  updateLocationName();
  Aud.init(); Aud.resume();
}

addEventListener('orientationchange', ()=>setTimeout(resize, 150));

/* ═══════ ՑԻԿԼ ═══════ */
let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const rawDt = Math.min(0.4, (now - lastT) / 1000);
  lastT = now;
  const dt = Math.min(0.028, rawDt);

  if(S.phase === 'play'){
    updatePhysics(dt);
  }
  updateCamera(dt);
  updateHUD();
  Aud.setEngine(S.speed, IN.gas, S.phase === 'play');
  renderer.render(scene, camera);
}

/* ═══════ INIT ═══════ */
resize();
// Սկզբնական դիրք
S.x = nodeX(5) + SPACING/2;
S.z = nodeZ(3);
S.heading = 0;
S.camX = S.x; S.camY = terrainHeight(S.x, S.z) + 3; S.camZ = S.z - S.camDist;
S.camLX = S.x; S.camLY = terrainHeight(S.x, S.z) + 1.2; S.camLZ = S.z + 10;
player.group.position.set(S.x, terrainHeight(S.x, S.z), S.z);
player.group.rotation.y = S.heading;
updateLocationName();
requestAnimationFrame(loop);

['touchstart','mousedown','keydown'].forEach(ev => {
  window.addEventListener(ev, ()=>{ Aud.init(); Aud.resume(); }, {once:true});
});

// ⚠️ AUTO-START — հղումով մտնելուն պես խաղի մեջ է
// Home screen-ը ցույց ենք տալիս 1.2 վրկ, հետո ավտոմատ սկսում
let progress = 0;
const fill = document.getElementById('loadingFill');
const iv = setInterval(()=>{
  progress += 10;
  fill.style.width = progress + '%';
  if(progress >= 100){
    clearInterval(iv);
    setTimeout(()=>{
      startGame();
    }, 250);
  }
}, 80);

})();
</script>
</body>
</html>
